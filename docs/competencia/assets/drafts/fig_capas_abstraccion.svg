<svg viewBox="0 0 1440 1800" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Inter', Arial, sans-serif">
  <!-- ============================================================
       Fig. — El robot por capas de abstraccion
       Pregunta: Como se organiza el control, de lo que decide a lo que mueve?
       Print math: viewBox 1440 px -> ancho impreso ~360 mm => 0.25 mm/px.
       Cuerpo 36 px = 9.0 mm ~ 25.5 pt (>=24 pt OK). Titulo banda 44 px = 11 mm ~ 31 pt.
       Titulo figura 64 px = 16 mm ~ 45 pt. Notas/caption 30 px = 7.5 mm ~ 21 pt (tier caption).
       Paleta firma: TOP #1D4E89 / CENTRAL #E8731A / DOWN #1E8A4C / rojo seguridad #C8102E / gris.
       ============================================================ -->
  <defs>
    <marker id="down" markerWidth="14" markerHeight="14" refX="6" refY="11" orient="auto">
      <path d="M1 1 L6 11 L11 1" fill="none" stroke="#444" stroke-width="2.4"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f6f8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1440" height="1800" fill="url(#bg)"/>

  <!-- ===== Titulo ===== -->
  <text x="48" y="74" font-size="64" font-weight="800" fill="#222">El robot por capas de abstraccion</text>
  <text x="48" y="120" font-size="36" fill="#555">De lo que DECIDE a lo que MUEVE — cada capa usa la de abajo y oculta su complejidad</text>

  <!-- ===== columna izquierda: la pila de 6 bandas =====
       x banda: 48..980 (ancho 932). Carriles transversales: 1000..1392.
       Banda alto 200, gap 22. Empieza y=170.  -->

  <!-- flecha "USA / oculta" a la izquierda de la pila -->
  <text x="20" y="640" font-size="30" fill="#777" transform="rotate(-90 20 640)" text-anchor="middle">cada capa USA la de abajo  ·  oculta su complejidad hacia arriba</text>

  <!-- ===== Capa 5 — MISION / ARBITRO (rojo seguridad) ===== -->
  <g>
    <rect x="60" y="170" width="920" height="190" rx="14" fill="#FDECEE" stroke="#C8102E" stroke-width="3"/>
    <rect x="60" y="170" width="16" height="190" rx="6" fill="#C8102E"/>
    <text x="96" y="218" font-size="32" font-weight="800" fill="#C8102E">CAPA 5</text>
    <text x="230" y="218" font-size="44" font-weight="800" fill="#222">MISION / ARBITRO</text>
    <text x="96" y="266" font-size="36" fill="#333">START / STOP del arbitro RCJ por nivel GPIO (TOP).</text>
    <text x="96" y="312" font-size="36" fill="#333">Decide SI se juega. Fail-safe: cable suelto = STOP.</text>
    <text x="96" y="348" font-size="30" fill="#888">Banco 2026-06-02 (TASK-039)</text>
  </g>
  <line x1="520" y1="360" x2="520" y2="392" stroke="#444" stroke-width="2.6" marker-end="url(#down)"/>

  <!-- ===== Capa 4 — DECISION / FSM (naranja CENTRAL) ===== -->
  <g>
    <rect x="60" y="392" width="920" height="190" rx="14" fill="#FDF1E7" stroke="#E8731A" stroke-width="3"/>
    <rect x="60" y="392" width="16" height="190" rx="6" fill="#E8731A"/>
    <text x="96" y="440" font-size="32" font-weight="800" fill="#E8731A">CAPA 4</text>
    <text x="230" y="440" font-size="44" font-weight="800" fill="#222">DECISION — FSM dual</text>
    <text x="96" y="488" font-size="35" fill="#333">Delantero: KICKOFF &#8594; SEARCH &#8594; POSITION &#8594; APPROACH</text>
    <text x="96" y="534" font-size="35" fill="#333">Arquero: PATROL &#8594; INTERCEPT &#8594; CLEAR</text>
    <text x="96" y="570" font-size="30" fill="#888">Maquina de estados — decide QUE hacer. Corre en CENTRAL.</text>
  </g>
  <line x1="520" y1="582" x2="520" y2="614" stroke="#444" stroke-width="2.6" marker-end="url(#down)"/>

  <!-- ===== Capa 3 — MODELO DEL MUNDO (gris neutro, borde azul: vive en TOP) ===== -->
  <g>
    <rect x="60" y="614" width="920" height="190" rx="14" fill="#EEF2F6" stroke="#1D4E89" stroke-width="3"/>
    <rect x="60" y="614" width="16" height="190" rx="6" fill="#1D4E89"/>
    <text x="96" y="662" font-size="32" font-weight="800" fill="#1D4E89">CAPA 3</text>
    <text x="230" y="662" font-size="44" font-weight="800" fill="#222">MODELO DEL MUNDO</text>
    <text x="96" y="710" font-size="36" fill="#333">WorldSnapshot: pose, pelota + velocidad, arcos,</text>
    <text x="96" y="756" font-size="36" fill="#333">obstaculo, validez de heading, arbitro.</text>
    <text x="96" y="792" font-size="30" fill="#888">Un solo dato unificado. La FSM lee de aca, no de los sensores.</text>
  </g>
  <line x1="520" y1="804" x2="520" y2="836" stroke="#444" stroke-width="2.6" marker-end="url(#down)"/>

  <!-- ===== Capa 2 — PERCEPCION / FUSION (gris, 3 tags de placa) ===== -->
  <g>
    <rect x="60" y="836" width="920" height="190" rx="14" fill="#F1F3F5" stroke="#8a8a8a" stroke-width="3"/>
    <rect x="60" y="836" width="16" height="190" rx="6" fill="#8a8a8a"/>
    <text x="96" y="884" font-size="32" font-weight="800" fill="#666">CAPA 2</text>
    <text x="230" y="884" font-size="44" font-weight="800" fill="#222">PERCEPCION / FUSION</text>
    <text x="96" y="932" font-size="36" fill="#333">vision LAB + heading IMU + ToF  ·  linea + OTOS</text>
    <text x="96" y="978" font-size="36" fill="#333">Convierte sensores crudos en hechos del mundo.</text>
    <!-- tags de placa: que placa aporta que -->
    <rect x="540" y="900" width="124" height="46" rx="8" fill="#1D4E89"/>
    <text x="602" y="932" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">TOP</text>
    <rect x="676" y="900" width="150" height="46" rx="8" fill="#1E8A4C"/>
    <text x="751" y="932" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">DOWN</text>
    <rect x="838" y="900" width="124" height="46" rx="8" fill="#E8731A"/>
    <text x="900" y="932" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">CENTRAL</text>
  </g>
  <line x1="520" y1="1026" x2="520" y2="1058" stroke="#444" stroke-width="2.6" marker-end="url(#down)"/>

  <!-- ===== Capa 1 — CONTROL (naranja CENTRAL) ===== -->
  <g>
    <rect x="60" y="1058" width="920" height="190" rx="14" fill="#FDF1E7" stroke="#E8731A" stroke-width="3"/>
    <rect x="60" y="1058" width="16" height="190" rx="6" fill="#E8731A"/>
    <text x="96" y="1106" font-size="32" font-weight="800" fill="#E8731A">CAPA 1</text>
    <text x="230" y="1106" font-size="44" font-weight="800" fill="#222">CONTROL</text>
    <text x="96" y="1154" font-size="36" fill="#333">Cinematica inversa omni-3  +  3 PID</text>
    <text x="96" y="1200" font-size="36" fill="#333">+ piso de PWM por rueda {70, 70, 107}.</text>
    <text x="96" y="1236" font-size="30" fill="#888">Traduce "vx, vy, giro" a PWM de cada motor (cap de seguridad ~70%).</text>
  </g>
  <line x1="520" y1="1248" x2="520" y2="1280" stroke="#444" stroke-width="2.6" marker-end="url(#down)"/>

  <!-- ===== Capa 0 — PLANTA FISICA (gris oscuro) ===== -->
  <g>
    <rect x="60" y="1280" width="920" height="170" rx="14" fill="#3a3f44" stroke="#23272b" stroke-width="3"/>
    <rect x="60" y="1280" width="16" height="170" rx="6" fill="#1b1e21"/>
    <text x="96" y="1328" font-size="32" font-weight="800" fill="#cfd6dd">CAPA 0</text>
    <text x="230" y="1328" font-size="44" font-weight="800" fill="#fff">PLANTA FISICA</text>
    <text x="96" y="1376" font-size="36" fill="#e8ecef">Chasis KIWI: 3 ruedas omni a 120 grados + motores.</text>
    <text x="96" y="1420" font-size="30" fill="#aeb6bd">El hardware real que mueve al robot (ruedas a 330/210/90 grados).</text>
  </g>

  <!-- ===== Carriles transversales (concerns que CRUZAN todas las capas) ===== -->
  <text x="1196" y="150" font-size="32" font-weight="800" fill="#444" text-anchor="middle">CONCERNS TRANSVERSALES</text>
  <text x="1196" y="186" font-size="28" fill="#888" text-anchor="middle">cruzan TODAS las capas (no son capa)</text>

  <!-- 4 carriles verticales de 170 a 1450 -->
  <!-- POTENCIA -->
  <rect x="1004" y="200" width="92" height="1250" rx="12" fill="#FDF1E7" stroke="#E8731A" stroke-width="2.4" stroke-dasharray="2 0"/>
  <text x="1050" y="830" font-size="34" font-weight="800" fill="#9a4d10" text-anchor="middle" transform="rotate(-90 1050 830)">POTENCIA</text>
  <!-- COMUNICACIONES -->
  <rect x="1102" y="200" width="92" height="1250" rx="12" fill="#EEF2F6" stroke="#1D4E89" stroke-width="2.4"/>
  <text x="1148" y="830" font-size="34" font-weight="800" fill="#1D4E89" text-anchor="middle" transform="rotate(-90 1148 830)">COMUNICACIONES</text>
  <!-- TIMING -->
  <rect x="1200" y="200" width="92" height="1250" rx="12" fill="#EEF6F0" stroke="#1E8A4C" stroke-width="2.4"/>
  <text x="1246" y="830" font-size="34" font-weight="800" fill="#176d3c" text-anchor="middle" transform="rotate(-90 1246 830)">TIMING</text>
  <!-- FAIL-SAFE (rojo) -->
  <rect x="1298" y="200" width="92" height="1250" rx="12" fill="#FDECEE" stroke="#C8102E" stroke-width="2.4"/>
  <text x="1344" y="830" font-size="34" font-weight="800" fill="#C8102E" text-anchor="middle" transform="rotate(-90 1344 830)">FAIL-SAFE</text>

  <!-- ===== Nota: ocultamiento ===== -->
  <g>
    <rect x="60" y="1480" width="920" height="118" rx="12" fill="#fffceb" stroke="#caa400" stroke-width="2.4"/>
    <text x="84" y="1524" font-size="33" font-weight="800" fill="#7a6400">Ocultamiento (la idea clave):</text>
    <text x="84" y="1566" font-size="33" fill="#5c4f00">la FSM consume el WorldSnapshot sin saber de que sensor salio cada dato.</text>
    <text x="84" y="1594" font-size="29" fill="#8a7a00">Cambiar una camara o un sensor no toca la logica de decision.</text>
  </g>

  <!-- ===== Caption ===== -->
  <text x="60" y="1660" font-size="32" font-weight="700" fill="#222">Fig. — El control se ordena en capas: cada nivel oculta su complejidad,</text>
  <text x="60" y="1698" font-size="32" font-weight="700" fill="#222">asi la decision no depende de que sensor genero el dato.</text>
  <text x="60" y="1734" font-size="28" fill="#666">Diagrama original del equipo — CC BY 4.0.  Apunta a TDP Software / Presentation.</text>
  <text x="60" y="1772" font-size="28" fill="#888">Estados FSM y piso {70,70,107} verificados en codigo (commit 86763b9, 2026-06-13).</text>
</svg>
