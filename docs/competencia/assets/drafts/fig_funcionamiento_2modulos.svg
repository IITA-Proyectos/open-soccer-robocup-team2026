<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1460" viewBox="0 0 1720 1460" font-family="Montserrat, Inter, Arial, sans-serif">
  <!-- ============================================================
       Fig. — "Como funciona el robot" (figura CENTRAL del poster A1)
       Pregunta unica: "Quien hace que, y que dato viaja entre las partes?"
       Idea organizadora: el robot NO son 3 placas sueltas -> son DOS
       MODULOS unidos por UN contrato de datos (WorldSnapshot).
         MODULO SUPERIOR = SABER (TOP fusiona sensores -> modelo del mundo)
         MODULO INFERIOR = DECIDIR Y MOVER (CENTRAL decide; DOWN pre-procesa)
         CONTRATO = WorldSnapshot 31 B @ 100 Hz (frontera del sistema)

       MATEMATICA DE IMPRESION (antes de dibujar):
         viewBox 1720 px de ancho; impreso 393 mm (columna central A1).
         mm/px = 393/1720 = 0.2285.
         Cuerpo 40 px = 9.14 mm ~= 26 pt   (minimo poster 24 pt -> OK)
         Banda 40 px / placa 44 px = 10.0 mm ~= 28 pt
         Titulo 76 px = 17.4 mm ~= 49 pt   (minimo poster 48 pt -> OK)
         Minimo absoluto 24 pt = 37.2 px. El texto mas chico usado es 38 px.

       Paleta firma POSTER.md: azul=TOP naranja=CENTRAL verde=DOWN
       gris=neutro/modulo rojo=SOLO emergencia. El color ES informacion.
       Cifras verificadas vs docs/competencia/TDP.md y ESTADO-ACTUAL.md
       (soccer-main HEAD 86763b9, 2026-06-13). Unidades visuales: 7.
       Cifra de tests = cifra viva del equipo (834/60/0) -> re-medir y
       fechar al imprimir; ver Fig.8 / TDP. WorldSnapshot 31 B = static_assert.
       ============================================================ -->
  <defs>
    <marker id="aGray" markerWidth="7" markerHeight="6" refX="5.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3F3F3F"/>
    </marker>
    <marker id="aRed" markerWidth="5.5" markerHeight="4.4" refX="3.6" refY="2.2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L4.4,2.2 L0,4.4 Z" fill="#C8102E"/>
    </marker>
    <marker id="aPend" markerWidth="7" markerHeight="6" refX="5.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9A9A9A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1720" height="1460" fill="#FFFFFF"/>

  <!-- ===== Titulo interno (lectura a 3 m) ===== -->
  <text x="40" y="84" font-size="76" font-weight="800" fill="#222222">DOS MODULOS, UN CONTRATO</text>
  <text x="40" y="138" font-size="40" fill="#555555">El robot no son 3 placas sueltas: son dos modulos unidos por un unico contrato de datos.</text>

  <!-- ============================================================
       UNIDAD 1 — MODULO SUPERIOR: SABER  (panel gris neutro)  contiene TOP
       ============================================================ -->
  <g>
    <rect x="36" y="172" width="1648" height="248" rx="22" fill="#F4F5F6" stroke="#8C8C8C" stroke-width="3"/>
    <rect x="56" y="190" width="300" height="62" rx="10" fill="#5A5A5A"/>
    <text x="76" y="233" font-size="40" font-weight="800" fill="#FFFFFF">MODULO 1 &#183; SABER</text>
    <text x="376" y="233" font-size="40" fill="#444444">fusiona sensores &#8594; modelo del mundo</text>

    <!-- UNIDAD 2 — caja TOP (azul) -->
    <rect x="56" y="266" width="1608" height="138" rx="14" fill="#E8F1FA" stroke="#1D4E89" stroke-width="4"/>
    <path d="M56,280 a14,14 0 0 1 14,-14 h172 a14,14 0 0 1 14,14 v42 h-200 Z" fill="#1D4E89"/>
    <text x="72" y="309" font-size="40" font-weight="800" fill="#FFFFFF">TOP</text>
    <text x="300" y="309" font-size="40" fill="#222222">Teensy 4.0 &#8212; el sentido del robot</text>
    <text x="72" y="362" font-size="40" fill="#222222">2 camaras (pelota + arcos por color) &#183; IMU (rumbo) &#183;</text>
    <text x="72" y="396" font-size="40" fill="#222222">4 laseres de distancia (paredes) &#183; senal del arbitro</text>
  </g>

  <!-- ============================================================
       UNIDAD 3 — EL CONTRATO: flecha TOP -> CENTRAL = la FRONTERA
       ============================================================ -->
  <line x1="430" y1="424" x2="430" y2="498" stroke="#3F3F3F" stroke-width="9" marker-end="url(#aGray)"/>
  <text x="470" y="452" font-size="46" font-weight="800" fill="#1F1F1F">WorldSnapshot &#8212; 31 B @ 100 Hz</text>
  <text x="470" y="496" font-size="38" fill="#666666">el contrato de datos = la frontera</text>

  <!-- ============================================================
       UNIDAD 4 — MODULO INFERIOR: DECIDIR Y MOVER  contiene CENTRAL + DOWN
       ============================================================ -->
  <g>
    <rect x="36" y="520" width="1648" height="486" rx="22" fill="#F4F5F6" stroke="#8C8C8C" stroke-width="3"/>
    <rect x="56" y="538" width="690" height="62" rx="10" fill="#5A5A5A"/>
    <text x="76" y="581" font-size="40" font-weight="800" fill="#FFFFFF">MODULO 2 &#183; DECIDIR Y MOVER</text>
    <text x="770" y="581" font-size="40" fill="#444444">el cerebro campeon 2025 + el plato</text>

    <!-- UNIDAD 5 — caja CENTRAL (naranja) -->
    <rect x="316" y="616" width="1348" height="164" rx="14" fill="#FBEEDF" stroke="#E8731A" stroke-width="4"/>
    <path d="M316,630 a14,14 0 0 1 14,-14 h200 a14,14 0 0 1 14,14 v42 h-228 Z" fill="#E8731A"/>
    <text x="332" y="659" font-size="40" font-weight="800" fill="#FFFFFF">CENTRAL</text>
    <text x="588" y="659" font-size="40" fill="#222222">Teensy 4.1 sobre PCB Zircon (campeona 2025)</text>
    <text x="332" y="716" font-size="40" fill="#222222">decide la jugada (maquina de estados) &#183; 3 PID &#183;</text>
    <text x="332" y="756" font-size="40" fill="#222222">cinematica omni &#8594; 3 motores (empuja la pelota por inercia)</text>

    <!-- glifo 3 ruedas omni a 120 (neutro) dentro del modulo, a la izquierda -->
    <g>
      <text x="176" y="678" font-size="36" fill="#444444" text-anchor="middle">3 ruedas</text>
      <text x="176" y="716" font-size="36" fill="#444444" text-anchor="middle">omni 120&#176;</text>
      <circle cx="176" cy="790" r="54" fill="#FFFFFF" stroke="#3F3F3F" stroke-width="6"/>
      <g fill="#3F3F3F">
        <rect x="149" y="724" width="54" height="14" rx="5"/>
        <rect x="149" y="724" width="54" height="14" rx="5" transform="rotate(120,176,790)"/>
        <rect x="149" y="724" width="54" height="14" rx="5" transform="rotate(240,176,790)"/>
      </g>
      <line x1="316" y1="700" x2="246" y2="730" stroke="#3F3F3F" stroke-width="6" marker-end="url(#aGray)"/>
    </g>

    <!-- UNIDAD 6 — caja DOWN (verde) -->
    <rect x="316" y="850" width="1348" height="134" rx="14" fill="#E9F4EC" stroke="#1E8A4C" stroke-width="4"/>
    <path d="M316,864 a14,14 0 0 1 14,-14 h172 a14,14 0 0 1 14,14 v42 h-200 Z" fill="#1E8A4C"/>
    <text x="332" y="893" font-size="40" font-weight="800" fill="#FFFFFF">DOWN</text>
    <text x="560" y="893" font-size="40" fill="#222222">el plato: pre-procesa el piso antes de difundirlo</text>
    <text x="332" y="950" font-size="40" fill="#222222">anillo de 32 sensores de linea (borde) &#183; 2 OTOS (odometria)</text>
  </g>

  <!-- ============================================================
       UNIDAD 7 — enlaces internos del modulo 2
       (a) EMERGENCIA linea DOWN -> CENTRAL  (rojo, solido)
       (b) DOWN -> TOP  PENDIENTE / sin cablear (punteado, por el margen derecho)
       ============================================================ -->
  <!-- (a) emergencia: DOWN sube a CENTRAL (lado izquierdo, dentro del modulo) -->
  <line x1="470" y1="848" x2="470" y2="784" stroke="#C8102E" stroke-width="14" marker-end="url(#aRed)"/>
  <rect x="510" y="792" width="690" height="48" rx="8" fill="#FFFFFF"/>
  <text x="516" y="829" font-size="40" font-weight="800" fill="#C8102E">EMERGENCIA &#161;linea! frena en &lt;15 ms*</text>

  <!-- (b) DOWN -> TOP, sin cablear: punteado por el margen derecho (fuera de
       las cajas), sube de DOWN al modulo 1; etiqueta en el hueco inter-modulo -->
  <path d="M1664,917 L1700,917 L1700,335 L1668,335" fill="none" stroke="#9A9A9A" stroke-width="6"
        stroke-dasharray="14 12" marker-end="url(#aPend)"/>
  <g>
    <rect x="1300" y="424" width="384" height="86" rx="10" fill="#FFFFFF" stroke="#CFCFCF" stroke-width="2"/>
    <text x="1320" y="466" font-size="38" font-weight="800" fill="#7A7A7A">DOWN &#8594; TOP</text>
    <text x="1320" y="500" font-size="32" font-style="italic" fill="#7A7A7A">pendiente: sin cablear</text>
  </g>

  <!-- ===== Leyenda (3 tipos de flecha => obligatoria), abajo a la derecha ===== -->
  <g>
    <rect x="1230" y="1036" width="454" height="262" rx="14" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="2"/>
    <text x="1252" y="1080" font-size="38" font-weight="800" fill="#333333">Referencias</text>
    <line x1="1252" y1="1120" x2="1328" y2="1120" stroke="#3F3F3F" stroke-width="7" marker-end="url(#aGray)"/>
    <text x="1346" y="1132" font-size="36" fill="#2B2B2B">dato (bytes @ Hz)</text>
    <line x1="1252" y1="1170" x2="1322" y2="1170" stroke="#C8102E" stroke-width="13" marker-end="url(#aRed)"/>
    <text x="1346" y="1182" font-size="36" font-weight="700" fill="#C8102E">emergencia</text>
    <line x1="1252" y1="1220" x2="1328" y2="1220" stroke="#9A9A9A" stroke-width="6" stroke-dasharray="12 10" marker-end="url(#aPend)"/>
    <text x="1346" y="1232" font-size="36" fill="#7A7A7A">pendiente (sin cablear)</text>
    <rect x="1252" y="1256" width="42" height="30" rx="6" fill="#F4F5F6" stroke="#8C8C8C" stroke-width="2"/>
    <text x="1310" y="1281" font-size="36" fill="#2B2B2B">= un modulo</text>
  </g>

  <!-- ===== Caption obligatoria: takeaway + cifra viva fechada + credito =====
       lineas cortas (<= ~40 car) para no chocar con la leyenda (x>=1230) -->
  <line x1="40" y1="1042" x2="1180" y2="1042" stroke="#DDDDDD" stroke-width="2"/>
  <text x="40" y="1094" font-size="42" font-weight="800" fill="#222222">Fig. &#8212; SABER y DECIDIR/MOVER son dos</text>
  <text x="40" y="1142" font-size="42" font-weight="800" fill="#222222">modulos; el WorldSnapshot es su frontera.</text>
  <text x="40" y="1190" font-size="42" font-weight="800" fill="#222222">Por eso cada modulo se cambia por separado</text>
  <text x="40" y="1238" font-size="42" font-weight="800" fill="#222222">(reusamos el cerebro campeon 2025).</text>
  <text x="40" y="1288" font-size="38" fill="#333333">Logica verificada en PC sin la placa:</text>
  <text x="40" y="1330" font-size="38" fill="#333333">834 tests / 60 suites / 0 fallos (cifra viva, ver Fig.8).</text>
  <text x="40" y="1378" font-size="36" fill="#666666">* frenar en &lt;15 ms = objetivo de diseno, pendiente de medir en banco.</text>
  <text x="40" y="1420" font-size="36" fill="#666666">Diagrama original del equipo &#8212; CC BY 4.0</text>
</svg>
