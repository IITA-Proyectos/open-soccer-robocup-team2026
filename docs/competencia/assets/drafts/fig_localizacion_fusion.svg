<svg viewBox="0 0 1440 1380" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Inter', Arial, sans-serif">
  <!-- ============================================================
       Fig. (D13) — Localizacion y fusion sensorial: pose absoluta vs relativa
       Pregunta: Como (intenta) saber el robot donde esta en la cancha, y por que
                 HOY razona RELATIVO a si mismo en vez de absoluto?
       Print math: viewBox 1440 px -> ~360 mm => 0.25 mm/px. Cuerpo 30-34 px (~21-24 pt);
                 anotaciones 28 px; titulo 58 px. Nada < 27 px.
       Paleta: TOP/percepcion #1D4E89 (acento #2b6cb0) / CENTRAL #E8731A / DOWN #1E8A4C
                 / neutro #6B7280 / ROJO #C8102E solo emergencia/limite load-bearing.
       Honestidad: (*) = ASUMIDO / placeholder / sin validar en banco. Firme = MEDIDO.
       Fuentes: localization.h (regla <2 ToF), main_top.cpp (heading desacoplado),
                 MAPA-CONEXIONES-3-PLACAS.md, CONTRATO-DATOS-DOWN.md, ESTADO-ACTUAL.md.
       ============================================================ -->
  <defs>
    <marker id="rt" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#555" stroke-width="2.4"/></marker>
    <marker id="rtb" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#1D4E89" stroke-width="2.6"/></marker>
    <marker id="dn" markerWidth="14" markerHeight="14" refX="6" refY="11" orient="auto"><path d="M1 1 L6 11 L11 1" fill="none" stroke="#333" stroke-width="2.6"/></marker>
    <marker id="dnr" markerWidth="14" markerHeight="14" refX="6" refY="11" orient="auto"><path d="M1 1 L6 11 L11 1" fill="none" stroke="#C8102E" stroke-width="2.8"/></marker>
    <marker id="rtg" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#9aa1ab" stroke-width="2.4"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f6f8"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="1440" height="1380" fill="url(#bg)"/>

  <text x="48" y="70" font-size="58" font-weight="800" fill="#222">Donde estoy vs que tengo cerca</text>
  <text x="48" y="114" font-size="33" fill="#555">Intenta su pose absoluta &#8212; casi nunca es valida, asi que HOY juega RELATIVO</text>

  <!-- ===== Encabezados de columna ===== -->
  <text x="60" y="178" font-size="28" font-weight="800" fill="#444">ENTRADAS (sensores)</text>
  <text x="500" y="178" font-size="28" font-weight="800" fill="#1D4E89">3 ESTIMADORES (en el TOP)</text>
  <text x="1066" y="178" font-size="28" font-weight="800" fill="#444">SALIDA al CENTRAL</text>

  <!-- =====================================================================
       FLECHAS (debajo de las cajas): entradas -> estimadores
       ===================================================================== -->
  <!-- 4 ToF -> Pose absoluta -->
  <line x1="448" y1="262" x2="500" y2="262" stroke="#555" stroke-width="3" marker-end="url(#rt)"/>
  <!-- BNO heading -> Pose absoluta (linea de heading) y -> Heading estimador -->
  <line x1="448" y1="470" x2="476" y2="470" stroke="#2b6cb0" stroke-width="3"/>
  <path d="M476 470 C 488 470, 488 300, 500 300" fill="none" stroke="#2b6cb0" stroke-width="3" marker-end="url(#rtb)"/>
  <path d="M476 470 C 488 470, 488 560, 500 560" fill="none" stroke="#2b6cb0" stroke-width="3" marker-end="url(#rtb)"/>
  <!-- 2 OTOS -> Odometria + (yaw) -> Heading -->
  <line x1="448" y1="690" x2="476" y2="690" stroke="#1E8A4C" stroke-width="3"/>
  <path d="M476 690 C 488 690, 488 800, 500 800" fill="none" stroke="#1E8A4C" stroke-width="3" marker-end="url(#rt)"/>
  <path d="M476 690 C 488 690, 488 612, 500 612" fill="none" stroke="#1E8A4C" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#rt)"/>

  <!-- =====================================================================
       COLUMNA IZQUIERDA — ENTRADAS
       ===================================================================== -->
  <!-- 4 ToF -->
  <g>
    <rect x="48" y="194" width="400" height="150" rx="11" fill="#EAF0F7" stroke="#1D4E89" stroke-width="2.5"/>
    <rect x="48" y="194" width="13" height="150" rx="5" fill="#1D4E89"/>
    <text x="78" y="232" font-size="32" font-weight="700" fill="#1D4E89">4 ToF cardinales</text>
    <text x="78" y="270" font-size="29" fill="#333">distancias a las paredes</text>
    <text x="78" y="306" font-size="28" fill="#C8102E">utiles casi solo en eje Y *HW</text>
    <text x="78" y="338" font-size="28" fill="#666">bus Wire (con el BNO secundario)</text>
  </g>

  <!-- BNO heading -->
  <g>
    <rect x="48" y="392" width="400" height="190" rx="11" fill="#EAF0F7" stroke="#2b6cb0" stroke-width="2.5"/>
    <rect x="48" y="392" width="13" height="190" rx="5" fill="#2b6cb0"/>
    <text x="78" y="430" font-size="32" font-weight="700" fill="#2b6cb0">heading BNO055</text>
    <text x="78" y="466" font-size="28" fill="#333">PRIMARIO en Wire2 (sin ToF) &#8594; usar</text>
    <text x="78" y="500" font-size="28" fill="#333">SECUNDARIO en Wire (4 ToF) &#8594; se</text>
    <text x="78" y="530" font-size="28" fill="#333">congela (contencion del bus)</text>
    <text x="78" y="566" font-size="27" fill="#666">IMUPLUS (evita iman de motores)</text>
  </g>

  <!-- 2 OTOS -->
  <g>
    <rect x="48" y="630" width="400" height="150" rx="11" fill="#E9F5EE" stroke="#1E8A4C" stroke-width="2.5"/>
    <rect x="48" y="630" width="13" height="150" rx="5" fill="#1E8A4C"/>
    <text x="78" y="668" font-size="32" font-weight="700" fill="#1E8A4C">2 OTOS (de la DOWN)</text>
    <text x="78" y="704" font-size="29" fill="#333">odometria optica al piso</text>
    <text x="78" y="740" font-size="28" fill="#666">drift ~1-2% del recorrido</text>
    <text x="78" y="772" font-size="28" fill="#666">ambos 0x17 &#183; buses separados</text>
  </g>

  <!-- =====================================================================
       COLUMNA CENTRO — 3 ESTIMADORES
       ===================================================================== -->
  <!-- Estimador 1: POSE ABSOLUTA -->
  <g>
    <rect x="500" y="194" width="520" height="240" rx="13" fill="#F4F8FC" stroke="#1D4E89" stroke-width="3"/>
    <text x="524" y="234" font-size="31" font-weight="800" fill="#1D4E89">1 &#183; POSE ABSOLUTA</text>
    <text x="524" y="270" font-size="28" fill="#333">localization_compute (puro, host-test)</text>
    <text x="524" y="304" font-size="28" fill="#333">4 ToF + heading &#8594; (x, y, heading)</text>
    <text x="524" y="336" font-size="28" fill="#333">en cancha 1820 &#215; 2430 mm</text>
    <rect x="524" y="356" width="472" height="62" rx="8" fill="#FDECEE" stroke="#C8102E" stroke-width="2"/>
    <text x="540" y="384" font-size="27" font-weight="700" fill="#C8102E">REGLA: valid = false si &lt; 2 ToF utiles</text>
    <text x="540" y="410" font-size="27" fill="#C8102E">con el HW de hoy &#8594; casi nunca</text>
  </g>

  <!-- Estimador 2: HEADING -->
  <g>
    <rect x="500" y="450" width="520" height="180" rx="13" fill="#F4F8FC" stroke="#2b6cb0" stroke-width="3"/>
    <text x="524" y="490" font-size="31" font-weight="800" fill="#2b6cb0">2 &#183; HEADING (orientacion)</text>
    <text x="524" y="526" font-size="28" fill="#333">viaja SIEMPRE desacoplado de la</text>
    <text x="524" y="558" font-size="28" fill="#333">validez de posicion (el robot SI sabe</text>
    <text x="524" y="590" font-size="28" fill="#333">adonde mira, aunque no donde esta)</text>
    <text x="524" y="620" font-size="27" fill="#666">gate heading_valid (bit4): rumbo falso &#8594; &#969; = 0</text>
  </g>

  <!-- Estimador 3: ODOMETRIA OTOS -->
  <g>
    <rect x="500" y="646" width="520" height="160" rx="13" fill="#EEF6F0" stroke="#1E8A4C" stroke-width="3"/>
    <text x="524" y="686" font-size="31" font-weight="800" fill="#1E8A4C">3 &#183; ODOMETRIA OTOS</text>
    <text x="524" y="722" font-size="28" fill="#333">Pose2D + Velocity2D de la DOWN</text>
    <text x="524" y="754" font-size="28" fill="#333">confidence = 0 &#8594; pose INVALIDA</text>
    <text x="524" y="786" font-size="27" fill="#666">late &#8805; 1 Hz &#183; slip &gt; 50 = anomalia</text>
  </g>

  <!-- =====================================================================
       BANDA FUSION (el modulo que existe pero NO esta cableado)
       ===================================================================== -->
  <!-- flechas estimadores -> fusion (gris/punteado = no cableado) -->
  <line x1="1020" y1="300" x2="1062" y2="300" stroke="#9aa1ab" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#rtg)"/>
  <line x1="1020" y1="726" x2="1062" y2="726" stroke="#9aa1ab" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#rtg)"/>
  <g>
    <rect x="1062" y="240" width="330" height="186" rx="12" fill="#F4F5F7" stroke="#9aa1ab" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="1082" y="280" font-size="29" font-weight="800" fill="#4b5563">pose_fusion *</text>
    <text x="1082" y="314" font-size="27" fill="#444">filtro complementario</text>
    <text x="1082" y="344" font-size="27" fill="#444">ToF + OTOS (modulo puro)</text>
    <text x="1082" y="380" font-size="27" font-weight="700" fill="#C8102E">NO cableado en runtime *</text>
    <text x="1082" y="410" font-size="27" fill="#666">my_x/y salen de ToF+BNO</text>
  </g>

  <!-- =====================================================================
       SALIDA: pose + confidence (lo que CENTRAL recibe)
       ===================================================================== -->
  <line x1="1062" y1="540" x2="1020" y2="430" stroke="#1D4E89" stroke-width="3.5" marker-end="url(#rtb)"/>
  <g>
    <rect x="1062" y="450" width="330" height="170" rx="12" fill="#FFFDF5" stroke="#1D4E89" stroke-width="3"/>
    <text x="1082" y="490" font-size="29" font-weight="800" fill="#1D4E89">POSE + confidence</text>
    <text x="1082" y="526" font-size="27" fill="#333">my_x/y &#183; my_heading</text>
    <text x="1082" y="558" font-size="27" fill="#333">pose_confidence = 70 / 0</text>
    <text x="1082" y="592" font-size="27" fill="#666">en el WorldSnapshot</text>
  </g>

  <!-- =====================================================================
       CAJA ROJA — consecuencia load-bearing
       ===================================================================== -->
  <!-- bajada desde POSE+conf y desde la regla roja hacia la caja roja -->
  <line x1="1227" y1="620" x2="1227" y2="858" stroke="#C8102E" stroke-width="4" marker-end="url(#dnr)"/>
  <text x="1210" y="700" font-size="27" fill="#C8102E" text-anchor="end">confidence &#8594; 0</text>
  <text x="1210" y="732" font-size="27" fill="#C8102E" text-anchor="end">CENTRAL ignora</text>
  <text x="1210" y="764" font-size="27" fill="#C8102E" text-anchor="end">la POSICION</text>

  <g>
    <rect x="500" y="860" width="892" height="172" rx="14" fill="#FDECEE" stroke="#C8102E" stroke-width="3.5"/>
    <text x="526" y="906" font-size="34" font-weight="800" fill="#C8102E">No sabe donde esta &#8594; razona RELATIVO a si mismo</text>
    <text x="526" y="948" font-size="30" fill="#333">No usa coordenadas de cancha. Decide por angulo y</text>
    <text x="526" y="984" font-size="30" fill="#333">distancia a la PELOTA y a los ARCOS (lo que TIENE CERCA).</text>
    <text x="526" y="1018" font-size="27" fill="#a00a22">Limite real y bien documentado &#8212; no un fracaso. El heading SI lo conserva.</text>
  </g>

  <!-- =====================================================================
       PANEL "HOY EN R1" + analogia (esquina inferior izquierda)
       ===================================================================== -->
  <g>
    <rect x="48" y="824" width="424" height="208" rx="12" fill="#FFF6EE" stroke="#E8731A" stroke-width="3"/>
    <text x="70" y="864" font-size="29" font-weight="800" fill="#a8500d">HOY en ROBOT 1</text>
    <text x="70" y="900" font-size="28" fill="#333">2 BNO sanos: primario heading + centinela</text>
    <text x="70" y="932" font-size="28" fill="#333">&#8594; gyro del primario + yaw de los 2 OTOS</text>
    <text x="70" y="966" font-size="28" fill="#2E7D32">BNO secundario (Wire 0x28): centinela @1Hz</text>
    <text x="70" y="1000" font-size="27" fill="#a8500d">* signo del yaw OTOS sin validar en banco</text>
    <text x="70" y="1026" font-size="27" fill="#666">(heading validado en banco 2026-06-21)</text>
  </g>

  <!-- =====================================================================
       PANEL HONESTIDAD: medido vs asumido
       ===================================================================== -->
  <g>
    <rect x="48" y="1056" width="1344" height="150" rx="12" fill="#F4F5F7" stroke="#9aa1ab" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="70" y="1096" font-size="29" font-weight="800" fill="#4b5563">Honestidad &#8212; MEDIDO (firme) vs ASUMIDO (*)</text>
    <text x="70" y="1132" font-size="28" fill="#1E8A4C">MEDIDO: localization_compute es host-testeable &#183; regla &lt; 2 ToF &#183; convencion BNO primario / secundario.</text>
    <text x="70" y="1166" font-size="28" fill="#a06a00">ASUMIDO *: pose absoluta sin validar &#183; fusion ToF+OTOS sin cablear &#183; signo yaw OTOS sin validar.</text>
    <text x="70" y="1198" font-size="28" fill="#a06a00">PLACEHOLDER *: TOF_OFFSET_MM = 95 &#183; OTOS_SEPARATION_MM = 200 (tentativo).</text>
  </g>

  <!-- =====================================================================
       LEYENDA de flechas
       ===================================================================== -->
  <g font-size="27" fill="#333">
    <line x1="60" y1="1252" x2="132" y2="1252" stroke="#555" stroke-width="3" marker-end="url(#rt)"/>
    <text x="144" y="1261">dato que se usa</text>
    <line x1="430" y1="1252" x2="502" y2="1252" stroke="#9aa1ab" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#rtg)"/>
    <text x="514" y="1261">existe pero NO cableado</text>
    <line x1="918" y1="1252" x2="990" y2="1252" stroke="#C8102E" stroke-width="4" marker-end="url(#dnr)"/>
    <text x="1002" y="1261">limite load-bearing (rojo)</text>
  </g>

  <text x="48" y="1318" font-size="27" fill="#666">Fig. &#8212; la pose absoluta casi nunca es valida; por eso HOY el robot juega RELATIVO, no por coordenadas.  &#183;  CC BY 4.0</text>
  <text x="48" y="1352" font-size="27" fill="#666">Fuente: localization.h, main_top.cpp, MAPA-CONEXIONES-3-PLACAS.md, ESTADO-ACTUAL.md.  (* sin validar en banco)</text>
</svg>
