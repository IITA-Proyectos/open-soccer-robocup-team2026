<svg viewBox="0 0 1440 1180" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Inter', Arial, sans-serif">
  <!-- ============================================================
       Fig. (D11) — Pila fisica de 3 placas con cotas de standoffs (vista lateral / corte)
       Pregunta: Como se apilan fisicamente las 3 placas en el chasis y con que separacion entre pisos?
       ESTADO: PLANO A MEDIR. Alturas de standoffs, separacion entre pisos, fijacion al chasis y
               geometria mecanica del chasis NO documentadas. TODA cota va con "?" (esqueleto a completar).
       Print math: viewBox 1440 px -> ~360 mm => 0.25 mm/px. Cuerpo >=34 px; anotaciones >=28 px; titulo 58 px.
       Paleta: TOP #1D4E89 (mas alto, percepcion) / CENTRAL #E8731A (medio, Teensy 4.1+Zircon) /
               DOWN #1E8A4C (mas bajo, anillo de linea mira al piso) / gris #6B7280 neutro / rojo #C8102E aviso.
       Fuentes: TDP.md L240 (GAP stack), hardware/mechanical/README.md (placeholder), docs/omni3-drive-system.md.
       ============================================================ -->
  <defs>
    <marker id="dn" markerWidth="14" markerHeight="14" refX="6" refY="11" orient="auto"><path d="M1 1 L6 11 L11 1" fill="none" stroke="#6B7280" stroke-width="2.6"/></marker>
    <marker id="up" markerWidth="14" markerHeight="14" refX="6" refY="2" orient="auto"><path d="M1 11 L6 1 L11 11" fill="none" stroke="#6B7280" stroke-width="2.6"/></marker>
    <marker id="rt" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#555" stroke-width="2.4"/></marker>
    <marker id="lt" markerWidth="13" markerHeight="13" refX="3" refY="6" orient="auto"><path d="M11 1 L1 6 L11 11" fill="none" stroke="#555" stroke-width="2.4"/></marker>
    <marker id="dimL" markerWidth="12" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M10 1 L2 6 L10 11" fill="none" stroke="#444" stroke-width="2.2"/></marker>
    <marker id="dimR" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2 1 L10 6 L2 11" fill="none" stroke="#444" stroke-width="2.2"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f6f8"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="1440" height="1180" fill="url(#bg)"/>

  <text x="48" y="70" font-size="58" font-weight="800" fill="#222">La pila de 3 placas (vista lateral)</text>
  <text x="48" y="114" font-size="34" fill="#555">Como se apilan los 3 pisos en el chasis &#8212; TODAS las cotas estan SIN MEDIR</text>

  <!-- ====== Banner grande de honestidad ====== -->
  <g>
    <rect x="48" y="146" width="1344" height="78" rx="12" fill="#FDECEE" stroke="#C8102E" stroke-width="3"/>
    <text x="72" y="195" font-size="35" font-weight="800" fill="#C8102E">&#9888; Cotas a CONFIRMAR midiendo el robot fisico &#8212; este plano es un esqueleto</text>
  </g>

  <!-- ===================================================================
       COLUMNA IZQUIERDA: pila apilada (corte lateral) con standoffs
       Eje X de la pila: borde izq placa = 360, borde der = 840 (ancho 480)
       Standoffs en x=400 y x=800. Cota vertical a la izquierda en x=300.
       =================================================================== -->

  <!-- guia de chasis (paredes laterales, atenuadas) -->
  <line x1="338" y1="296" x2="338" y2="980" stroke="#9aa1ab" stroke-width="2.5" stroke-dasharray="8 7"/>
  <line x1="862" y1="296" x2="862" y2="980" stroke="#9aa1ab" stroke-width="2.5" stroke-dasharray="8 7"/>
  <text x="600" y="286" font-size="28" font-weight="700" fill="#9aa1ab" text-anchor="middle">chasis (diametro real &lt;= 200 mm, sin medir ?)</text>

  <!-- ===== TOP (mas alto) y=320, alto 60 ===== -->
  <g>
    <rect x="360" y="320" width="480" height="60" rx="8" fill="#EAF0F7" stroke="#1D4E89" stroke-width="3.5"/>
    <text x="600" y="358" font-size="34" font-weight="800" fill="#1D4E89" text-anchor="middle">TOP &#8212; Teensy 4.0</text>
  </g>
  <text x="600" y="304" font-size="28" fill="#1D4E89" text-anchor="middle">el MAS ALTO &#183; camaras / ToF miran AFUERA</text>

  <!-- standoffs TOP->CENTRAL -->
  <rect x="392" y="380" width="20" height="120" fill="#cbd2da" stroke="#6B7280" stroke-width="2"/>
  <rect x="788" y="380" width="20" height="120" fill="#cbd2da" stroke="#6B7280" stroke-width="2"/>

  <!-- ===== CENTRAL (medio) y=500, alto 84 (placa mas la PCB Zircon) ===== -->
  <g>
    <rect x="360" y="500" width="480" height="84" rx="8" fill="#FDF1E7" stroke="#E8731A" stroke-width="3.5"/>
    <text x="600" y="538" font-size="34" font-weight="800" fill="#E8731A" text-anchor="middle">CENTRAL &#8212; Teensy 4.1</text>
    <text x="600" y="572" font-size="28" fill="#a8500d" text-anchor="middle">+ PCB Zircon &#183; al MEDIO</text>
  </g>

  <!-- standoffs CENTRAL->DOWN -->
  <rect x="392" y="584" width="20" height="120" fill="#cbd2da" stroke="#6B7280" stroke-width="2"/>
  <rect x="788" y="584" width="20" height="120" fill="#cbd2da" stroke="#6B7280" stroke-width="2"/>

  <!-- ===== DOWN (mas bajo) y=704, alto 60 ===== -->
  <g>
    <rect x="360" y="704" width="480" height="60" rx="8" fill="#E9F5EE" stroke="#1E8A4C" stroke-width="3.5"/>
    <text x="600" y="742" font-size="34" font-weight="800" fill="#1E8A4C" text-anchor="middle">DOWN &#8212; Teensy 4.0</text>
  </g>
  <text x="600" y="792" font-size="28" fill="#1E8A4C" text-anchor="middle">el MAS BAJO &#183; anillo 32 sensores mira al PISO &#8595;</text>

  <!-- standoffs DOWN->chasis -->
  <rect x="392" y="764" width="20" height="100" fill="#cbd2da" stroke="#6B7280" stroke-width="2"/>
  <rect x="788" y="764" width="20" height="100" fill="#cbd2da" stroke="#6B7280" stroke-width="2"/>

  <!-- ===== Suelo / cancha (referencia abajo) ===== -->
  <rect x="300" y="864" width="600" height="22" fill="#dfe4ea" stroke="#6B7280" stroke-width="2"/>
  <g stroke="#9aa1ab" stroke-width="2">
    <line x1="312" y1="886" x2="296" y2="906"/>
    <line x1="352" y1="886" x2="336" y2="906"/>
    <line x1="392" y1="886" x2="376" y2="906"/>
    <line x1="432" y1="886" x2="416" y2="906"/>
    <line x1="472" y1="886" x2="456" y2="906"/>
    <line x1="512" y1="886" x2="496" y2="906"/>
    <line x1="552" y1="886" x2="536" y2="906"/>
    <line x1="592" y1="886" x2="576" y2="906"/>
    <line x1="632" y1="886" x2="616" y2="906"/>
    <line x1="672" y1="886" x2="656" y2="906"/>
    <line x1="712" y1="886" x2="696" y2="906"/>
    <line x1="752" y1="886" x2="736" y2="906"/>
    <line x1="792" y1="886" x2="776" y2="906"/>
    <line x1="832" y1="886" x2="816" y2="906"/>
    <line x1="872" y1="886" x2="856" y2="906"/>
  </g>
  <text x="600" y="938" font-size="28" fill="#6B7280" text-anchor="middle">SUELO / cancha (referencia) &#183; altura libre al piso = ?</text>

  <!-- ===================================================================
       COTAS VERTICALES (todas con "?") a la izquierda, x=300
       =================================================================== -->
  <g stroke="#444" stroke-width="2.5">
    <!-- sep TOP-CENTRAL : entre y=380 y y=500 -->
    <line x1="300" y1="382" x2="300" y2="498" marker-start="url(#up)" marker-end="url(#dn)"/>
    <!-- sep CENTRAL-DOWN : entre y=584 y y=704 -->
    <line x1="300" y1="586" x2="300" y2="702" marker-start="url(#up)" marker-end="url(#dn)"/>
    <!-- DOWN-suelo : entre y=764 y y=864 -->
    <line x1="300" y1="766" x2="300" y2="862" marker-start="url(#up)" marker-end="url(#dn)"/>
  </g>
  <!-- ticks horizontales de referencia de cota -->
  <g stroke="#bcc3cc" stroke-width="1.6">
    <line x1="296" y1="380" x2="360" y2="380"/>
    <line x1="296" y1="500" x2="360" y2="500"/>
    <line x1="296" y1="584" x2="360" y2="584"/>
    <line x1="296" y1="704" x2="360" y2="704"/>
    <line x1="296" y1="764" x2="360" y2="764"/>
    <line x1="296" y1="864" x2="360" y2="864"/>
  </g>
  <!-- etiquetas de cota (rotuladas con ?) -->
  <g font-size="30" font-weight="800" fill="#C8102E" text-anchor="middle">
    <rect x="150" y="420" width="132" height="42" rx="8" fill="#FDECEE" stroke="#C8102E" stroke-width="2"/>
    <text x="216" y="450">h&#8321; = ?</text>
    <rect x="150" y="624" width="132" height="42" rx="8" fill="#FDECEE" stroke="#C8102E" stroke-width="2"/>
    <text x="216" y="654">h&#8322; = ?</text>
    <rect x="150" y="794" width="132" height="42" rx="8" fill="#FDECEE" stroke="#C8102E" stroke-width="2"/>
    <text x="216" y="824">h&#8323; = ?</text>
  </g>
  <g font-size="27" fill="#888" text-anchor="middle">
    <text x="216" y="488">TOP&#8594;CENTRAL</text>
    <text x="216" y="692">CENTRAL&#8594;DOWN</text>
    <text x="216" y="862">DOWN&#8594;suelo</text>
  </g>

  <!-- ===================================================================
       CABLE UART INTER-PLACA (enlaces D1) cruza por el lado derecho
       =================================================================== -->
  <path d="M850 350 C 884 360, 884 470, 850 540" fill="none" stroke="#333" stroke-width="4"/>
  <path d="M850 540 C 884 600, 884 700, 850 734" fill="none" stroke="#C8102E" stroke-width="4"/>
  <circle cx="850" cy="350" r="6" fill="#333"/>
  <circle cx="850" cy="540" r="6" fill="#333"/>
  <circle cx="850" cy="734" r="6" fill="#C8102E"/>
  <text x="898" y="430" font-size="30" font-weight="700" fill="#333">UART</text>
  <text x="898" y="464" font-size="27" fill="#555">inter-</text>
  <text x="898" y="496" font-size="27" fill="#555">placa</text>
  <text x="898" y="650" font-size="27" font-weight="700" fill="#C8102E">bus de</text>
  <text x="898" y="682" font-size="27" fill="#C8102E">emerg.</text>

  <!-- ===================================================================
       PANEL DERECHO: ruteo de la bateria a los XP1 (uno por placa)
       =================================================================== -->
  <g>
    <rect x="1004" y="296" width="388" height="500" rx="14" fill="#FFFFFF" stroke="#6B7280" stroke-width="2.5"/>
    <text x="1024" y="338" font-size="32" font-weight="800" fill="#4b5563">Ruteo de la bateria</text>
    <text x="1024" y="372" font-size="28" fill="#666">un conector XP1 por placa</text>

    <!-- bateria -->
    <rect x="1024" y="396" width="180" height="86" rx="10" fill="#EFEFEF" stroke="#6B7280" stroke-width="2.5"/>
    <text x="1114" y="436" font-size="32" font-weight="800" fill="#444" text-anchor="middle">BATERIA</text>
    <text x="1114" y="468" font-size="27" fill="#888" text-anchor="middle">(tipo / mAh = ?)</text>

    <!-- nodo de reparto -->
    <circle cx="1114" cy="520" r="9" fill="#6B7280"/>
    <line x1="1114" y1="482" x2="1114" y2="520" stroke="#6B7280" stroke-width="4"/>

    <!-- XP1 TOP -->
    <line x1="1114" y1="520" x2="1114" y2="560" stroke="#1D4E89" stroke-width="4"/>
    <line x1="1114" y1="560" x2="1240" y2="560" stroke="#1D4E89" stroke-width="4" marker-end="url(#rt)"/>
    <rect x="1248" y="538" width="132" height="46" rx="8" fill="#EAF0F7" stroke="#1D4E89" stroke-width="2.5"/>
    <text x="1314" y="569" font-size="30" font-weight="800" fill="#1D4E89" text-anchor="middle">XP1 TOP</text>

    <!-- XP1 CENTRAL -->
    <line x1="1114" y1="520" x2="1114" y2="636" stroke="#E8731A" stroke-width="4"/>
    <line x1="1114" y1="636" x2="1240" y2="636" stroke="#E8731A" stroke-width="4" marker-end="url(#rt)"/>
    <rect x="1228" y="614" width="152" height="46" rx="8" fill="#FDF1E7" stroke="#E8731A" stroke-width="2.5"/>
    <text x="1304" y="645" font-size="29" font-weight="800" fill="#E8731A" text-anchor="middle">XP1 CENTRAL</text>

    <!-- XP1 DOWN -->
    <line x1="1114" y1="520" x2="1114" y2="712" stroke="#1E8A4C" stroke-width="4"/>
    <line x1="1114" y1="712" x2="1240" y2="712" stroke="#1E8A4C" stroke-width="4" marker-end="url(#rt)"/>
    <rect x="1240" y="690" width="140" height="46" rx="8" fill="#E9F5EE" stroke="#1E8A4C" stroke-width="2.5"/>
    <text x="1310" y="721" font-size="30" font-weight="800" fill="#1E8A4C" text-anchor="middle">XP1 DOWN</text>

    <text x="1024" y="772" font-size="27" fill="#888">esquema asumido* &#8212; ruteo real sin medir</text>
  </g>

  <!-- ===================================================================
       Panel inferior: que falta medir (honestidad)
       =================================================================== -->
  <g>
    <rect x="48" y="970" width="1344" height="118" rx="12" fill="#F4F5F7" stroke="#9aa1ab" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="72" y="1010" font-size="32" font-weight="800" fill="#4b5563">Lo que falta medir en el robot fisico (no esta en el repo)</text>
    <text x="72" y="1048" font-size="29" fill="#444">&#8226; altura de cada standoff (h&#8321;/h&#8322;/h&#8323;)  &#8226; como se fija la pila al chasis  &#8226; diametro real del chasis (&lt;= 200 mm)</text>
    <text x="72" y="1082" font-size="29" fill="#444">&#8226; altura del robot y n&#176; de pisos  &#8226; posicion/altura de camaras, ToF y HC-SR04  &#8226; tipo de bateria y ruteo</text>
  </g>

  <!-- Caption -->
  <text x="48" y="1138" font-size="27" fill="#666">Fig. &#8212; orden vertical FIRME (TOP arriba, DOWN abajo) pero TODA cota esta sin medir: plano para llenar con el robot en mano.  &#183;  Diagrama original del equipo &#8212; CC BY 4.0  &#183;  Fuente: TDP.md (GAP stack), hardware/mechanical/README.md, omni3-drive-system.md.</text>
  <text x="48" y="1170" font-size="26" fill="#999">(*) ruteo de bateria a XP1 dibujado como esquema asumido &#183; el orden de los pisos esta confirmado por funcion, las distancias NO.</text>
</svg>
