<svg viewBox="0 0 1440 1320" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Inter', Arial, sans-serif">
  <!-- ============================================================
       Fig. (D6) — Presupuesto de potencia / consumo por subsistema
       Pregunta: cuanta corriente consume cada rama, cuanto dura el pack de 6800 mAh,
                 y donde esta el margen termico de los motores?
       Print math: viewBox 1440 px -> ~360 mm => 0.25 mm/px. Cuerpo 30-34 px (~21-24 pt);
                 anotaciones >=28 px. Titulo 58 px. NADA por debajo de 27 px.
       Color: NARANJA = potencia (#E8731A / #a8500d). ROJO #C8102E solo seguridad/cap termico.
       HONESTIDAD: TODO es estimacion de diseno (asterisco *), NO medido con pinza amperometrica.
       Fuentes: BOM.md (bateria 6800 mAh 2S, motores TT, MP1584); comm rules (COMM 500 mA);
                hardware/electrical/README.md ("calculos de consumo/autonomia" listado, NO existe);
                ESTADO-ACTUAL.md L417-429 (brownout OTOS); CONTRATO-DATOS-TOP.md (battery_mv=0).
       Complementa D5 (de donde sale la energia). Aca: cuanta se gasta.
       ============================================================ -->
  <defs>
    <marker id="rt" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#a8500d" stroke-width="2.6"/></marker>
    <marker id="dn" markerWidth="14" markerHeight="14" refX="6" refY="11" orient="auto"><path d="M1 1 L6 11 L11 1" fill="none" stroke="#a8500d" stroke-width="2.6"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f6f8"/></linearGradient>
    <linearGradient id="barm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8731A"/><stop offset="1" stop-color="#f59042"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="1440" height="1320" fill="url(#bg)"/>

  <text x="48" y="70" font-size="58" font-weight="800" fill="#222">Cuanta corriente gasta cada rama</text>
  <text x="48" y="114" font-size="34" fill="#555">Presupuesto de potencia ESTIMADO* &#8212; el robot NO mide su propia bateria</text>

  <!-- ===== Banner: bateria (la fuente) ===== -->
  <g>
    <rect x="48" y="150" width="1344" height="92" rx="12" fill="#FDF1E7" stroke="#E8731A" stroke-width="3"/>
    <rect x="48" y="150" width="16" height="92" rx="6" fill="#E8731A"/>
    <text x="86" y="196" font-size="34" font-weight="800" fill="#a8500d">PACK &#8212; LiPo 2S &#183; 7.4 V nom (8.4 V plena &#183; 6.0 V corte) &#183; 6800 mAh &#183; &#8776;50 Wh</text>
    <text x="86" y="230" font-size="29" fill="#555">Una sola bateria para las 3 placas &#183; el unico corte de bajo voltaje es el nativo de la celda LiPo</text>
  </g>

  <!-- ===== Encabezado de las barras ===== -->
  <text x="48" y="296" font-size="30" font-weight="800" fill="#444">CONSUMO ESTIMADO POR SUBSISTEMA*  &#183;  barra mas larga = mas hambrienta</text>

  <!-- ===== BARRAS ===== -->
  <!-- Geometria: etiqueta a la izq (x=48..560), barra desde x=576, escala 0..760 px de largo -->
  <!-- Eje base de referencia -->
  <line x1="576" y1="320" x2="576" y2="900" stroke="#cbd2da" stroke-width="2"/>

  <!-- 1) MOTORES (la mas hambrienta) -->
  <g>
    <text x="48" y="358" font-size="34" font-weight="800" fill="#222">3 motores TT omni KIWI</text>
    <text x="48" y="390" font-size="28" fill="#666">pico al arrancar / strafe &#183; rama #1</text>
    <rect x="576" y="332" width="760" height="64" rx="8" fill="url(#barm)"/>
    <text x="600" y="372" font-size="31" font-weight="800" fill="#fff">la rama mas hambrienta del robot*</text>
  </g>
  <!-- chip de CAP TERMICO (rojo) pegado a la barra de motores -->
  <g>
    <rect x="576" y="406" width="760" height="88" rx="8" fill="#FDECEE" stroke="#C8102E" stroke-width="2.5"/>
    <text x="598" y="442" font-size="29" font-weight="800" fill="#C8102E">&#9888; CAP TERMICO real (P0)</text>
    <text x="598" y="478" font-size="28" fill="#a01020">se queman sobre &#8776;70% duty a 7.4 V &#8594; techo &#8776;150 PWM</text>
  </g>

  <!-- 2) 2 camaras OpenMV N6 -->
  <g>
    <text x="48" y="544" font-size="34" font-weight="800" fill="#222">2 camaras OpenMV N6</text>
    <text x="48" y="576" font-size="28" fill="#666">lo mas hambriento de la logica</text>
    <rect x="576" y="520" width="404" height="60" rx="8" fill="url(#barm)"/>
    <text x="600" y="558" font-size="30" font-weight="800" fill="#fff">vision (NPU)*</text>
  </g>

  <!-- 3) 3 Teensy + sensores -->
  <g>
    <text x="48" y="634" font-size="34" font-weight="800" fill="#222">3 Teensy + sensores</text>
    <text x="48" y="666" font-size="28" fill="#666">BNO &#183; 4 ToF &#183; 2 OTOS &#183; anillo 32 LED always-on</text>
    <rect x="576" y="610" width="300" height="60" rx="8" fill="#f0a665"/>
    <text x="600" y="648" font-size="30" font-weight="700" fill="#7a3a06">logica + sensado*</text>
  </g>

  <!-- 4) ESP32-C6 COMM -->
  <g>
    <text x="48" y="724" font-size="34" font-weight="800" fill="#222">ESP32-C6 COMM</text>
    <text x="48" y="756" font-size="28" fill="#666">arbitro &#183; siempre encendido</text>
    <rect x="576" y="700" width="190" height="60" rx="8" fill="#f4bd8a"/>
    <text x="600" y="738" font-size="29" font-weight="700" fill="#7a3a06">hasta 500 mA (spec)</text>
  </g>

  <!-- nota de escala bajo las barras -->
  <text x="576" y="794" font-size="27" fill="#888">Largos RELATIVOS, no a escala absoluta &#8212; ningun mA se midio.*</text>

  <!-- ===== AUTONOMIA (resultado) ===== -->
  <g>
    <rect x="48" y="804" width="654" height="200" rx="12" fill="#FDF1E7" stroke="#E8731A" stroke-width="3"/>
    <text x="72" y="848" font-size="34" font-weight="800" fill="#a8500d">Autonomia estimada*</text>
    <text x="72" y="892" font-size="31" fill="#222">6.8 Ah util  &#247;  consumo promedio estimado</text>
    <text x="72" y="934" font-size="44" font-weight="800" fill="#E8731A">&#8776; rango de minutos &#8212; con &#34;?&#34;</text>
    <text x="72" y="972" font-size="28" fill="#666">depende del duty de motores &#8212; NO es valor unico</text>
    <text x="72" y="1000" font-size="27" fill="#888">(falta pinza + banco para fijarlo)</text>
  </g>

  <!-- ===== CONTRASTE HONESTO: no hay monitoreo ===== -->
  <g>
    <rect x="722" y="804" width="670" height="200" rx="12" fill="#FDECEE" stroke="#C8102E" stroke-width="3"/>
    <text x="746" y="848" font-size="32" font-weight="800" fill="#C8102E">El robot NO sabe cuanta energia le queda</text>
    <text x="746" y="888" font-size="29" fill="#333">&#8226; Sin ADC de bateria &#8594; battery_mv = 0 siempre</text>
    <text x="746" y="922" font-size="29" fill="#333">&#8226; Sin corte propio de bajo voltaje (solo el de la LiPo)</text>
    <text x="746" y="956" font-size="29" fill="#333">&#8226; Brownout OTOS: 3.3 V al limite si la bateria afloja</text>
    <text x="746" y="990" font-size="27" fill="#a01020">(I2C raro 0x64 = brownout, no otro chip &#8212; visto en banco)</text>
  </g>

  <!-- ===== Banda gigante de HONESTIDAD: todo estimado ===== -->
  <g>
    <rect x="48" y="1024" width="1344" height="124" rx="12" fill="#F4F5F7" stroke="#9aa1ab" stroke-width="2.5" stroke-dasharray="9 7"/>
    <text x="84" y="1086" font-size="62" font-weight="800" fill="#6B7280">*</text>
    <text x="132" y="1066" font-size="33" font-weight="800" fill="#4b5563">TODO en esta figura es ESTIMACION DE DISENO, no medida con instrumento</text>
    <text x="132" y="1104" font-size="29" fill="#444">Faltan pinza amperometrica + banco. Declararlo ES la honestidad que puntua Electrical Excellent:</text>
    <text x="132" y="1138" font-size="29" fill="#444">venderlo como medido seria inflado.</text>
  </g>

  <!-- ===== Caption ===== -->
  <text x="48" y="1192" font-size="28" fill="#666">Fig. &#8212; Los motores son la rama mas hambrienta y tienen cap termico real (P0); el resto es estimado y el robot no mide su bateria.</text>
  <text x="48" y="1226" font-size="27" fill="#888">Diagrama original del equipo &#8212; CC BY 4.0  &#183;  Fuente: BOM.md, hardware/electrical/README.md, ESTADO-ACTUAL.md, CONTRATO-DATOS-TOP.md.</text>
</svg>
