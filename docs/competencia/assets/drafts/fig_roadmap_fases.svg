<svg xmlns="http://www.w3.org/2000/svg" width="1980" height="2160" viewBox="0 0 1980 2160" font-family="Inter, Montserrat, Arial, sans-serif">
  <!-- Fig. ROADMAP - Planes a futuro (TDP Future Work / Poster Next Steps).
       Pregunta unica: Como evoluciona el robot sin tirar lo que ya anda?
       Impresion asumida 437 mm. mm/px = 437/1980 = 0.2207.
       24pt (8.47 mm) = 38.4 px  ->  cuerpo minimo 40 px (= 24.1 pt); titulos 64 px.
       Paleta firma poster: TOP #1D4E89 azul, CENTRAL #E8731A naranja,
       DOWN #1E8A4C verde, neutro gris, EMERGENCIA/futuro-no-real #C8102E rojo.
       3 bandas (cada una <=7 unidades): fases, topologia, vision.
       HONESTIDAD: TODO roadmap salvo Fase 0 (HECHA). Punteado = futuro. -->
  <defs>
    <marker id="mGray" markerWidth="7" markerHeight="6" refX="5.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4A4A4A"/>
    </marker>
    <marker id="mDash" markerWidth="7" markerHeight="6" refX="5.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8A8A8A"/>
    </marker>
    <marker id="mBlue" markerWidth="7" markerHeight="6" refX="5.2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1D4E89"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1980" height="2160" fill="#FFFFFF"/>

  <!-- Titulo interno (lectura a 3 m) -->
  <text x="40" y="86" font-size="64" font-weight="800" fill="#333333">PLANES A FUTURO: CRECER SIN TIRAR LO QUE ANDA</text>
  <text x="40" y="140" font-size="42" fill="#666666">Cada fase REUSA lo anterior. Solo la Fase 0 esta HECHA; el resto es roadmap post-Incheon.</text>

  <!-- Leyenda global (mas de un tipo de linea, obligatoria) -->
  <g>
    <rect x="1300" y="168" width="560" height="150" rx="12" fill="#F5F5F5" stroke="#BBBBBB" stroke-width="2"/>
    <rect x="1326" y="196" width="40" height="26" rx="5" fill="#1E8A4C"/>
    <text x="1378" y="218" font-size="38" fill="#2B2B2B">relleno solido = HECHO</text>
    <rect x="1326" y="242" width="40" height="26" rx="5" fill="none" stroke="#8A8A8A" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="1378" y="264" font-size="38" fill="#2B2B2B">punteado = ROADMAP (futuro)</text>
    <text x="1326" y="306" font-size="34" fill="#888888">cifras de costo = estimacion de diseno*</text>
  </g>

  <!-- BANDA 1 : TIMELINE DE FASES (Incheon 2026, Nacional, Mundial 2027) -->
  <text x="40" y="232" font-size="52" font-weight="800" fill="#333333">1 . La evolucion por fases</text>

  <!-- Cinta del timeline -->
  <line x1="80" y1="300" x2="1240" y2="300" stroke="#CFCFCF" stroke-width="10"/>
  <g font-size="34" fill="#777777" text-anchor="middle">
    <circle cx="180" cy="300" r="13" fill="#1E8A4C"/>
    <text x="180" y="278">Incheon jun-2026</text>
    <circle cx="660" cy="300" r="13" fill="#9A9A9A"/>
    <text x="660" y="278">Nacional nov-2026</text>
    <circle cx="1160" cy="300" r="13" fill="#9A9A9A"/>
    <text x="1160" y="278">Mundial 2027</text>
  </g>

  <!-- FASE 0 : HECHA (verde solido) -->
  <g>
    <rect x="40" y="340" width="430" height="300" rx="16" fill="#E9F4EA" stroke="#1E8A4C" stroke-width="5"/>
    <path d="M40,356 a16,16 0 0 1 16,-16 h398 a16,16 0 0 1 16,16 v60 h-430 Z" fill="#1E8A4C"/>
    <text x="66" y="402" font-size="46" font-weight="800" fill="#FFFFFF">FASE 0 : HECHO</text>
    <text x="66" y="472" font-size="40" fill="#2B2B2B">UART punto-a-punto</text>
    <text x="66" y="522" font-size="40" fill="#2B2B2B">+ telemetria por USB</text>
    <text x="66" y="572" font-size="36" fill="#555555">app monitor-base lee JSON</text>
    <text x="66" y="616" font-size="36" fill="#555555">Lines, con o sin robot.</text>
  </g>

  <!-- FASE A : opcional (azul punteado) -->
  <g>
    <rect x="488" y="340" width="392" height="300" rx="16" fill="#EAF1F8" stroke="#1D4E89" stroke-width="4" stroke-dasharray="10 8"/>
    <path d="M488,356 a16,16 0 0 1 16,-16 h360 a16,16 0 0 1 16,16 v60 h-392 Z" fill="#1D4E89"/>
    <text x="514" y="402" font-size="46" font-weight="800" fill="#FFFFFF">FASE A : opc.</text>
    <text x="514" y="472" font-size="40" fill="#2B2B2B">Puente ESP32 WiFi</text>
    <text x="514" y="522" font-size="40" fill="#2B2B2B">= telemetria sin cable</text>
    <text x="514" y="578" font-size="36" fill="#555555">~2-3 dias SW</text>
    <text x="514" y="620" font-size="36" fill="#555555">USD 5-10/robot*</text>
  </g>

  <!-- FASE B : CAN troncal (azul punteado) -->
  <g>
    <rect x="892" y="340" width="370" height="300" rx="16" fill="#EAF1F8" stroke="#1D4E89" stroke-width="4" stroke-dasharray="10 8"/>
    <path d="M892,356 a16,16 0 0 1 16,-16 h338 a16,16 0 0 1 16,16 v60 h-370 Z" fill="#1D4E89"/>
    <text x="916" y="402" font-size="46" font-weight="800" fill="#FFFFFF">FASE B</text>
    <text x="916" y="472" font-size="40" fill="#2B2B2B">Bus CAN-FD troncal</text>
    <text x="916" y="522" font-size="40" fill="#2B2B2B">reemplaza los UART</text>
    <text x="916" y="578" font-size="36" fill="#555555">FlexCAN ya en Teensy</text>
    <text x="916" y="620" font-size="36" fill="#555555">+ chip ~USD 0.50*</text>
  </g>

  <!-- FASE C : gateway + telemetria F1 (azul punteado) -->
  <g>
    <rect x="1284" y="340" width="576" height="300" rx="16" fill="#EAF1F8" stroke="#1D4E89" stroke-width="4" stroke-dasharray="10 8"/>
    <path d="M1284,356 a16,16 0 0 1 16,-16 h544 a16,16 0 0 1 16,16 v60 h-576 Z" fill="#1D4E89"/>
    <text x="1308" y="402" font-size="46" font-weight="800" fill="#FFFFFF">FASE C</text>
    <text x="1308" y="470" font-size="40" fill="#2B2B2B">4ta placa ESP32 GATEWAY</text>
    <text x="1308" y="518" font-size="34" fill="#555555">3 enlaces: firmware propio,</text>
    <text x="1308" y="560" font-size="34" fill="#555555">telemetria WiFi y ESP-NOW</text>
    <text x="1308" y="602" font-size="34" fill="#555555">al robot companero</text>
    <text x="1308" y="630" font-size="36" font-weight="700" fill="#1D4E89">+ telemetria estilo F1</text>
  </g>

  <!-- Flechas reusa entre fases (verde solido la 1a; futuro punteadas) -->
  <line x1="471" y1="490" x2="487" y2="490" stroke="#1E8A4C" stroke-width="7" marker-end="url(#mBlue)"/>
  <line x1="881" y1="490" x2="890" y2="490" stroke="#8A8A8A" stroke-width="5" marker-end="url(#mDash)"/>
  <line x1="1264" y1="490" x2="1281" y2="490" stroke="#8A8A8A" stroke-width="5" stroke-dasharray="6 5" marker-end="url(#mDash)"/>

  <line x1="40" y1="700" x2="1940" y2="700" stroke="#E2E2E2" stroke-width="3"/>

  <!-- BANDA 2 : TOPOLOGIA ANTES vs DESPUES -->
  <text x="40" y="772" font-size="52" font-weight="800" fill="#333333">2 . Topologia de cables: ANTES vs DESPUES</text>

  <!-- PANEL ANTES (HOY / Fase 0) -->
  <g>
    <rect x="40" y="804" width="860" height="560" rx="16" fill="#FAFAFA" stroke="#1E8A4C" stroke-width="4"/>
    <text x="70" y="858" font-size="48" font-weight="800" fill="#1E8A4C">HOY: UART punto-a-punto (HECHO)</text>
    <text x="70" y="906" font-size="38" fill="#777777">un cable por cada par de placas = espagueti</text>

    <g font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <rect x="120" y="960" width="220" height="110" rx="12" fill="#1D4E89"/>
      <text x="230" y="1028">TOP</text>
      <rect x="600" y="960" width="220" height="110" rx="12" fill="#1E8A4C"/>
      <text x="710" y="1028">DOWN</text>
      <rect x="360" y="1180" width="220" height="110" rx="12" fill="#E8731A"/>
      <text x="470" y="1248">CENTRAL</text>
    </g>
    <line x1="340" y1="1015" x2="600" y2="1015" stroke="#4A4A4A" stroke-width="6"/>
    <line x1="230" y1="1070" x2="430" y2="1180" stroke="#4A4A4A" stroke-width="6"/>
    <line x1="710" y1="1070" x2="520" y2="1180" stroke="#4A4A4A" stroke-width="6"/>
    <line x1="290" y1="1070" x2="380" y2="1180" stroke="#4A4A4A" stroke-width="6"/>
    <line x1="650" y1="1070" x2="560" y2="1180" stroke="#4A4A4A" stroke-width="6"/>
    <text x="470" y="1330" font-size="34" fill="#888888" text-anchor="middle">4 enlaces UART dedicados + USB a la laptop</text>
  </g>

  <!-- flecha evoluciona ANTES a DESPUES (futuro punteada) -->
  <line x1="912" y1="1084" x2="990" y2="1084" stroke="#8A8A8A" stroke-width="7" stroke-dasharray="10 7" marker-end="url(#mDash)"/>
  <text x="951" y="1058" font-size="34" font-weight="700" fill="#8A8A8A" text-anchor="middle">evoluciona</text>

  <!-- PANEL DESPUES (Fase B+C) -->
  <g>
    <rect x="1000" y="804" width="860" height="560" rx="16" fill="#FAFAFA" stroke="#1D4E89" stroke-width="4" stroke-dasharray="12 9"/>
    <text x="1030" y="858" font-size="44" font-weight="800" fill="#1D4E89">DESPUES: bus CAN + gateway (futuro)</text>
    <text x="1030" y="906" font-size="36" fill="#777777">todos cuelgan de 2 hilos; el gateway abre al exterior</text>

    <line x1="1060" y1="1080" x2="1800" y2="1080" stroke="#1D4E89" stroke-width="9"/>
    <line x1="1060" y1="1100" x2="1800" y2="1100" stroke="#1D4E89" stroke-width="9"/>
    <text x="1430" y="1156" font-size="34" fill="#1D4E89" text-anchor="middle">bus CAN-FD (2 hilos) + 2 resistencias 120 ohm</text>

    <g font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <rect x="1075" y="950" width="170" height="96" rx="10" fill="#1D4E89"/>
      <text x="1160" y="1010">TOP</text>
      <rect x="1290" y="950" width="170" height="96" rx="10" fill="#1E8A4C"/>
      <text x="1375" y="1010">DOWN</text>
      <rect x="1505" y="950" width="190" height="96" rx="10" fill="#E8731A"/>
      <text x="1600" y="1010">CENTRAL</text>
      <rect x="1700" y="950" width="100" height="96" rx="10" fill="#555555"/>
      <text x="1750" y="1000" font-size="30">GATE</text>
      <text x="1750" y="1034" font-size="30">WAY</text>
    </g>
    <line x1="1160" y1="1046" x2="1160" y2="1080" stroke="#1D4E89" stroke-width="7"/>
    <line x1="1375" y1="1046" x2="1375" y2="1080" stroke="#1E8A4C" stroke-width="7"/>
    <line x1="1600" y1="1046" x2="1600" y2="1080" stroke="#E8731A" stroke-width="7"/>
    <line x1="1750" y1="1046" x2="1750" y2="1080" stroke="#555555" stroke-width="7"/>

    <line x1="1745" y1="1150" x2="1530" y2="1280" stroke="#8A8A8A" stroke-width="6" stroke-dasharray="9 7" marker-end="url(#mDash)"/>
    <text x="1470" y="1318" font-size="34" fill="#1D4E89" text-anchor="middle">WiFi a la laptop</text>
    <line x1="1760" y1="1150" x2="1745" y2="1280" stroke="#8A8A8A" stroke-width="6" stroke-dasharray="9 7" marker-end="url(#mDash)"/>
    <text x="1730" y="1318" font-size="34" fill="#1D4E89" text-anchor="middle">ESP-NOW</text>
    <text x="1730" y="1354" font-size="30" fill="#888888" text-anchor="middle">al robot companero</text>
  </g>

  <line x1="40" y1="1410" x2="1940" y2="1410" stroke="#E2E2E2" stroke-width="3"/>

  <!-- BANDA 3 : PIPELINE DE VISION (HOY vs FUTURO) -->
  <text x="40" y="1482" font-size="52" font-weight="800" fill="#333333">3 . Pipeline de vision: HOY vs FUTURO</text>

  <!-- cadena HOY (solido = anda) -->
  <text x="70" y="1556" font-size="44" font-weight="800" fill="#1E8A4C">HOY (HECHO)</text>
  <g font-size="40" fill="#2B2B2B">
    <rect x="70" y="1590" width="300" height="120" rx="14" fill="#EAF1F8" stroke="#1D4E89" stroke-width="4"/>
    <text x="220" y="1648" font-size="40" font-weight="700" fill="#1D4E89" text-anchor="middle">Camara N6</text>
    <text x="220" y="1692" font-size="34" fill="#555555" text-anchor="middle">(2 a bordo)</text>

    <line x1="370" y1="1650" x2="438" y2="1650" stroke="#4A4A4A" stroke-width="7" marker-end="url(#mGray)"/>

    <rect x="450" y="1590" width="340" height="120" rx="14" fill="#F2F2F2" stroke="#4A4A4A" stroke-width="4"/>
    <text x="620" y="1648" font-size="40" font-weight="700" fill="#333333" text-anchor="middle">Umbrales LAB</text>
    <text x="620" y="1692" font-size="34" fill="#555555" text-anchor="middle">(color, por rango)</text>

    <line x1="790" y1="1650" x2="858" y2="1650" stroke="#4A4A4A" stroke-width="7" marker-end="url(#mGray)"/>

    <rect x="870" y="1590" width="300" height="120" rx="14" fill="#F2F2F2" stroke="#4A4A4A" stroke-width="4"/>
    <text x="1020" y="1648" font-size="40" font-weight="700" fill="#333333" text-anchor="middle">Blobs</text>
    <text x="1020" y="1692" font-size="34" fill="#555555" text-anchor="middle">pelota + arcos</text>
  </g>

  <!-- flecha evoluciona HOY a FUTURO -->
  <line x1="1220" y1="1650" x2="1310" y2="1650" stroke="#8A8A8A" stroke-width="8" stroke-dasharray="10 7" marker-end="url(#mDash)"/>
  <text x="1265" y="1620" font-size="34" font-weight="700" fill="#8A8A8A" text-anchor="middle">evoluciona</text>

  <!-- cadena FUTURO (punteado = roadmap) -->
  <text x="1360" y="1556" font-size="44" font-weight="800" fill="#1D4E89">FUTURO (ROADMAP)</text>
  <g font-size="40" fill="#2B2B2B">
    <rect x="1360" y="1590" width="220" height="120" rx="14" fill="#EAF1F8" stroke="#1D4E89" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="1470" y="1648" font-size="40" font-weight="700" fill="#1D4E89" text-anchor="middle">Camara N6</text>
    <text x="1470" y="1692" font-size="34" fill="#555555" text-anchor="middle">(misma)</text>

    <line x1="1580" y1="1650" x2="1628" y2="1650" stroke="#8A8A8A" stroke-width="7" stroke-dasharray="8 6" marker-end="url(#mDash)"/>

    <rect x="1640" y="1590" width="220" height="120" rx="14" fill="#EAF1F8" stroke="#1D4E89" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="1750" y="1638" font-size="36" font-weight="700" fill="#1D4E89" text-anchor="middle">red YOLO en</text>
    <text x="1750" y="1684" font-size="32" fill="#555555" text-anchor="middle">NPU Neural-ART</text>
  </g>
  <!-- salida FUTURO + LAB de fallback -->
  <line x1="1750" y1="1710" x2="1750" y2="1762" stroke="#8A8A8A" stroke-width="7" stroke-dasharray="8 6" marker-end="url(#mDash)"/>
  <text x="1750" y="1808" font-size="38" font-weight="700" fill="#1D4E89" text-anchor="middle">detecciones</text>
  <text x="1470" y="1772" font-size="34" fill="#888888" text-anchor="middle">(con LAB de FALLBACK</text>
  <text x="1470" y="1814" font-size="34" fill="#888888" text-anchor="middle">si la red no ve)</text>
  <line x1="1470" y1="1710" x2="1600" y2="1755" stroke="#8A8A8A" stroke-width="5" stroke-dasharray="8 6"/>

  <line x1="40" y1="1870" x2="1940" y2="1870" stroke="#D8D8D8" stroke-width="3"/>

  <!-- CAPTION obligatoria: takeaway + honestidad + credito -->
  <text x="40" y="1938" font-size="44" font-weight="800" fill="#333333">Fig.: El robot crece por fases que REUSAN lo anterior: de UART+USB (hoy)</text>
  <text x="40" y="1990" font-size="44" font-weight="800" fill="#333333">a CAN troncal + gateway con telemetria F1 + vision YOLO, sin tirar nada.</text>
  <text x="40" y="2048" font-size="38" fill="#C8102E" font-weight="700">HONESTIDAD: solo la Fase 0 esta HECHA. Lo punteado es roadmap post-Incheon, NO compromiso 2026.</text>
  <text x="40" y="2098" font-size="36" fill="#666666">* costos = estimacion de diseno (no cotizados). Apunta a TDP "Future Work" + Poster "Next Steps".</text>
  <text x="40" y="2146" font-size="36" fill="#666666">Diagrama original del equipo - CC BY 4.0</text>
</svg>
