; ESP32 Telemetry Bridge v0
; Standalone PlatformIO project — independiente del firmware de competencia.
;
; Compilar:    pio run -e esp32-bridge
; Flashear:    pio run -e esp32-bridge -t upload
; Monitor:     pio device monitor -b 115200
;
; Para activar OTA inalámbrico (después de un primer flash por USB con
; OTA_ENABLE=1 en config.h):
;   pio run -e esp32-bridge-ota -t upload --upload-port 192.168.x.y

[platformio]
default_envs = esp32-bridge

[env]
platform = espressif32@^6.5.0
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -I include
lib_deps =
    ; Sin libs externas — solo el core de Arduino-ESP32.

; -----------------------------------------------------------------------------
; ESP32 clásico (WROOM-32 DevKitC)
; -----------------------------------------------------------------------------
[env:esp32-bridge]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0     ; el WROOM no tiene USB nativo
upload_speed = 921600

; -----------------------------------------------------------------------------
; ESP32-C3 SuperMini (alternativa más chica / barata)
; -----------------------------------------------------------------------------
[env:esp32c3-bridge]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1     ; el C3 tiene USB nativo

; -----------------------------------------------------------------------------
; OTA — mismo binario, sube por red
; -----------------------------------------------------------------------------
[env:esp32-bridge-ota]
extends = env:esp32-bridge
upload_protocol = espota
; Especificar IP en CLI: --upload-port 192.168.x.y
