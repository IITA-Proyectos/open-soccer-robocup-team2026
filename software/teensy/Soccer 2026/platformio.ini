    -std=gnu++17
    -I src/shared
    -I src/central

; ============================================================
; HAL refactor 2026-05-29 (Sprint A): envs por robot
; ============================================================
; El env [env:top] original ahora FALLA a compilar porque ni ROBOT1 ni
; ROBOT2 está definido en build_flags. Usar [env:top_robot1] o
; [env:top_robot2] explícitamente. Documentado por #error claro en
; hardware_profile.h.
;
; Spec: docs/superpowers/specs/2026-05-29-hal-robot-config-design.md

[env:top_robot1]
extends = env:top
; -DTOP_ENABLE_MULTI_TOF: 4 ToF (0x2A..0x2D, enumeracion por LP) ACTIVOS POR DEFAULT
; desde 2026-06-01 (decision Gustavo; validado en banco + pin 10 libre por rol-via-#define).
; 2026-06-08 (banco): en ROBOT1 el BNO comparte el bus Wire con los ToF y el yaw se CONGELABA
; en produccion (no en el diag). FIX activo:
;  -DTOP_BNO_TOF_DECONFLICT = aisla el read del BNO de los reads de ToF en el loop
;                             (main_top.cpp) -> el read no se corrompe. Es el FIX real.
; ⚠️ TOP_ENABLE_BNO_FREEZE_DETECT QUITADO 2026-06-08: con el robot QUIETO el BNO055 (fusion)
;    es tan estable que reporta el MISMO centideg -> el detector daba FALSO-DEAD y LATCHEABA
;    (heading_valid=0, hdg=0.0, no se recuperaba al girar). Para re-activarlo hace falta tunear
;    N/T en src/shared/imu_freeze.h (umbral mas largo) Y que NO latchee (recupere al cambiar el
;    valor). Mientras tanto: detector OFF; el deconflict mantiene el BNO vivo. Banco aparte: [env:top_robot1_bnofreeze].
; ROBOT2 NO lleva el deconflict: tiene el BNO en Wire1 (bus aparte) -> sin contencion.
; >>> BANCO: girar el robot y confirmar que el hdg del snapshot AHORA trackea (sin caer a 0).
; 2026-06-08: EXPERIMENTO noInterrupts (TOP_BNO_READ_NOINTERRUPTS) PROBADO Y DESCARTADO -> NO destrabo
;   el yaw. Junto con 100kHz + 20Hz + deconflict (4 band-aids), el SOFTWARE NO resuelve la contencion
;   del BNO055 en el bus Wire compartido con los ToF bajo la carga de main_top (anda en el diag, no en
;   produccion). >>> FIX DE FONDO: BNO a un bus I2C APARTE (como ROBOT2). Mover 2 cables del BNO +
;   camino de firmware con &Wire2/&Wire1 (pendiente: confirmar pines libres del TOP).
build_flags = ${env:top.build_flags} -DROBOT1 -DTOP_ENABLE_MULTI_TOF -DTOP_ENABLE_HCSR04 -DTOP_BNO_TOF_DECONFLICT

[env:top_robot2]
extends = env:top
build_flags = ${env:top.build_flags} -DROBOT2 -DTOP_ENABLE_MULTI_TOF -DTOP_ENABLE_HCSR04

; --- top_robot1_bnofreeze: ALIAS de top_robot1 (el flag ya entro a top_robot1 el 2026-06-08) ---
; ⚠️ DESDE 2026-06-08 TOP_ENABLE_BNO_FREEZE_DETECT ya esta ON en `top_robot1` por default
; (contencion BNO+ToF en ROBOT1, ver arriba). Este env queda como alias (flag duplicado = inocuo).
; Procedimiento de banco para validar el detector: flashear, congelar el BNO (o simularlo) y
; confirmar que cae a DEAD; y con el robot QUIETO un rato largo confirmar que NO da falsos-DEAD.
; Tunear N/T en src/shared/imu_freeze.h.
;   pio run -e top_robot1 -t upload     (ya trae el detector)
[env:top_robot1_bnofreeze]
extends = env:top_robot1
build_flags = ${env:top_robot1.build_flags} -DTOP_ENABLE_BNO_FREEZE_DETECT

; --- Variantes *_multitof (OBSOLETAS desde 2026-06-01) ---
; Los 4 ToF (enumeracion 0x2A..0x2D por LP) AHORA SON DEFAULT en top_robot1/top_robot2
; (validado en banco + pin 10 libre porque el rol va por #define, no por dipswitch).
; Estos envs quedan como ALIAS redundantes de top_robot1/2 (el flag duplicado es inocuo).
[env:top_robot1_multitof]
extends = env:top_robot1
build_flags = ${env:top_robot1.build_flags} -DTOP_ENABLE_MULTI_TOF

[env:top_robot2_multitof]
extends = env:top_robot2
build_flags = ${env:top_robot2.build_flags} -DTOP_ENABLE_MULTI_TOF

[env:diag_localization_live_robot1]
extends = env:diag_localization_live
build_flags = ${env:diag_localization_live.build_flags} -DROBOT1

[env:diag_localization_live_robot2]
extends = env:diag_localization_live
build_flags = ${env:diag_localization_live.build_flags} -DROBOT2

; diag_sensors_tof_live también pasa por sensors_tof.cpp -> config_top.h
; -> hardware_profile.h, así que también necesita -DROBOT1/2 explícito.
[env:diag_sensors_tof_live_robot1]
extends = env:diag_sensors_tof_live
build_flags = ${env:diag_sensors_tof_live.build_flags} -DROBOT1

[env:diag_sensors_tof_live_robot2]
extends = env:diag_sensors_tof_live
build_flags = ${env:diag_sensors_tof_live.build_flags} -DROBOT2

; ============================================================
; diag_central_comm_down — Receiver de banco del link DOWN -> CENTRAL
; (placa CENTRAL, Teensy 4.1). NO es firmware de competencia.
;
; Escucha Serial1 (RX1 = pin 0), corre el FrameDecoder del protocolo, y por
; cada frame imprime el LineStatusV2 que DOWN ya manda + salud del enlace
; (frames, CRC, resync, huecos de SEQ). Primer paso del bring-up DOWN->CENTRAL:
; validar que los bytes fluyen antes de sumar mensajes nuevos (32 sensores).
;
;   pio run -e diag_central_comm_down -t upload
;   pio device monitor -b 115200
;
; ⚠️ Cablear: DOWN TX1 (pin 1) -> CENTRAL RX1 (pin 0), GND comun. Baud 230400.
;    El link DOWN->CENTRAL es Serial1 (0/1), reasignado 2026-05-31 (igual que comm_down
;    de produccion y que el .cpp de este env). NO cablear al pin 7 -> ahi va el motor 2
;    (driver U17). El conflicto 7/8 quedo RESUELTO al mover el UART a Serial1.
;
; Doc: docs/firmware/DIAG-CENTRAL-COMM-DOWN.md
; ============================================================
[env:diag_central_comm_down]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -DBOARD_CENTRAL_DIAG
    -std=gnu++17
    -I src/shared
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_central_comm_down.cpp> +<shared/proto.cpp> +<shared/crc16.cpp>

; ============================================================
; diag_central_rx_all — Receiver de banco de la CENTRAL que escucha LAS DOS placas
; (DOWN por Serial1/pin 0 + TOP por Serial7/pin 28), decodifica campo por campo cada
; protocolo (LineStatusV2 + Pose2D + Velocity2D de DOWN; WorldSnapshot de TOP) y lo
; imprime por USB. Para probar la cadena de comunicacion con las 3 placas conectadas.
;   pio run -e diag_central_rx_all -t upload
;   pio device monitor -b 115200
; Cableado: DOWN TX1(pin1)->CEN pin0 ; TOP TX4(pin17)->CEN pin28 ; GND comun. Baud 230400.
; ============================================================
[env:diag_central_rx_all]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -DBOARD_CENTRAL_DIAG
    -std=gnu++17
    -I src/shared
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_central_rx_all.cpp> +<shared/proto.cpp> +<shared/crc16.cpp>

; ============================================================
; PAR DE TEST DE ENLACE MINIMO DOWN <-> CENTRAL ("mandar un 1")
; Aisla el cable del protocolo: DOWN manda '1', CENTRAL lo recibe. Sin muxes,
; sin motores -> el pin 13 queda LIBRE como LED en ambos, y esquiva el conflicto
; de pines 7/8 (TASK-036) porque el receiver NO inicializa motores.
; Cableado: DOWN pin 1 (TX1) -> CENTRAL pin 7 (RX2) + GND comun. Baud 230400.
;   DOWN:    pio run -e diag_down_send1   -t upload   (Teensy 4.0)
;   CENTRAL: pio run -e diag_central_recv1 -t upload  (Teensy 4.1)
;   monitor: pio device monitor -b 115200
; ============================================================
[env:diag_down_send1]
platform = teensy
board = teensy40
framework = arduino
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_down_send1.cpp>

; ============================================================
; diag_down_calibracion — Herramienta de calibracion de los 32 sensores de
; linea (placa DOWN, Teensy 4.0). NO es firmware de competencia.
; Calibra verde/blanco por comandos del monitor y GUARDA en EEPROM. Pensada
; para usar en cancha. Usa las funciones reales del firmware (line_ring +
; eeprom_calib), asi lo calibrado es lo que despues usa el firmware.
;   pio run -e diag_down_calibracion -t upload
;   pio device monitor -b 115200
; Comandos: c=verde b=blanco t=probar s=guardar v=ver m=sospechosos l=cargar x=borrar h=ayuda
; ============================================================
[env:diag_down_calibracion]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_DOWN
    -DDOWN_NUM_MUXES_CONNECTED=4    ; placa fixeada (32 sensores)
    -DDOWN_NUM_OTOS_CONNECTED=2
    -std=gnu++17
    -I src/shared
    -I src/down
build_unflags = -std=gnu++11
; Incluye el sketch + el codigo de DOWN que usa (line_ring, eeprom_calib),
; pero EXCLUYE main_down.cpp (si no, dos setup()/loop()).
build_src_filter = +<diag/diag_down_calibracion.cpp> +<down/> -<down/main_down.cpp> +<shared/>

[env:diag_central_recv1]
platform = teensy
board = teensy41
framework = arduino
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_central_recv1.cpp>

; ============================================================
; diag_central_line_sweep — Barrido lateral por tiempo + freno por linea
; (placa CENTRAL, Teensy 4.1). NO es firmware de competencia.
;
; SEGUNDO paso del bring-up DOWN->CENTRAL: tras validar la recepcion con
; diag_central_comm_down, este sketch suma los MOTORES. Recibe LineStatusV2 de
; DOWN por Serial7 (RX7 = pin 28) con el protocolo real, hace un barrido lateral
; (4 s derecha / 4 s izquierda, arranca/para con boton pin 9) usando la
; cinematica inversa real, y FRENA ante salida inminente / robot levantado /
; enlace caido.
;
;   pio run -e diag_central_line_sweep_robot1 -t upload   ; arquero
;   pio run -e diag_central_line_sweep_robot2 -t upload   ; delantero
;   pio device monitor -b 115200      ; <-- 115200, NO 230400
;
; Cablear: DOWN TX1 (pin 1) -> CENTRAL RX7 (pin 28), GND comun. Baud 230400.
; Se recibe por Serial7 (no Serial2) para esquivar el conflicto pines 7/8 con
; el motor 2 (TASK-036): asi los motores usan 7/8 libremente.
;
; Flags opcionales:
;   -DSWEEP_SPEED_MM_S=200      velocidad lateral (default 250)
;   -DSWEEP_HALF_PERIOD_MS=4000 tiempo por lado en ms (default 4000)
;   -DSWEEP_REQUIRE_LINE        exige line_present para moverse (default OFF)
; ============================================================
[env:diag_central_line_sweep_robot1]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -DROBOT1
    -DBOARD_CENTRAL_DIAG
    -std=gnu++17
    -I src/shared
    -I src/central
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_central_line_sweep.cpp>
                   +<central/imu_zircon.cpp>
                   +<shared/proto.cpp>
                   +<shared/crc16.cpp>

[env:diag_central_line_sweep_robot2]
extends = env:diag_central_line_sweep_robot1
build_flags =
    -DROBOT2
    -DBOARD_CENTRAL_DIAG
    -std=gnu++17
    -I src/shared
    -I src/central

; --- Variante SIN freno de seguridad (solo para validar el movimiento en banco) ---
; Igual que line_sweep pero con -DSWEEP_NO_SAFETY: ignora SALIDA INMINENTE y
; LEVANTADO (el watchdog del enlace SIGUE activo). Sirve para ver el barrido
; completo de 4s a cada lado cuando la placa DOWN aun no esta calibrada y reporta
; salida inminente falsa. ⚠️ El robot NO se protege de salir de cancha: usar SOLO
; con ruedas al aire o espacio controlado. Reactivar la seguridad (env normal)
; cuando DOWN este calibrada.
;   pio run -e diag_central_line_sweep_nosafety_robot1 -t upload
[env:diag_central_line_sweep_nosafety_robot1]
extends = env:diag_central_line_sweep_robot1
build_flags =
    -DROBOT1
    -DBOARD_CENTRAL_DIAG
    -DSWEEP_NO_SAFETY
    -std=gnu++17
    -I src/shared
    -I src/central

[env:diag_central_line_sweep_nosafety_robot2]
extends = env:diag_central_line_sweep_robot1
build_flags =
    -DROBOT2
    -DBOARD_CENTRAL_DIAG
    -DSWEEP_NO_SAFETY
    -std=gnu++17
    -I src/shared
    -I src/central

; ============================================================
; diag_top_cameras — verificación enlace OpenMV → TOP (Teensy 4.0, banco)
; Lee las 2 cámaras (frontal=Serial3/RX15/U8, trasera=Serial5/RX21) con el
; parser de PRODUCCIÓN (cameras.cpp) e imprime por USB: bytes recibidos, paquetes
; decodificados, resyncs, crudo, y veredicto (SIN BYTES / FORMATO RARO / FORMATO OK).
; Verifica que el formato que mandan las cámaras es el que el TOP espera.
;   pio run -e diag_top_cameras -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_top_cameras]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -std=gnu++17
    -I src/top
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_top_cameras.cpp> +<top/cameras.cpp>

; ============================================================
; diag_top_ultrasonic — DIAGNOSTICO del HC-SR04 (ultrasonido frontal, placa TOP)
; NO es firmware de competencia. Pulsa TRIG (pin 4), mide ECHO (pin 3) con pulseIn,
; e imprime distancia en cm + salud por USB. v2 prueba ambas orientaciones de pin.
;
; ⚠️ ECHO del HC-SR04 a 5V DANA el pin 3 del Teensy (no tolera 5V). Usar divisor en
;    ECHO (1k+2k -> 3.3V). NO bajar Vcc a 3.3V (apaga el HC-SR04 clasico). Ver .cpp.
;
;   pio run -e diag_top_ultrasonic -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_top_ultrasonic]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_top_ultrasonic.cpp>

; ============================================================
; diag_top_bno — MOVIDO a _deprecated/ (2026-06-04). Asumía la arquitectura I2C
; vieja (BNO derecho U11 en Wire1, REMAP pines 24/25), que YA NO EXISTE: tras el
; recableado (2026-05-31) ambos BNO viven en Wire y el derecho (0x29) es la unidad
; FALLADA (el robot corre con 1 solo BNO). Ya no tiene [env] (no se puede flashear).
; Para verificar los BNO en banco HOY usá: [env:diag_bno_dual_live] (fusión de los 2,
; degrada a 1) o [env:diag_bno_left] (solo el 0x28 vivo, incl. sentido de giro).
; ============================================================

; ============================================================
; diag_bno_left — Test DIRECTO del BNO055 LEFT (0x28) SOLO (no toca el 2do BNO 0x29).
; Lee crudo (lib Adafruit): yaw + giroscopio + calibracion en vivo, para diagnosticar el
; heading clavado. Duerme los ToF (LP low) para limpiar el bus. SEGURO con 1 solo BNO.
;   pio run -e diag_bno_left -t upload ; pio device monitor -b 115200
; ============================================================
[env:diag_bno_left]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_bno_left.cpp>

; ============================================================
; diag_bno_tof / _slow — BISECT: BNO 0x28 + 4 ToF ACTIVOS en el MISMO bus Wire (sin
; camaras/HCSR04/fusion). Aisla si el heading clavado es por coexistencia BNO+ToF en I2C.
; _slow = igual pero a 100 kHz (para ver si bajar la velocidad lo arregla).
;   pio run -e diag_bno_tof -t upload        (400 kHz) ; power-cycle ; monitor
;   pio run -e diag_bno_tof_slow -t upload   (100 kHz)
; ============================================================
[env:diag_bno_tof]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_bno_tof.cpp>

[env:diag_bno_tof_slow]
extends = env:diag_bno_tof
build_flags = ${env:diag_bno_tof.build_flags} -DDIAG_BNO_TOF_100K

; ============================================================
; diag_bno_dual_live — Valida los 2 BNO055 + fusion de heading (promedio
; circular, desacuerdo, deteccion de impacto). Degrada a 1 BNO. Primer test a
; correr cuando se suelde el 2do BNO (RIGHT, Wire1 24/25).
; Comandos serial: z=recapturar cero, d=drift 20s.
;
;   pio run -e diag_bno_dual_live -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_bno_dual_live]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_bno_dual_live.cpp>

; ============================================================
; diag_bno_addr_check — Verifica el puente ADR del 2do BNO (arquitectura NUEVA:
; los 2 BNO en el MISMO bus Wire, uno en 0x28 y el puenteado en 0x29). Duerme
; los 4 ToF (LP 9/10/11/12 en LOW) para que no contaminen 0x29, y confirma con
; chip-id 0xA0 que lo de 0x29 es un BNO real y no un ToF.
;   PASO A: solo el BNO nuevo conectado -> esperar 0x29 = BNO (puente OK).
;   PASO B: los 2 BNO -> esperar 0x28 + 0x29, ambos BNO.
;
;   pio run -e diag_bno_addr_check -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_bno_addr_check]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_bno_addr_check.cpp>

; ============================================================
; diag_pose_live — Pose (x,y,heading) en vivo: enumera los 4 ToF + lee el BNO
; y llama al ALGORITMO REAL localization_compute() de shared/localization.cpp.
; Test de aceptacion de la Capa 1 (XY con 4 ToF) en posiciones conocidas.
; POWER-CYCLE tras flashear (direcciones I2C de ToF persisten). 'z'=fijar cero.
;
;   pio run -e diag_pose_live -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_pose_live]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
    -I src/shared
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_pose_live.cpp> +<shared/localization.cpp>

; ============================================================
; diag_top_comm_down — VERIFICA el enlace DOWN -> TOP (Serial1).
; Reusa el modulo vivo comm_down.cpp (mismo parser/contrato que produccion) y
; muestra frames/s + CRC-err + frescura de los 3 mensajes (linea + OTOS pose/vel).
; Usar tras desenchufar/reconectar cables DOWN<->TOP para confirmar el enlace.
;   pio run -e diag_top_comm_down -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_top_comm_down]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -DROBOT1
    -std=gnu++17
    -I src/shared
    -I src/top
build_unflags = -std=gnu++11
; El diag + comm_down (vivo) + sus deps de shared (proto, crc16, line_view via
; header). EXCLUYE main_top.cpp y el resto de los diags (evita doble setup/loop).
build_src_filter = +<diag/diag_top_comm_down.cpp> +<top/comm_down.cpp> +<shared/proto.cpp> +<shared/crc16.cpp>

; ============================================================
; Variantes de BANCO para las features de confiabilidad gateadas (auditoría
; 2026-06-05 batch 2). Son ADITIVAS: NO cambian central_robot1 / down. Probarlas
; en banco; si pasan, mover el -D al env de competencia.
; ============================================================
[env:central_robot1_wdt]
extends = env:central_robot1
build_flags = ${env:central_robot1.build_flags} -DCENTRAL_ENABLE_WDT
; Watchdog de hardware (WDOG1, 1 s) en la CENTRAL. Validar: 30 min de marcha sin
; reset espurio + auto-reset al colgar el loop a propósito (WDOG1_WRSR).

[env:down_wdt]
extends = env:down
build_flags = ${env:down.build_flags} -DDOWN_ENABLE_WDT
; Watchdog de hardware en DOWN. Validar boot sin reset (otos_init + calib son lentos)
; + auto-reset al desconectar un OTOS en caliente.

[env:down_lean]
extends = env:down
build_flags = ${env:down.build_flags} -DDOWN_LEAN_LINE_PIPELINE
; Apaga el pipeline de filtros de línea muerto (solo lo leen los diags) → libera CPU
; en DOWN. Wire IDÉNTICO (LineStatusV2 sale de dm_update). NO usar en diags.

; ============================================================
; Envs agregados 2026-06-06 (cards de banco — docs/pruebas-banco/).
; Todos ADITIVOS: no cambian los envs de competencia (ROBOT1 byte-idéntico).
; ⚠️ Diags/hook Arduino: NO compilados en el gate host — verificar con `pio run -e <env>`.
; ============================================================

[env:down_robot2]
extends = env:down
build_flags = ${env:down.build_flags} -DDOWN_NUM_OTOS_CONNECTED=0
; ROBOT2 (delantero): NO tiene OTOS (no llegaron). El -D posterior PISA el =2 de
; env:down (el último -D gana en la línea de comando). otos.cpp ya guarda NUM_OTOS=0
; → odometría/pose N/A y los consumidores caen al fallback exacto (drive_straight,
; GK paralelo, cross_track). Card: docs/pruebas-banco/DOWN.md DOWN-8.

[env:diag_central_brake]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -DBOARD_CENTRAL_DIAG
    -std=gnu++17
build_unflags = -std=gnu++11
; ¿El Zircon FRENA o queda en COAST? Acelera un motor y a tu orden aplica BRAKE
; (HIGH/HIGH) vs COAST (LOW/LOW) para comparar. Sketch agnóstico (pines hardcodeados,
; igual que diag_central_motors). Card: docs/pruebas-banco/CENTRAL.md CENTRAL-5.
build_src_filter = +<diag/diag_central_brake.cpp>

[env:diag_down_cpu]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_DOWN
    -DDOWN_NUM_MUXES_CONNECTED=4
    -DDOWN_NUM_OTOS_CONNECTED=2
    -std=gnu++17
    -I src/shared
    -I src/down
build_unflags = -std=gnu++11
; Mide la tasa real de muestreo del anillo (objetivo 1 kHz) + carga por tick.
; Compila SOLO diag_down_cpu.cpp + down/ (excluye main_down.cpp) + shared/ — mismo
; patrón que diag_down. Para comparar robo de OTOS, build con OTOS=2 (este) vs cambiar
; el -D a =0. Card: docs/pruebas-banco/DOWN.md DOWN-4 / DOWN-9.
build_src_filter = +<diag/diag_down_cpu.cpp> +<down/> -<down/main_down.cpp> +<shared/>

[env:central_robot1_wdt_hangtest]
extends = env:central_robot1_wdt
build_flags = ${env:central_robot1_wdt.build_flags} -DCENTRAL_WDT_HANG_TEST
; SOLO banco: cuelga el loop a los ~5 s para validar que el WDOG1 resetea el Teensy
; a ~1 s (auto-recuperación). NUNCA a competencia. Card: docs/pruebas-banco/CENTRAL.md CENTRAL-7.

[env:down_debug_telemetry]
extends = env:down
build_flags = ${env:down.build_flags} -DDOWN_DEBUG_TELEMETRY
; Modo DEBUG/telemetria USB (JSON Lines) para la app tools/monitor-base.
; ADITIVO: NO cambia el binario de competencia (todo el codigo nuevo esta #ifdef'd).
; Verificar con: pio run -e down_debug_telemetry. NO host-compilable (Arduino).

[env:top_robot1_debug_telemetry]
extends = env:top_robot1
build_flags = ${env:top_robot1.build_flags} -DTOP_DEBUG_TELEMETRY
; FASE 2 — Modo DEBUG/telemetria USB de la TOP (camaras + IMU + ToF + WorldSnapshot
; fusionado) en JSON Lines, para la app de PC. ADITIVO: NO cambia el binario de
; competencia (todo el codigo nuevo esta #ifdef TOP_DEBUG_TELEMETRY). Verificar con:
; pio run -e top_robot1_debug_telemetry. NO host-compilable (Arduino). Contrato:
; docs/firmware/TELEMETRIA-TOP.md.
