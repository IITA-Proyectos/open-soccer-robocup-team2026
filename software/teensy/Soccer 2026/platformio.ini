; ============================================================
; diag_central_line_sweep — Barrido lateral por tiempo + freno por linea
; (placa CENTRAL, Teensy 4.1). NO es firmware de competencia.
;
; SEGUNDO paso del bring-up DOWN->CENTRAL: tras validar la recepcion con
; diag_central_comm_down, este sketch suma los MOTORES. Recibe LineStatusV2 de
; DOWN por Serial7 (RX7 = pin 28) con el protocolo real, hace un barrido lateral
; (4 s derecha / 4 s izquierda, arranca/para con boton pin 9) usando la
; cinematica inversa real, y FRENA ante salida inminente / robot levantado /
; enlace caido.
;
;   pio run -e diag_central_line_sweep_robot1 -t upload   ; arquero
;   pio run -e diag_central_line_sweep_robot2 -t upload   ; delantero
;   pio device monitor -b 115200      ; <-- 115200, NO 230400
;
; Cablear: DOWN TX1 (pin 1) -> CENTRAL RX7 (pin 28), GND comun. Baud 230400.
; Se recibe por Serial7 (no Serial2) para esquivar el conflicto pines 7/8 con
; el motor 2 (TASK-036): asi los motores usan 7/8 libremente.
;
; Flags opcionales:
;   -DSWEEP_SPEED_MM_S=200      velocidad lateral (default 250)
;   -DSWEEP_HALF_PERIOD_MS=4000 tiempo por lado en ms (default 4000)
;   -DSWEEP_REQUIRE_LINE        exige line_present para moverse (default OFF)
; ============================================================
[env:diag_central_line_sweep_robot1]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -DROBOT1
    -DBOARD_CENTRAL_DIAG
    -std=gnu++17
    -I src/shared
    -I src/central
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_central_line_sweep.cpp>
                   +<central/imu_zircon.cpp>
                   +<shared/proto.cpp>
                   +<shared/crc16.cpp>

[env:diag_central_line_sweep_robot2]
extends = env:diag_central_line_sweep_robot1
build_flags =
    -DROBOT2
    -DBOARD_CENTRAL_DIAG
    -std=gnu++17
    -I src/shared
    -I src/central

; --- Variante SIN freno de seguridad (solo para validar el movimiento en banco) ---
; Igual que line_sweep pero con -DSWEEP_NO_SAFETY: ignora SALIDA INMINENTE y
; LEVANTADO (el watchdog del enlace SIGUE activo). Sirve para ver el barrido
; completo de 4s a cada lado cuando la placa DOWN aun no esta calibrada y reporta
; salida inminente falsa. ⚠️ El robot NO se protege de salir de cancha: usar SOLO
; con ruedas al aire o espacio controlado. Reactivar la seguridad (env normal)
; cuando DOWN este calibrada.
;   pio run -e diag_central_line_sweep_nosafety_robot1 -t upload
[env:diag_central_line_sweep_nosafety_robot1]
extends = env:diag_central_line_sweep_robot1
build_flags =
    -DROBOT1
    -DBOARD_CENTRAL_DIAG
    -DSWEEP_NO_SAFETY
    -std=gnu++17
    -I src/shared
    -I src/central

[env:diag_central_line_sweep_nosafety_robot2]
