; ============================================================
; diag_top_comm_down — VERIFICA el enlace DOWN -> TOP (Serial1).
; Reusa el modulo vivo comm_down.cpp (mismo parser/contrato que produccion) y
; muestra frames/s + CRC-err + frescura de los 3 mensajes (linea + OTOS pose/vel).
; Usar tras desenchufar/reconectar cables DOWN<->TOP para confirmar el enlace.
;   pio run -e diag_top_comm_down -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_top_comm_down]
platform = teensy
board = teensy40
