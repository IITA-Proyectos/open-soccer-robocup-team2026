; PlatformIO Project Configuration File
;
; Robot IITA Soccer Open RoboCup 2026 — multi-environment
;
; - teensy41_legacy : código viejo en src/main.cpp (Teensy 4.1, robot nacional 2025)
; - top             : firmware nuevo placa TOP (Teensy 4.0, master)
; - down            : firmware nuevo placa DOWN (Teensy 4.0, slave sensores)
;
; Para compilar uno específico:
;   pio run -e top
;   pio run -e down
;   pio run -e teensy41_legacy
;
; Para subir:
;   pio run -e top -t upload
;
; Documentación: docs/coach-system/, research/in-progress/2026-05-10-diseno-firmware-3-placas.md

[platformio]
; HAL refactor 2026-05-29: el env :top "pelado" ya no compila — exige
; -DROBOT1 o -DROBOT2 explícito.
; FIX 2026-06-11 (auditoría): el default era top_robot1 = cableado VIEJO de R1
; (pre-recableado). Desde el recableado, AMBAS TOP corren top_robot2_pri — un
; `pio run -t upload` pelado no debe poder flashear el binario equivocado.
default_envs = top_robot2_pri

; ============================================================
; LEGACY — código del robot nacional 2025 (NO TOCAR)
; ============================================================
[env:teensy41_legacy]
platform = teensy
board = teensy41
framework = arduino
build_flags = -DLEGACY_ROBOT
build_src_filter = +<main.cpp>
lib_deps = adafruit/Adafruit BNO055@^1.6.4

; ============================================================
; TOP — placa nueva, Teensy 4.0, master del robot
; ============================================================
[env:top]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP
    -std=gnu++17
    -I src/shared
build_unflags = -std=gnu++11
build_src_filter = +<top/> +<shared/>
; lib_deps: Adafruit BNO055 + BusIO + Unified Sensor están VENDOREADAS en lib/
; (código fuente podado, commiteado al repo — ver lib/README.md). PlatformIO
; las detecta solas vía LDF; NO se bajan del registry. Esto desbloquea a
; quien tenga Avast/SSL roto (TASK-025). ToF: cuando llegue el hardware.

; ============================================================
; diag_top_all — TEST INTEGRAL de la TOP: muestra por USB BNO + 4 ToF + HC-SR04 +
; camaras + referee (pines 5/6 en crudo + AND/OR) en un solo panel. Reusa los modulos
; vivos del TOP (sensors_tof/imu, cameras, comm_arbiter); NO manda snapshot ni mueve nada.
; Mismos flags que top_robot1 (ROBOT1 + MULTI_TOF + HCSR04). POWER-CYCLE tras flashear.
;   pio run -e diag_top_all -t upload
;   pio device monitor -b 115200   (boot ~10-15 s por la carga de los 4 ToF)
; ============================================================
[env:diag_top_all]
extends = env:top
build_flags = ${env:top.build_flags} -I src/top -DROBOT1 -DTOP_ENABLE_MULTI_TOF -DTOP_ENABLE_HCSR04
build_src_filter = +<diag/diag_top_all.cpp> +<top/> -<top/main_top.cpp> +<shared/>

; diag_top_all_robot2 — igual que diag_top_all pero -DROBOT2 (bring-up de sensores de ROBOT2).
; Lee 4 ToF + BNO LEFT (Wire 18/19) + HC-SR04 + arbitro (pines 5/6) en un panel.
; Desde 2026-06-09 sensors_imu.cpp (rama ROBOT2) lee el BNO PRIMARIO de Wire2 (pines 24/25,
; "debajo" del Teensy — bus propio sin ToF) y el SECUNDARIO de Wire (18/19, compartido con
; los ToF): este diag muestra AMBOS (imu_L=primario, imu_R=secundario). Validado en banco.
;   pio run -e diag_top_all_robot2 -t upload   ;   pio device monitor -b 115200  (boot ~10-15 s)
[env:diag_top_all_robot2]
extends = env:top
build_flags = ${env:top.build_flags} -I src/top -DROBOT2 -DTOP_ENABLE_MULTI_TOF -DTOP_ENABLE_HCSR04
build_src_filter = +<diag/diag_top_all.cpp> +<top/> -<top/main_top.cpp> +<shared/>

; ============================================================
; diag_cam_acceptance — ACEPTACION de la vision recalibrada (TASK-022).
; Lee las 2 camaras OpenMV (Serial3 frontal / Serial5 trasera) con el parser de
; PRODUCCION (src/top/cameras.cpp, CameraParser v2) e imprime pelota
; (raw/mm/angulo/distancia) + salud del enlace. Modo aceptacion: pelota a una
; distancia MEDIDA, se escribe los cm por serial y chequea PASS/FAIL contra
; tolerancia. Codigo AISLADO en src/diag: ningun modulo vivo lo incluye ->
; regresion nula. La corrida real es de BANCO (requiere camaras recalibradas).
; Doc: docs/firmware/DIAG-CAM-ACCEPTANCE.md
;
;   pio run -e diag_cam_acceptance -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_cam_acceptance]
platform = teensy
board = teensy40
framework = arduino
build_flags = -std=gnu++17 -I src/top
build_src_filter = +<diag/diag_cam_acceptance.cpp> +<top/cameras.cpp>

; ============================================================
; DOWN — placa nueva, Teensy 4.0, slave sensores
; ============================================================
; Este env compila la PLACA DE COMPETENCIA (la fixeada): 4 muxes (32 sensores) +
; 2 OTOS, vía los -D explícitos de abajo. Los #define de config_down.h (=1/=1)
; son sólo el fallback si un env no pasa -D; este env SÍ los pasa.
[env:down]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_DOWN
    ; Placa de competencia = la fixeada: 4 muxes (32 sensores) + 2 OTOS.
    ; Validada en banco 2026-05-24 (0 sensores muertos). F2 de la auditoria 2026-05-31:
    ; sin esto el default era 1 mux = 8 de 32 sensores (3/4 del anillo ciego).
    -DDOWN_NUM_MUXES_CONNECTED=4
    -DDOWN_NUM_OTOS_CONNECTED=2
    ; MONITOR USB EN COMPETENCIA (pedido Maria 2026-06-12, TASK-306): el monitor
    ; viaja DORMIDO en el binario de partido. Enchufas USB + abris la app
    ; monitor-base -> streamea sensores y acepta calibracion EN VIVO (sin
    ; reflashear); sacas el cable -> a los 3 s vuelve solo a modo partido.
    -DDOWN_USB_MONITOR
    -std=gnu++17
    -I src/shared
build_unflags = -std=gnu++11
build_src_filter = +<down/> +<shared/>
; lib_deps: SparkFun Qwiic OTOS + su dependencia SparkFun_Toolkit están
; VENDOREADAS en lib/ (fuente podado, commiteado — ver lib/README.md).
; PlatformIO las detecta solas vía LDF; NO se bajan del registry. Vendoreadas
; 2026-05-29 (TASK-302): al activar OTOS el 2026-05-24 (TASK-012) era la única
; lib de firmware sin vendorear, y eso rompía el build offline bajo Avast
; (TASK-025 — CRYPT_E_NO_REVOCATION_CHECK al tocar el registry). Ahora [env:down]
; compila 100% offline igual que top/central.

; ============================================================
; down_debug — [env:down] + print de bring-up por USB (NO es competencia)
; Igual que el firmware real de DOWN pero con -DDOWN_DEBUG_SERIAL: imprime por el
; Serial USB, a ~4 Hz: ¿HAY LINEA? (SI/NO, line_present del DownModel) + pose de
; los 2 OTOS (x/y/hdg, L/R) + contadores tx_ok/drop hacia CENTRAL. Sirve para
; validar SIN la placa CENTRAL que DOWN detecta linea y lee los OTOS, moviendo el
; robot sobre el blanco. 4 muxes (32 sensores) + 2 OTOS = placa fixeada.
;   pio run -e down_debug -t upload
;   pio device monitor -b 115200
; ============================================================
[env:down_debug]
extends = env:down
build_flags =
    ${env:down.build_flags}
    -DDOWN_DEBUG_SERIAL
    ; (4 muxes + 2 OTOS ya vienen heredados de [env:down] desde 2026-05-31)

; ============================================================
; BANCO DOWN — reingeniería RT del lazo (gateada, off-by-default). Cada env de banco
; agrega su -D y NO toca [env:down]/[env:down_robot2] (competencia byte-idéntica).
; Diseño: docs/firmware/ARQUITECTURA-LAZO-DOWN-RT.md. Banco lo cierra el EQUIPO (regla 1).
; ============================================================
; down_loopmon — F0: supervisor de loop-time (WCET/EMA de la vuelta COMPLETA, incluye el
; spike del OTOS) + duración del barrido de línea, impreso por el debug serial a 4 Hz.
; MIDE el "ANTES" (OTOS bloqueante de 3-4 ms). Ver loop_us(max/avg) y scan_us.
;   pio run -e down_loopmon -t upload ; pio device monitor -b 115200
[env:down_loopmon]
extends = env:down_debug
build_flags = ${env:down_debug.build_flags} -DDOWN_LOOP_MONITOR

; down_otosfast — F2: OTOS Nivel 0 (Wire 400 kHz + getPosVelAcc burst de 18 B) + el
; loop-monitor para ver el DELTA del spike directo (GAP-3). Comparar loop_us(max) con este
; env vs down_loopmon: esperado ~3-4 ms → <~0.6 ms. Si 400 kHz da errores I²C, bajar reloj.
;   pio run -e down_otosfast -t upload ; pio device monitor -b 115200
[env:down_otosfast]
extends = env:down_loopmon
build_flags = ${env:down_loopmon.build_flags} -DDOWN_OTOS_FAST_I2C

; down_adcfast — F1 Capa 1: averaging=1 del ADC (barrido ~717µs → ~205µs). Con el loop-monitor
; para ver el delta del barrido (scan_us). Riesgo bajo. Banco: que averaging=1 no flickee el umbral.
;   pio run -e down_adcfast -t upload
[env:down_adcfast]
extends = env:down_loopmon
build_flags = ${env:down_loopmon.build_flags} -DDOWN_ADC_FAST

; down_adcdual — F1 Capa 2: + dual-ADC sincronizado (ADC1+ADC2 en paralelo, ~205µs → ~126µs).
; Banco: comparar el delta crudo carpet/blanco del MISMO mux por ADC1 vs ADC2 (offset por-ADC; la
; calib individual lo absorbe porque el umbral se mide con el MISMO ADC del runtime). Hereda Capa 1.
;   pio run -e down_adcdual -t upload
[env:down_adcdual]
extends = env:down_adcfast
build_flags = ${env:down_adcfast.build_flags} -DDOWN_ADC_DUAL

; down_reliable — F4: compuerta de "LECTURA CONFIABLE" + sellado fail-safe (§6.4). Con el gate y
; los defaults (pisos 0, enabled=false) ya aplica §6.4-A: SELLA escape/cross/penetration/angle a
; N/A cuando data_valid=0 aunque line_present=1 (la fuente deja de mentir). Los pisos eje-B
; (reliable_min_healthy) / eje-C (reliable_min_sensors_for_vector) se titulan en BANCO. NO sella
; line_present/sensors_on_line → el freno duro de CENTRAL (EV_IMMINENT_EXIT) sobrevive.
;   pio run -e down_reliable -t upload
[env:down_reliable]
extends = env:down_loopmon
build_flags = ${env:down_loopmon.build_flags} -DDOWN_RELIABLE_GATE

; down_rxharden — F5: RX endurecido. Calib diferido (handle_frame deja la nota en <5µs; el
; trabajo bloqueante ~320ms corre en el loop) + colchón RX 512B + presupuesto de bytes/tick.
; El tick RX nunca congela el lazo aunque llegue un 0x21 en vivo o un cable ruidoso escupa basura.
;   pio run -e down_rxharden -t upload
[env:down_rxharden]
extends = env:down_loopmon
build_flags = ${env:down_loopmon.build_flags} -DDOWN_RX_HARDEN

; down_earlyev — F3: DETECCIÓN TEMPRANA por VECINO FÍSICO. dm_update UNE a validated[] los
; blancos con un PAR físicamente adyacente (line_neighbors.h, no el vecino de índice que en
; esta placa puede estar a 14 cm) → el aviso (line_present/sensors_on_line/escape_angle) sale
; ANTES, sin esperar los 6 sensores del imminent. ESTRICTAMENTE ADITIVO (sensors_on_line nunca
; baja → el freno duro nunca llega más tarde). Con el loop-monitor para ver el costo del barrido.
; Banco: robot a velocidad conocida cruzando la línea → medir penetración_mm al aviso temprano
; vs inminente + 0 falsos positivos en marcha normal sobre carpet (TASK-309, fila F3).
;   pio run -e down_earlyev -t upload
[env:down_earlyev]
extends = env:down_loopmon
build_flags = ${env:down_loopmon.build_flags} -DDOWN_EARLY_EVIDENCE

; down_rt_all — TODAS las mejoras RT juntas (F0+F1+F2+F3+F4+F5) para verificar que coexisten y
; medir el conjunto en banco. NO es el binario de partido: ese sigue siendo [env:down] (sin
; ningún -D de banco) → byte-idéntico. F3 se cableó 2026-06-16 (gateado); F6 sigue siendo módulo
; puro (no se cablea en esta tanda — IntervalTimer/ISR de línea es post-Incheon).
[env:down_rt_all]
extends = env:down_loopmon
build_flags = ${env:down_loopmon.build_flags}
    -DDOWN_ADC_FAST -DDOWN_ADC_DUAL -DDOWN_OTOS_FAST_I2C -DDOWN_EARLY_EVIDENCE -DDOWN_RELIABLE_GATE -DDOWN_RX_HARDEN

; ============================================================
; CENTRAL ROBOT 1 (arquero) — master sobre Zircon Rev v15
; Teensy 4.1. Recibe WORLD_SNAPSHOT de ARRIBA (Serial7, pin 28) y LINE_URGENT
; de ABAJO (Serial1, pin 0). Corre FSM + PIDs + cinemática inversa.
;
; TÉCNICAS DE MOTION LATERAL — ACTIVAS EN PRODUCCIÓN (decisión Gustavo 2026-06-09:
; se usan SIEMPRE que el robot se mueva lateralmente; validadas banco robot2
; diag_central_strafe_robot2_kick). ⚠️ CAMBIAN EL BINARIO vs builds previos.
;  -DCENTRAL_MOTOR_KICKSTART  = impulso inicial FIJO por rueda {130,130,140} PWM x 40 ms
;     en la transición parado→comando de CADA rueda (motors_zircon.cpp + shared/
;     motor_kickstart.cpp — entra por +<shared/>, el filtro no necesita cambios).
;  -DCENTRAL_REAR_BRAKE_LEAD  = compila motors_set_rear_cut() (freno anticipado de la
;     trasera: corta la M3 ~66 ms antes del fin del tramo). ⚠️ En el firmware de
;     producción NADIE la llama todavía: la FSM (strategy.cpp) es control continuo y
;     no tiene el evento "acá TERMINA el movimiento" que el corte necesita → queda
;     no-op (g_rear_cut=false). Cablearla a la FSM = tema-a-analizar (glue futuro).
;     HOY el corte solo está cableado en diag_central_strafe / diag_central_arbitro_strafe.
;  ⚠️ R1: técnicas de motion lateral ACTIVAS (valores de robot2) — A VERIFICAR EN BANCO R1.
;     (El piso por rueda {70,70,107} de R1 también parte de robot2 — ver config_central.h:
;      si R1 rota en el strafe con 107, bajar la trasera gradualmente.)
; ============================================================
[env:central_robot1]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -DROBOT1
    -DCENTRAL_MOTOR_KICKSTART
    -DCENTRAL_REAR_BRAKE_LEAD
    -DCENTRAL_FLOOR_SCALE
    -DCENTRAL_TOP_RX_BIGBUF
    -std=gnu++17
    -I src/shared
; 2026-06-17 (auditoría robustez, #3): AGREGADO -DCENTRAL_TOP_RX_BIGBUF (R2 ya lo tenía). El
; arquero R1 es el que más retiene el loop (freno de borde) → con el ring RX de 64 B se
; descartaban snapshots del TOP en silencio bajo jitter ("arquero se congela a tirones"). Sube
; el ring de Serial7 a 512 B (~13 frames de colchón). Fail-safe puro (no cambia lógica). NOTA:
; el TOP de R1 ya corre top_robot2_pri (todos los flags RT: async US, snapshot timer, sched),
; así que el subconjunto seguro de R1 se reduce a este flag de CENTRAL.
; 2026-06-17 (P0.2): AGREGADO -DCENTRAL_FLOOR_SCALE. ROBOT1 corre el ARQUERO
; (apply_role_from_dipswitch → GOALKEEPER por -DROBOT1). El arquero v3.3 se DESARROLLÓ y
; VALIDÓ con FLOOR_SCALE (escalado uniforme + eff por rueda en motor_floor_scale.h); SIN
; el flag, el arquero corre el clamp por-rueda viejo que se come las correcciones de gyro
; → "pierde el frente" (síntoma diagnosticado 2026-06-09). Este env (el de competencia de
; R1) estaba SIN el flag = estado NO validado. Es una CORRECCIÓN hacia lo validado, no una
; feature nueva. ⚠️ BANCO R1 pendiente: los pisos {70,70,107} de R1 están "a verificar"
; (config_central.h) — confirmar en banco que el arquero R1 mantiene el frente con gyro.
build_unflags = -std=gnu++11
build_src_filter = +<central/> +<shared/>
; 2026-06-17 (A2, quick-win RT): QUITADO -DCENTRAL_DEBUG_SERIAL (espejo de lo que ya se hizo
; en central_robot2 el 2026-06-16). El bloque de ~30 Serial.print cada 500 ms en el loop de
; motores SE FUE → cero pico de jitter periódico por USB CDC. Ataca la "oscilación por latencia"
; del banco del domingo. La salud por USB sigue disponible vía el monitor DORMIDO
; (-DCENTRAL_USB_MONITOR, en los envs *_bb). ⚠️ BANCO R1: confirmar loop_us(max) más parejo.
; lib_deps: Adafruit BNO055 + BusIO + Unified Sensor VENDOREADAS en lib/
; (ver lib/README.md). PlatformIO las detecta solas; NO toca el registry.

; --- central_robot1_slow: MISMO arquero pero al ~40% de velocidad (BANCO/OBSERVACION) ---
; SLOW-MO para ver la conducta del arquero sin que sea brusco (CENTRAL_SLOW_MOTION escala vx/vy/omega
; en motors_zircon.cpp). MISMA logica que central_robot1, solo mas lento. ⚠️ NO ES DE COMPETENCIA:
; para competir, flashear `central_robot1` (sin el flag). Tunear el 0.4 en motors_zircon si hace falta.
; Tecnicas de motion lateral (KICKSTART + REAR_BRAKE_LEAD) HEREDADAS de central_robot1 via
; ${env:central_robot1.build_flags} — A VERIFICAR EN BANCO R1. OJO: el impulso fijo {130,130,140}
; NO se escala por CENTRAL_SLOW_MOTION (actua post-piso, sobre el PWM final) → el arranque pega igual.
;   pio run -e central_robot1_slow -t upload
[env:central_robot1_slow]
extends = env:central_robot1
; 2026-06-17: -DCENTRAL_USB_MONITOR para ver datos en la app del monitor (banco/práctica).
build_flags = ${env:central_robot1.build_flags} -DCENTRAL_SLOW_MOTION -DCENTRAL_USB_MONITOR

; ============================================================
; ENVS DE DEMO 2026-06-11 (cancha, demostración importante)
; Plan completo: docs/pruebas-banco/DEMO-2026-06-11-PLAN.md
; ============================================================
; central_robot1_arquero_demo — ARQUERO en ROBOT1 (rol default de R1) con el stack
; de motion CON el que se desarrolló y validó la patrulla v3.3 en robot2:
;  -DCENTRAL_FLOOR_SCALE: sin esto el arquero corre el clamp por-rueda viejo y
;     ω máx 10°/s → repite los síntomas diagnosticados el 2026-06-09 (revisión
;     2026-06-10, hallazgo P-2). ⚠️ Los pisos/eff de R1 están A VERIFICAR → correr
;     los pasos 1-2 de TASK-042 en el banco de la mañana ANTES de la demo.
;  -DCENTRAL_ENABLE_MANUAL_START: juez desde la PC ('g'=GO 's'=STOP) de respaldo.
; 🔧 ACTUALIZADO 2026-06-11: en la reparación el M2 de R1 quedó RECABLEADO DERECHO →
;    MOTOR_INVERT={+1,+1,+1} en AMBOS robots (validado piso, 8d5fc90). Cada robot
;    igual va con SU env central_robotN (roles/configs por-robot).
[env:central_robot1_arquero_demo]
extends = env:central_robot1
; 2026-06-17: -DCENTRAL_USB_MONITOR (los hijos _patrol/_demo_bb lo heredan; _demo_bb ya lo
; tenía explícito, redundancia inocua).
build_flags = ${env:central_robot1.build_flags} -DCENTRAL_FLOOR_SCALE -DCENTRAL_ENABLE_MANUAL_START -DCENTRAL_USB_MONITOR

; central_robot1_arquero_demo_patrol — ídem pero IGNORANDO la pelota (fallback de
; demo: si INTERCEPT/CLEAR no quedan confiables en el banco de la mañana, esta
; variante hace la secuencia completa retroceso+patrulla pegada a la línea, que
; YA está validada — demo digna sin riesgo de que un naranja falso lo vuelva loco).
[env:central_robot1_arquero_demo_patrol]
extends = env:central_robot1
; 2026-06-17: -DCENTRAL_USB_MONITOR para ver datos en la app del monitor.
build_flags = ${env:central_robot1.build_flags} -DCENTRAL_FLOOR_SCALE -DCENTRAL_ENABLE_MANUAL_START -DGK_IGNORE_BALL -DCENTRAL_USB_MONITOR

; top_robot1_oscint — REANIMACIÓN del BNO-L de robot1 (banco 2026-06-10 noche).
; HIPÓTESIS REFUTADA (2026-06-21): se sospechó cristal externo de 32 kHz dañado por un
; golpe (falla clásica del BNO055) y este env arranca el BNO con el OSCILADOR INTERNO
; (-DTOP_BNO_INTERNAL_OSC) para descartarlo. NO era el cristal: el "heading=0.0" del
; primario era el flag bno_left_en=0 en EEPROM (fix en sensors_imu.cpp). El primario
; quedó SANO y trackea con los ToF rangeando (banco 2026-06-21). Env conservado solo
; como recurso por si apareciera una falla de cristal REAL. Ver journal 2026-06-21.
;   pio run -e top_robot1_oscint -t upload   ;   pio device monitor -b 115200
[env:top_robot1_oscint]
extends = env:top_robot1
build_flags = ${env:top_robot1.build_flags} -DTOP_BNO_INTERNAL_OSC

; top_robot2_pri — PRIMARIO-SOLO para la DEMO (banco 2026-06-11): en R1 recableado,
; el BNO SECUNDARIO (Wire, comparte con ToFs) se congeló en producción y el
; soft-resync de la fusión arrastró al primario sano hacia el valor muerto
; (hdg 0.0 → -142.4 clavado). Este env corre SOLO el primario de Wire2 (bus
; propio, nunca se congeló). Vale para la TOP de R1 recableada Y para la de R2
; (misma vulnerabilidad latente). Sin redundancia — para la demo alcanza y sobra.
;   pio run -e top_robot2_pri -t upload
; ============================================================================
; ⭐ FAMILIA top_robot2_pri — FIRMWARE DE COMPETENCIA del TOP (telemetría DORMIDA)
; ============================================================================
; REGLA (Gustavo 2026-06-16): al TOP se sube SIEMPRE el firmware de COMPETENCIA
; (cerebro sensorial + control), con el monitor USB viajando DORMIDO. NINGÚN env de
; abajo es "solo telemetría": todos corren el robot completo y el monitor SOLO
; despierta con USB + app (STREAM ON/PING) o ENTER. En partido (sin USB) jamás
; despierta → match-safe. El flag TOP_USB_MONITOR nace acá y lo HEREDAN todos.
;
;   • top_robot2_pri            ← ⭐ FLASH DE COMPETENCIA = FIRMWARE COMPLETO Y RÁPIDO (todas
;                                  las mejoras RT: emisor ISR @100Hz + seqlock endurecido +
;                                  frescura por-sensor + BNO@100Hz + HC-SR04 no-bloqueante +
;                                  round-robin skip + centinela + freeze-detector). ⚠️ se valida
;                                  USÁNDOLO en banco (T1-T7 + freeze-detector sin falso-positivo).
;   • top_robot2_pri_anterior   ← ⛑ FALLBACK: el stock anterior (primario-solo, SIN RT). Flashear
;                                  si el completo se porta mal. Byte-idéntico al viejo top_robot2_pri.
;   • top_robot2_pri_rt         ← ALIAS de top_robot2_pri (idéntico; queda por compat de refs).
;   • top_robot2_pri_fastbno / _snaptimer ← redundantes ahora (sus flags ya están en _pri); banco.
;   • top_robot2_pri_posefusion ← BANCO: + estimador de pose (experimental, cambia x/y).
;   • top_robot2_pri_xval       ← BANCO: + cross-validación del heading (experimental).
;
; ⚠️ _posefusion y _xval encienden features EXPERIMENTALES extra (pose_fusion / xval): NO se
;    flashean para un partido. Para competir = top_robot2_pri (el completo). El monitor viaja
;    DORMIDO en todos → no existe un build "telemetría-sola".
; ⚠️ El camino RT (ISR/IntervalTimer + freeze-detector) NO está validado en HARDWARE. Al ponerlo
;    de default (decisión Gustavo 2026-06-16) la validación es POR USO en banco; el ESCAPE ante
;    cualquier mal comportamiento es top_robot2_pri_anterior. Ver journal 2026-06-16.
; ============================================================================
[env:top_robot2_pri]
extends = env:top_robot2
; MONITOR USB EN COMPETENCIA (espejo de DOWN/TASK-306, pedido Gustavo 2026-06-13,
; TASK-205): el monitor de sensores+calibracion viaja DORMIDO en el binario de
; partido. Enchufas USB + abris la app de monitoreo -> streamea camaras/IMU/ToF/
; WorldSnapshot y acepta IMU ZERO/SAVE EN VIVO (sin reflashear). En un monitor
; serie crudo, un ENTER imprime un bloque de texto legible por 3 s. Sin app ni
; ENTER = SILENCIO (en partido no hay USB -> nunca despierta, match-safe). El
; codigo nuevo vive en src/top/top_telemetry_serial.cpp + src/shared/telemetry_top.
; ⚠️ CAMBIA EL BINARIO DE COMPETENCIA (ya no es byte-identico) -> validar en banco.
; ⭐ ACTUALIZADO 2026-06-16 (Gustavo): top_robot2_pri ES AHORA EL FIRMWARE COMPLETO Y RÁPIDO
; del TOP — trae TODAS las mejoras RT (emisor @100Hz desacoplado + seqlock endurecido +
; frescura por-sensor + BNO@100Hz + HC-SR04 no-bloqueante + round-robin skip + centinela del
; 2º BNO + freeze-detector). Lo que ANTES era top_robot2_pri (stock primario-solo) quedó como
; top_robot2_pri_anterior (fallback "por las dudas"). default_envs = top_robot2_pri → este es
; el que se flashea. ⚠️ El camino RT NO está validado en HARDWARE: se valida USÁNDOLO en banco
; (plan T1-T7 + el chequeo make-or-break del freeze-detector: robot quieto 3-5 min sin
; falso-CONGELADO). Si algo se porta mal en cancha, el ESCAPE es flashear top_robot2_pri_anterior.
; ⭐ 2026-06-22 (Gustavo): +bus I2C de los ToF a 400 kHz por DEFAULT (-DTOP_TOF_FAST_BUS). Sube a 400
; SOLO durante el getRangingData() y restaura 100 (BNO-safe); ver sensors_tof.cpp. R1 también lo trae
; (top_robot1_pri): ambos tienen el primario en Wire2 + centinela @1 Hz. ✅ VALIDADO en HARDWARE 2026-06-22 (R1+R2 andan)
; (docs/firmware/TOF-BUS-400KHZ-PLAN-PRUEBAS.md). Rollback a 100 kHz = flashear top_robot2_pri_slowbus.
build_flags = ${env:top_robot2.build_flags} -DTOP_BNO_PRIMARY_ONLY -DTOP_USB_MONITOR -DTOP_ENABLE_SNAPSHOT_TIMER -DTOP_BNO_FAST -DTOP_ENABLE_HCSR04_ASYNC -DTOP_ENABLE_TOF_SCHED -DTOP_ENABLE_BNO_SENTINEL -DTOP_ENABLE_BNO_FREEZE_DETECT -DTOP_TOF_FAST_BUS

; top_robot2_pri_tofrot — BANCO (A2.2, rotacion de ToF firmware-dueno): el firmware aplica la
; rotacion/flip por-ToF (de EEPROM, comandos TOF n ROT/FLIP) a la mascara de zonas, via
; -DTOP_ENABLE_TOF_ROT (tof_zone_mask_orient.h). ⚠️ Para USARLO la app debe mandar la mascara en
; marco CANONICO (dejar de plegar la rotacion) -> coordinar app+firmware en el mismo banco; si no,
; doble rotacion (el veto cae en zonas opuestas). Con el flag APAGADO (top_robot2_pri / competencia)
; el binario es BYTE-IDENTICO y la app sigue plegando como hoy. Vale para R1 y R2 (la rotacion es
; per-placa, vive en la EEPROM de cada Teensy). Validar en banco que el veto cae en la zona correcta.
;   pio run -e top_robot2_pri_tofrot -t upload
[env:top_robot2_pri_tofrot]
extends = env:top_robot2_pri
build_flags = ${env:top_robot2_pri.build_flags} -DTOP_ENABLE_TOF_ROT

; top_robot2_pri_slowbus — ROLLBACK / A-B del bus de ToF: vuelve a 100 kHz (el default de competencia
; ahora es 400 — ver top_robot2_pri). -DTOP_TOF_BUS_SLOW desactiva el tramo rápido SIN tocar el resto
; de flags, así comparás loop rate 100 vs 400 (prueba T5) o volvés a lo seguro si a 400 hay timeouts/
; caídas de ToF. Es la MISMA build de competencia salvo el bus → A/B limpio (a diferencia de
; top_robot2_pri_anterior, que es el stock viejo y difiere en muchos flags).
;   pio run -e top_robot2_pri_slowbus -t upload
[env:top_robot2_pri_slowbus]
extends = env:top_robot2_pri
build_flags = ${env:top_robot2_pri.build_flags} -DTOP_TOF_BUS_SLOW

; top_robot2_pri_tofrobust — BANCO (A2.2, reduccion ROBUSTA de zonas): en vez de promediar todas
; las zonas vetadas, descarta los rayos > dimension de cancha (oblicuos/sin retorno/ven afuera) y
; los outliers bajos (rebote en otro robot, dan corto). Independiente de la rotacion: NO necesita
; tocar la app (anda con el veto actual). Umbrales: TOF_ROBUST_FIELD_MAX_MM=2430,
; TOF_ROBUST_LOW_KEEP_PCT=70 (overrideables por -D). Con el flag apagado (competencia) =
; byte-identico (usa masked_mean). Combinable con -DTOP_ENABLE_TOF_ROT.
;   pio run -e top_robot2_pri_tofrobust -t upload
[env:top_robot2_pri_tofrobust]
extends = env:top_robot2_pri
build_flags = ${env:top_robot2_pri.build_flags} -DTOP_ENABLE_TOF_ROBUST

; top_robot2_pri_zonas — TOP de COMPETENCIA COMPLETO + procesamiento de zonas de ToF: el firmware
; de partido (todas las mejoras RT de top_robot2_pri) MAS los dos flags de zonas:
;   -DTOP_ENABLE_TOF_ROBUST : reductor robusto (descarta rayos > cancha y outliers bajos = rebote
;       en robot). ANDA SOLO, sin tocar la app ni calibrar.
;   -DTOP_ENABLE_TOF_ROT    : el firmware aplica la rotacion/flip de zonas desde EEPROM. Para usar
;       el VETEO con este flag hay que (a) la app en FIRMWARE_OWNS_ROTATION=True y (b) re-calibrar
;       (o CFG RESET si habia un veto viejo plegado, si no DOBLE rotacion). Sin veto seteado, no
;       molesta (rot 0 / mask all-on = no-op) y el robusto igual filtra.
; Vale para la TOP de R1 y R2 (la config de zonas es per-placa, vive en la EEPROM de cada Teensy).
; El ARQUERO es de la CENTRAL (central_robot2_arquero), NO de aca. ⚠️ NO validado en banco (regla 1).
;   pio run -e top_robot2_pri_zonas -t upload
[env:top_robot2_pri_zonas]
extends = env:top_robot2_pri
build_flags = ${env:top_robot2_pri.build_flags} -DTOP_ENABLE_TOF_ROBUST -DTOP_ENABLE_TOF_ROT

; top_robot2_pri_anterior — ⛑ FALLBACK: el firmware ANTERIOR (stock primario-solo, SIN las
; mejoras RT). "Por las dudas": si el firmware completo se porta mal en banco/cancha, flashear
; ESTE (es el que venía corriendo, probado en la demo). Monitor dormido igual; byte-idéntico al
; viejo top_robot2_pri. El enmascarado de zonas (A2.2, ungated) SÍ sigue acá (no-op por default).
;   pio run -e top_robot2_pri_anterior -t upload
[env:top_robot2_pri_anterior]
extends = env:top_robot2
build_flags = ${env:top_robot2.build_flags} -DTOP_BNO_PRIMARY_ONLY -DTOP_USB_MONITOR

; top_robot2_pri_fastbno — FAST-BNO (coach 2026-06-14, P0 de latencia): lee el BNO
; PRIMARIO aislado (Wire2 24/25, sin ToF) a 100 Hz en vez de 20 → baja el atraso del
; rumbo de ~35-70 ms a ~15-30 ms (la MITAD). Ese atraso es lo que alimenta el lazo de
; rumbo del arquero y causa la "medialuna" del strafe. Seguro porque _pri ya apaga el
; secundario del bus compartido (un #error en sensors_imu.cpp lo exige). ⚠️ CAMBIA EL
; BINARIO → validar en banco: que el loop del TOP siga holgado y el rumbo trackee el
; giro sin congelarse. Doc: docs/firmware/CONTROL-ARQUERO-LATERAL-Y-LATENCIAS.md (P0).
;   pio run -e top_robot2_pri_fastbno -t upload
[env:top_robot2_pri_fastbno]
extends = env:top_robot2_pri
build_flags = ${env:top_robot2_pri.build_flags} -DTOP_BNO_FAST

; top_robot2_pri_hpredict — BANCO (coach 2026-06-17, pedido Gustavo): PREDICCIÓN DE
; RUMBO por extrapolación lineal (predict step). En vez de transmitir a la CENTRAL el
; último heading "quieto", transmite heading_crudo + ω·Δt (ω MEDIDA por el gyro, Δt =
; edad del fusionado), con CAP de horizonte (max_extrap_ms ~60 ms ≪ SNAPSHOT_TIMEOUT_MS
; =500) + deadband + re-anclaje en cada muestra fresca. Descuenta la latencia/staleness
; entre muestras del BNO; NO crea info nueva (no reemplaza subir el sensado). Módulo PURO
; src/shared/heading_predict.h (host-tested: test_heading_predict 14/14). El heading CRUDO
; sigue intacto para el detector de freeze y localization (necesitan igualdad exacta);
; solo cambia el heading TRANSMITIDO. GATEADO -DTOP_ENABLE_HEADING_PREDICT: con el flag OFF
; (competencia, top_robot2_pri) el binario es BYTE-IDÉNTICO (los #else son las líneas de
; hoy). ⚠️ NO VALIDADO EN HARDWARE → banco TASK-218: A/B de la "medialuna" del strafe del
; arquero midiendo período/amplitud de oscilación; girar 360° y ver el rumbo más fresco sin
; overshoot; titrar max_extrap_ms/deadband. Sinergia anti-freeze: si el heading se congela
; pero el gyro vive, puentea el rumbo hasta el cap (si además está BNO_FREEZE_DETECT, el
; detector baja heading_valid → degrada a hold). Escape: flashear top_robot2_pri.
; Doc: research/completed/2026-06-17-extrapolacion-predict-step.md.
;   pio run -e top_robot2_pri_hpredict -t upload
[env:top_robot2_pri_hpredict]
extends = env:top_robot2_pri
build_flags = ${env:top_robot2_pri.build_flags} -DTOP_ENABLE_HEADING_PREDICT

; top_robot2_arquero_xywalls — BANCO (coach 2026-06-19): pose XY HEADING-FREE del
; ARQUERO por paredes (ToF izq/der/atrás), SIN BNO. Reemplaza my_x/my_y del WorldSnapshot
; con keeper_xy_from_walls() (src/shared/keeper_xy_walls.h; reducción por mediana+recorte
; simétrico que descarta piso y "por encima de la pared"; host-test test_keeper_xy_walls 12/12
; contra capturas reales de banco). Útil en la ZONA DE FONDO. La X usa la pared CERCANA +
; consistencia izq/der; centrado/ambiguo -> X al centro (no dispara el X-bound). La conf la
; maneja la Y (profundidad). SUMA hpredict: el heading-hold de la CENTRAL sigue usando el BNO.
; Default OFF: sin el flag (top_robot2_pri / competencia) el binario es BYTE-IDÉNTICO.
; ⚠️ NO validado en HW -> banco (TASK del equipo): 5 posiciones marcadas vs metro (±5 cm con
; paredes cercanas), oclusión (tapar pared -> no salta), rotación (rotar -> X/Y se congela).
; La CONGELACIÓN durante el escape la decide la CENTRAL (sabe el estado del arquero).
; Escape: reflashear top_robot2_pri.
;   pio run -e top_robot2_arquero_xywalls -t upload
[env:top_robot2_arquero_xywalls]
extends = env:top_robot2_pri_hpredict
build_flags = ${env:top_robot2_pri_hpredict.build_flags} -DTOP_KEEPER_XY_WALLS

; top_robot2_pri_tofcont — BANCO (coach 2026-06-18): los 4 ToF en modo CONTINUO en vez del
; AUTONOMO por defecto. Segun el manual ST (UM3038) el modo continuo achica el bloque de
; resultados por lectura I2C -> cada getRangingData() ocupa menos el bus -> menos jitter del
; loop del TOP. El porton de "leer solo si hay dato" (isDataReady) YA estaba; esto suma el modo.
; Se activa con -DTOP_ENABLE_TOF_CONTINUOUS; apagado (competencia, top_robot2_pri) = modo autonomo
; de hoy, sin cambio. ⚠️ NO validado en HW -> banco TASK-219: medir Hz/cara real (objetivo ~8->12)
; + integridad de las 16 zonas + loop_us del TOP, A/B con la bandera. Escape: grabar top_robot2_pri.
;   pio run -e top_robot2_pri_tofcont -t upload
[env:top_robot2_pri_tofcont]
extends = env:top_robot2_pri
build_flags = ${env:top_robot2_pri.build_flags} -DTOP_ENABLE_TOF_CONTINUOUS

; top_robot2_pri_sticky — OPCIONAL práctica 2026-06-12: fusión de pelota "CÁMARA
; PEGAJOSA" (-DTOP_CAM_STICKY, ball_sticky.h). Reemplaza el PROMEDIO del caso
; "ambas cámaras ven pelota" (imposible para una pelota física: FOVs opuestos →
; siempre es un falso naranja; el promedio inventa una pelota fantasma en el
; medio) por: la cámara TITULAR manda (memoria de qué lado la veíamos); sin
; titular, la más cercana; confianza 60 en conflicto (panel: ball=(x,y)c60).
; Sirve para la TOP de AMBOS robots (las dos corren top_robot2_pri). Volver
; atrás = reflashear top_robot2_pri. Protocolo de prueba:
; docs/pruebas-banco/PRACTICA-2026-06-12-OPCIONAL-CAMARA-PEGAJOSA.md
[env:top_robot2_pri_sticky]
extends = env:top_robot2_pri
build_flags = ${env:top_robot2_pri.build_flags} -DTOP_CAM_STICKY

; top_robot2_pri_snaptimer — BANCO: emisor del WorldSnapshot DESACOPLADO por IntervalTimer
; @100Hz (no-bloqueante). El loop publica los reads a la pizarra (sensor_slot.h); la ISR del
; timer arma el snapshot desde la pizarra con FAIL-SAFE por frescura (slot viejo -> sentinela)
; y lo manda. Desacopla el envio del jitter de los reads (un ToF/pulseIn lento NO atrasa el
; snapshot). Se activa con -DTOP_ENABLE_SNAPSHOT_TIMER. ⚠️ ACLARACION 2026-06-18 (resuelve una
; CONTRADICCION del comentario anterior): este flag SI VIAJA en el binario de competencia
; (top_robot2_pri lo incluye desde la decision de Gustavo del 2026-06-16: el camino RT se valida
; USANDOLO en banco). Por eso NO era cierto que "competencia = flag apagado": el binario SIN el
; temporizador (emit dentro del loop, identico al historico) es top_robot2_pri_anterior, el de
; respaldo. Este entorno _snaptimer existe para probar SOLO esta funcion aislada. El riesgo real
; sigue en pie: la ISR/IntervalTimer + la reentrancia de Serial4 + el orden volatile/__DMB() de la
; pizarra NO se pueden probar host -> se cierra en banco (T1-T7 de
; docs/firmware/ARQUITECTURA-SENSORIAL-TOP-NO-BLOQUEANTE.md). Si el TOP se porta mal en cancha, el
; ESCAPE inmediato es grabar top_robot2_pri_anterior (sin el temporizador). La frescura POR-SENSOR
; (FASE 2) ya esta cableada (2026-06-16): un sensor congelado-pero-vivo envejece su slot.
;   pio run -e top_robot2_pri_snaptimer -t upload
[env:top_robot2_pri_snaptimer]
extends = env:top_robot2_pri
build_flags = ${env:top_robot2_pri.build_flags} -DTOP_ENABLE_SNAPSHOT_TIMER

; top_robot2_pri_rt — ⭐ ENV "RT" PARAGUAS: agrupa las mejoras de la arquitectura sensorial
; no-bloqueante YA cableadas. BANCO, NO PARTIDO. Es el candidato a PROMOVER a default de
; competencia DESPUES de validar en banco (T1-T7). Prende:
;   -DTOP_ENABLE_SNAPSHOT_TIMER : emisor @100Hz desacoplado por IntervalTimer (seqlock
;     endurecido volatile+__DMB+reader acotado) + FRESCURA POR-SENSOR (read_stamp) -> jitter
;     de emision eliminado + heading-congelado detectado.
;   -DTOP_BNO_FAST : BNO primario @100Hz (10ms) en vez de 20Hz (50ms) -> baja la LATENCIA del
;     rumbo de ~35-70ms a ~15-30ms (la causa #1 de la oscilacion del control por giroscopo).
;     Seguro: top_robot2_pri ya trae -DTOP_BNO_PRIMARY_ONLY (primario aislado en Wire2), que es
;     lo que el #error de sensors_imu.cpp exige para el fast.
;   -DTOP_ENABLE_HCSR04_ASYNC : HC-SR04 por FSM + ISR de ECHO (sin pulseIn) -> elimina el
;     spike de ~12 ms del loop (fuente de jitter del uplink). Race loop<->ISR cerrada con
;     noInterrupts() (la FSM NO es volatile; la SC serializa la ISR de ECHO y es barrera).
;   -DTOP_ENABLE_TOF_SCHED : round-robin de ToF que SALTEA el caido (byte-equivalente con los
;     4 ToF vivos; solo cambia el caso degradado). bno_read_sm NO se prende: la cadencia real
;     del rumbo ya la da TOP_BNO_FAST (el scheduler seria polish, no acelera).
;   -DTOP_ENABLE_BNO_SENTINEL : CENTINELA de salud del 2º BNO (Wire) @1Hz para el monitor PC
;     (imu_sentinel_ok/deg). SALUD PURA, SIN XVAL: NO alimenta la fusion ni el heading (sigue
;     primary-only, g_ready[1]=false) -> un secundario congelado NO puede arrastrar al primario.
;     Read aislado en la ventana bus-quiet (>=TOP_BNO_TOF_GAP_MS desde el ToF). NO toca el
;     contrato con CENTRAL (es stream USB, no el WorldSnapshot). ⚠️ banco: confirmar con
;     analizador logico que el read del secundario queda solo en Wire (<10ms, sin perturbar ToF).
;   -DTOP_ENABLE_BNO_FREEZE_DETECT : detector de BNO CONGELADO del PRIMARIO (imu_freeze.h). Se
;     auto-chequea contra el giroscopo (si el heading queda clavado mientras el gyro dice que
;     gira -> congelado). Al detectarlo baja present->false -> heading_valid=0 -> CENTRAL deja de
;     confiar en el rumbo (recuperacion SEGURA = marcar invalido, NO un reset que apaga el rumbo).
;     Standalone (NO requiere pose_fusion/xval; el #error es pose_fusion->freeze, no al reves).
;     Contract-preserving (heading_valid ya viaja en el snapshot). ⚠️ banco CRITICO: tunear para
;     que NO de falso-CONGELADO con el robot quieto/lento (tiene guarda por giro; validar umbral),
;     porque un falso-positivo deja a CENTRAL sin navegar por rumbo.
; ⚠️ FALLBACK BYTE-IDENTICO: top_robot2_pri (sin estos flags) sigue siendo el flash de
;    competencia y NO cambia hasta que el equipo valide y promueva este env.
;   pio run -e top_robot2_pri_rt -t upload   |   pio device monitor -b 115200 -p COM17
[env:top_robot2_pri_rt]
extends = env:top_robot2_pri
; NOTA 2026-06-16: top_robot2_pri YA trae todas estas mejoras (es el firmware de competencia
; completo). Este env queda como ALIAS (idéntico a top_robot2_pri) para no romper referencias
; en docs/comandos previos. Para flashear competencia usá top_robot2_pri.
build_flags = ${env:top_robot2_pri.build_flags}

; top_robot2_pri_posefusion — BANCO post-Incheon (B3 RT 2026-06-15): estimador de pose
; fusionada en build_snapshot (-DTOP_ENABLE_POSE_FUSION = pose_fusion complementario
; ToF+OTOS + pose_filter). PRE-REQUISITO DURO: el HEADING es la raíz → la fusión NO
; compila sin el detector de BNO congelado (-DTOP_ENABLE_BNO_FREEZE_DETECT); por eso este
; env enciende AMBOS (un #error en main_top.cpp lo exige). Sobre _fastbno: el rumbo de
; baja latencia es justo lo que la corrección de pose necesita. SEGURO POR DISEÑO: hasta
; que el ToF ancle (hoy casi nunca: sólo eje Y), la fusión NO inicializa → build_snapshot
; cae al comportamiento de localization de hoy. ⚠️ CAMBIA EL BINARIO → validar en banco
; (medir ruido de sensores + signo/eje del delta OTOS ANTES de confiar en x/y). Doc:
; docs/firmware/ESTIMACION-FUSION-TOP.md. top_robot1/2 quedan byte-idénticos (no heredan).
;   pio run -e top_robot2_pri_posefusion -t upload
[env:top_robot2_pri_posefusion]
extends = env:top_robot2_pri_fastbno
build_flags = ${env:top_robot2_pri_fastbno.build_flags} -DTOP_ENABLE_BNO_FREEZE_DETECT -DTOP_ENABLE_POSE_FUSION

; top_robot2_pri_xval — BANCO post-Incheon (TASK-213): cross-validación de salud del heading
; (centinela dual-BNO @1Hz + OTOS + cámara). Extiende _posefusion (NO _fastbno) para HEREDAR
; TOP_ENABLE_BNO_FREEZE_DETECT → así inc1_frozen refleja g_freeze[0] real y el veredicto
; CONGELADO funciona. Agrega el centinela (init del 2º BNO + read @1Hz con ToF-pausa) y el
; cross-validador (feed primario/cámara/OTOS + veredicto a telemetría). ⚠️ CAMBIA EL BINARIO
; → validar en banco: (1) analizador lógico en Wire durante la ventana 1Hz (read secundario
; <10ms, aislado); (2) medir el piso de ruido del omega → fijar tol_base/consensus_k; (3)
; robot quieto 3-5min → el sano NUNCA da MALO. top_robot1/2/pri quedan byte-idénticos (no heredan).
;   pio run -e top_robot2_pri_xval -t upload
[env:top_robot2_pri_xval]
extends = env:top_robot2_pri_posefusion
build_flags = ${env:top_robot2_pri_posefusion.build_flags} -DTOP_ENABLE_BNO_SENTINEL -DTOP_ENABLE_HEADING_XVAL

; ============================================================================
; ROBOT1 — MISMO PROGRAMA que R2 (unificación 2026-06-15 + bendecido por Gustavo 2026-06-16)
; ============================================================================
; R1 quedó ARQUITECTÓNICAMENTE IDÉNTICO a R2 (2 BNO @ 0x28 en buses separados, primario en
; Wire2). Estos envs son el ESPEJO de la familia top_robot2_pri_* pero con -DROBOT1, y SIN
; -DTOP_BNO_TOF_DECONFLICT (obsoleto: era para el primario en el bus compartido; ahora el
; primario vive en Wire2, sin contención) → R1 toma el MISMO path del centinela que R2.
; BOOT-CHECK DE R1 — ✅ CONFIRMADO EN BANCO 2026-06-21: con top_robot1_pri_rt (ToF rangeando)
;    el heading del primario SIGUE EL GIRO (reposo -15.6 → girado 101.4). La causa del
;    "heading=0.0" anterior NO era HW: era el flag bno_left_en=0 en EEPROM (BNO_L_OFF de una
;    sesión vieja) → la fusión lo marcaba DEAD → fix en sensors_imu.cpp (fuerza enabled).
; 2026-06-17 (Gustavo): R1 RECONECTÓ los 2 BNO (HW). El "BNO desconectados el 2026-06-16"
;    quedó SUPERADO. El cierre formal de TASK-216 lo hace el equipo. Ver journal 2026-06-21.
;   • top_robot1_pri_fastbno → ⭐ FLASH DE COMPETENCIA de R1 (= top_robot2_pri_fastbno).
;   • top_robot1_pri_xval    → BANCO de R1: + centinela/cross-validación (= top_robot2_pri_xval).
[env:top_robot1_pri]
extends = env:top
build_flags = ${env:top.build_flags} -DROBOT1 -DTOP_ENABLE_MULTI_TOF -DTOP_ENABLE_HCSR04
    -DVL53L7CX_DISABLE_AMBIENT_PER_SPAD -DVL53L7CX_DISABLE_NB_SPADS_ENABLED
    -DVL53L7CX_DISABLE_SIGNAL_PER_SPAD -DVL53L7CX_DISABLE_RANGE_SIGMA_MM
    -DVL53L7CX_DISABLE_REFLECTANCE_PERCENT -DVL53L7CX_DISABLE_MOTION_INDICATOR
    -DTOP_BNO_PRIMARY_ONLY -DTOP_USB_MONITOR -DTOP_TOF_FAST_BUS
; ⭐ 2026-06-22 (Gustavo): +bus I2C de los ToF a 400 kHz por DEFAULT (-DTOP_TOF_FAST_BUS), igual que R2.
; R1 = R2 también acá: primario BNO solo en Wire2, centinela @1 Hz en el bus de ToF → el bus rápido es
; seguro (sube a 400 SOLO durante el getRangingData() y restaura 100; ver sensors_tof.cpp). Se propaga a
; toda la familia _fastbno/_rt/_xval/... ✅ VALIDADO en R1 el 2026-06-22 (anda a 400). Rollback = top_robot1_pri_slowbus.

[env:top_robot1_pri_fastbno]
extends = env:top_robot1_pri
build_flags = ${env:top_robot1_pri.build_flags} -DTOP_BNO_FAST

; top_robot1_pri_rt — 2026-06-19 (coach, pedido Gustavo): PARIDAD RT REAL de R1 con la
; competencia de R2 (top_robot2_pri). Audit verificado por PlatformIO (pio project config):
; top_robot1_pri_fastbno NO tenia los 5 flags RT que R2 si; este env los AGREGA con -DROBOT1 ->
; resuelve byte-equivalente a top_robot2_pri salvo ROBOT1/ROBOT2. Da lo pedido (menos latencia):
;   - LECTURAS EN PARALELO: TOF_SCHED (round-robin, saltea ToF caido) + HCSR04_ASYNC (ultrasonido
;     por FSM+ISR; saca el pulseIn BLOQUEANTE de ~12 ms del loop).
;   - ENVIO INDEPENDIENTE: SNAPSHOT_TIMER (WorldSnapshot @100 Hz por IntervalTimer, DESACOPLADO
;     del jitter del loop) -> menos latencia hacia la CENTRAL.
;   - + BNO_SENTINEL (lee el 2do BNO @1 Hz, que el HW de R1 tiene) + BNO_FREEZE_DETECT (con la
;     guarda-gyro ya en codigo: baja heading_valid si el primario se clava girando).
; ⚠️ NO validado en banco R1 -> TASK-222 (los flags se validaron en R2; R1 es HW identico pero
; falta el boot-check de TASK-216 + confirmar que el freeze-detect no da falso-DEAD quieto).
; Hasta cerrar banco, el flash conservador de R1 sigue siendo top_robot1_pri_fastbno.
;   pio run -e top_robot1_pri_rt -t upload
[env:top_robot1_pri_rt]
extends = env:top_robot1_pri_fastbno
build_flags = ${env:top_robot1_pri_fastbno.build_flags} -DTOP_ENABLE_SNAPSHOT_TIMER -DTOP_ENABLE_HCSR04_ASYNC -DTOP_ENABLE_TOF_SCHED -DTOP_ENABLE_BNO_SENTINEL -DTOP_ENABLE_BNO_FREEZE_DETECT

; top_robot1_pri_slowbus — ROLLBACK / A-B del bus de ToF de R1: la MISMA build de competencia RT
; (top_robot1_pri_rt, paridad con R2) pero a 100 kHz (-DTOP_TOF_BUS_SLOW desactiva el tramo rápido).
; Para volver si a 400 hay timeouts/caídas de ToF, o para medir el A/B de loop rate (T5). Espejo de
; top_robot2_pri_slowbus.
;   pio run -e top_robot1_pri_slowbus -t upload
[env:top_robot1_pri_slowbus]
extends = env:top_robot1_pri_rt
build_flags = ${env:top_robot1_pri_rt.build_flags} -DTOP_TOF_BUS_SLOW

; top_robot1_pri_rt_notof — 2026-06-21 (coach, pedido Gustavo): el RT completo de R1
; (primario BNO @100 Hz solo en Wire2 + secundario CENTINELA @1 Hz) pero con los ToF
; SIN RANGEAR. -DTOP_TOF_NO_RANGE: el init de ToF corre completo (enumera/configura ->
; el firmware arranca bien, NO cuelga), pero NO se hace startRanging() y el tick de ToF
; se saltea -> SIN pulsos de VCSEL. Se creó para AISLAR la hipótesis "el rangeo de los ToF
; cuelga el primario" (TASK-223). VEREDICTO 2026-06-21: hipótesis REFUTADA — con los ToF
; rangeando (top_robot1_pri_rt) el heading del primario IGUAL trackea el giro; el
; "heading=0.0" era el flag bno_left_en=0, no los ToF. TASK-223 = pista falsa (el primario
; vive solo en Wire2, los ToF no lo tocan). Env queda útil para banco. OJO: NO uso -DDIAG_NO_TOF acá
; porque saltear TODO el init cuelga el boot del firmware completo (verificado 2026-06-21).
; Todo lo demás corre IGUAL que top_robot1_pri_rt: cámaras, snapshot @100 Hz, ultrasonido,
; árbitro, centinela @1 Hz. Para BANCO (probar "todo menos los ToF"); NO para jugar (sin
; rangeo no ve obstáculos por ToF).
;   pio run -e top_robot1_pri_rt_notof -t upload
[env:top_robot1_pri_rt_notof]
extends = env:top_robot1_pri_rt
build_flags = ${env:top_robot1_pri_rt.build_flags} -DTOP_TOF_NO_RANGE

[env:top_robot1_pri_xval]
extends = env:top_robot1_pri_fastbno
build_flags = ${env:top_robot1_pri_fastbno.build_flags} -DTOP_ENABLE_BNO_FREEZE_DETECT -DTOP_ENABLE_POSE_FUSION -DTOP_ENABLE_BNO_SENTINEL -DTOP_ENABLE_HEADING_XVAL

; top_robot1_pri_posefusion — 2026-06-17 (P0.3): paridad LIMPIA del estimador de pose para
; R1 (antes solo existía el de R2 + el _xval de R1 que mete sentinel+xval experimentales
; encima). Solo POSE_FUSION + FREEZE_DETECT (interlock #error exige el freeze-detect),
; SIN xval/sentinel → aísla la variable a validar. Enciende my_x/my_y reales en el snapshot
; (la pose XY que la app dibuja). ⚠️ NO promover a competencia sin BANCO (TASK-210/211):
;   1. Validar el SIGNO/eje del delta OTOS vs marco de cancha (si está mal, la pose se va al
;      girar). 2. Medir el ruido de los 4 ToF para tunear seed_tol_mm. 3. Confirmar que el
;      freeze-detector no da falso-CONGELADO con el robot quieto. Una pose XF mal anclada en
;      partido es PEOR que sin pose → por eso queda en env aparte, no en el default.
[env:top_robot1_pri_posefusion]
extends = env:top_robot1_pri_fastbno
build_flags = ${env:top_robot1_pri_fastbno.build_flags} -DTOP_ENABLE_BNO_FREEZE_DETECT -DTOP_ENABLE_POSE_FUSION

; NOTA (TA-2, TASK-211, 2026-06-14): la carga de los ToF a 1 MHz fue PROMOVIDA a DEFAULT
; en el código (src/top/sensors_tof.cpp: TOF_INIT_CLOCK_FAST_HZ, con fallback a 400 kHz),
; validada en banco por Gustavo + Virginia. Ya NO hace falta un env aparte ni el flag
; -DTOP_TOF_INIT_1MHZ: TODOS los programas de booteo del TOP (top_robot1/2, top_robot2_pri,
; etc.) arrancan a 1 MHz por default → boot ~9,6 s. El env _1mhz de banco se eliminó.

; top_robot1_bno_wire2 — PLAN B HARDWARE del freeze del BNO de R1 (banco 2026-06-11):
; BNO1 en bus PROPIO Wire2 (24/25, back-pads) = la arquitectura de robot2 (cero
; contención demostrada). Requiere mover los cables SDA/SCL del BNO a los pads
; 24/25 (alimentación queda donde está). Verificar con diag_top_i2c_scan: el BNO
; debe ackear 0x28 en Wire2.
;   pio run -e top_robot1_bno_wire2 -t upload
[env:top_robot1_bno_wire2]
extends = env:top_robot1
build_flags = ${env:top_robot1.build_flags} -DTOP_BNO1_ON_WIRE2

; central_robot2_demo — DELANTERO en ROBOT2 (rol default de R2, cuerpo validado)
; + juez desde la PC de respaldo. Motion: el stack de producción de R2 (kickstart
; + freno anticipado, SIN floor_scale — el delantero comanda velocidades altas
; donde el clamp clásico no distorsiona; no estrenar combinaciones en una demo).
[env:central_robot2_demo]
extends = env:central_robot2
; 2026-06-17: -DCENTRAL_USB_MONITOR (el hijo _demo_bb ya lo tenía explícito, redundancia inocua).
build_flags = ${env:central_robot2.build_flags} -DCENTRAL_ENABLE_MANUAL_START -DCENTRAL_USB_MONITOR

; *_bb — CAJA NEGRA (2026-06-11, pedido Gustavo: "el robot se mueve para todos lados
; y no lo puedo diagnosticar a ojo"). Graba ~50 Hz × 90 s en RAM (DMAMEM, cero impacto
; en el loop): estado FSM, snapshot visto (pelota/arco/heading/línea), comando vx/vy/ω
; y PWM REAL por motor. Volcado CSV por USB: AUTOMÁTICO en cada RUN→STOP, o 'd' a
; demanda ('x' = borrar). PC: tools/blackbox/leer_caja_negra.py, o
; `pio device monitor -f log2file` y mandar el .log. Doc: docs/pruebas-banco/CAJA-NEGRA.md
;
; MONITOR USB EN VIVO (-DCENTRAL_USB_MONITOR, 2026-06-15, TASK-105, espejo de TOP/DOWN):
; además de la caja negra OFFLINE, la CENTRAL habla JSON Lines (clave de sniff
; "central":1) por USB → la app tools/monitor-base la muestra como 3ª placa (vista
; "Cerebro" + "Salud CENTRAL"): estado FSM, cmd/PWM real, salud de enlaces TOP/DOWN,
; OTOS y loop-time, EN VIVO. DORMIDO por default: silencio total hasta que la app habla
; (STREAM ON/PING); en partido (sin USB) nunca despierta → match-safe. La 'S' de "STREAM"
; NO frena el robot (main rutea las líneas al parser del monitor antes del handler g/s).
; ⚠️ Solo va en estos envs *_bb — NO en central_robot1/central_robot2 (competencia
; byte-idéntica). Sin el flag, CERO código nuevo se compila (todo #ifdef). Glue:
; src/central/central_telemetry_serial.cpp + módulo puro src/shared/telemetry_central.
[env:central_robot2_demo_bb]
extends = env:central_robot2_demo
build_flags = ${env:central_robot2_demo.build_flags} -DCENTRAL_BLACKBOX -DCENTRAL_USB_MONITOR

[env:central_robot1_arquero_demo_bb]
extends = env:central_robot1_arquero_demo
build_flags = ${env:central_robot1_arquero_demo.build_flags} -DCENTRAL_BLACKBOX -DCENTRAL_USB_MONITOR

; ============================================================
; ENVS DE PRÁCTICA 2026-06-12 (clase con alumnos, post-demo)
; Docs por alumno: docs/pruebas-banco/PRACTICA-2026-06-12-VIRGINIA-ARQUERO-R2.md
;                  docs/pruebas-banco/PRACTICA-2026-06-12-ELIAS-DELANTERO-R1.md
; ------------------------------------------------------------
; VIRGINIA — arquero integral en ROBOT2 (cuerpo sano, BNO primario OK).
; La conducta YA EXISTE (patrulla v3.3 validada + INTERCEPT/CLEAR Nivel 2);
; estos envs solo agregan la CAJA NEGRA para tunear con datos.
; 2026-06-17 (banco Gustavo): agregado -DCENTRAL_USB_MONITOR a estos 2 envs base del
; arquero R2 (Virginia). Antes solo lo llevaban los _demo_bb -> los envs de práctica de
; Virginia (_strafe_bb, _strafe_cam_bb, _noheading, _ratedamp) NO mostraban datos en la
; app de monitoreo. El monitor viaja DORMIDO (silencio por USB hasta STREAM ON de la
; app); en partido sin USB nunca despierta -> match-safe. La trampa de la 'S' está
; resuelta de raiz en main_central.cpp (parser de lineas unificado, 2026-06-17).
[env:central_robot2_arquero_patrol_bb]
extends = env:central_robot2_arquero_patrol
build_flags = ${env:central_robot2_arquero_patrol.build_flags} -DCENTRAL_BLACKBOX -DCENTRAL_USB_MONITOR

[env:central_robot2_arquero_bb]
extends = env:central_robot2_arquero
build_flags = ${env:central_robot2_arquero.build_flags} -DCENTRAL_BLACKBOX -DCENTRAL_USB_MONITOR

; 2026-06-17: R1 reconectó los 2 BNO → juega CON gyro; el flag ATK_OTOS_NOGYRO de
;   este env es FALLBACK histórico, no competencia. El texto de abajo (R1 sin gyro)
;   quedó SUPERADO; se conserva como historia del env de práctica.
; ELÍAS — delantero en ROBOT1 SIN GYRO (BNOs desconectados; R1 SÍ tiene 2 OTOS
; en DOWN → la odometría de piso reemplaza al gyro). Flags nuevos (todos OFF por
; default en el resto de los envs → R2/competencia byte-idénticos):
;  -DCENTRAL_FORCE_ROLE_ATTACKER = FSM delantero sobre hardware R1 (default GK).
;  -DATK_OTOS_NOGYRO  = eje de ataque por yaw OTOS + gatillo de empuje geométrico
;                       + empuje recto sostenido por OTOS (atk_nogyro.h, host-tested).
;  -DATK_SEARCH_SPIN_ONLY = buscar GIRANDO EN EL LUGAR (sin avance a ciegas).
; Motion: el stack R1 de producción (kickstart + pisos {70,70,107}), sin floor_scale
; (el delantero comanda velocidades altas donde el clamp clásico no distorsiona).
[env:central_robot1_delantero_practica]
extends = env:central_robot1
; 2026-06-14 (pedido Elias): SACADO -DCENTRAL_ENABLE_MANUAL_START -> el robot ya NO
; arranca/frena por teclado (g/ENTER=GO, s=STOP) en el monitor serie. GO/STOP solo
; por el arbitro real (GPIO 5/6 del TOP -> WorldSnapshot). Revertir = re-agregar el flag.
; 2026-06-17: -DCENTRAL_USB_MONITOR para ver datos en la app del monitor (hijos _bb/_obst_bb heredan).
build_flags = ${env:central_robot1.build_flags} -DCENTRAL_FORCE_ROLE_ATTACKER -DATK_OTOS_NOGYRO -DATK_SEARCH_SPIN_ONLY -DCENTRAL_USB_MONITOR

[env:central_robot1_delantero_practica_bb]
extends = env:central_robot1_delantero_practica
build_flags = ${env:central_robot1_delantero_practica.build_flags} -DCENTRAL_BLACKBOX

; 2ª INSTANCIA (recién cuando el HC-SR04 frontal esté conectado y verificado en
; el panel del TOP): freno anti-choque al avanzar. -DATK_OBSTACLE_STOP_MM=250 →
; obstáculo a <250 mm corta el componente de avance (vy>0). Umbral a tunear.
[env:central_robot1_delantero_practica_obst_bb]
extends = env:central_robot1_delantero_practica_bb
build_flags = ${env:central_robot1_delantero_practica_bb.build_flags} -DATK_OBSTACLE_STOP_MM=250

; *_nobtn — INCIDENTE práctica 2026-06-12 (banco R2): el pulsador ONBOARD del
; Zircon (pin 9, no desconectable) quedó CLAVADO → GO permanente.
; ⚠️ 2026-06-14 (pedido Gustavo, fail-safe): el botón físico pasó a estar
; DESHABILITADO POR DEFAULT en TODOS los programas (main_central.cpp solo lo lee con
; -DCENTRAL_ENABLE_PHYSICAL_BUTTON, que NINGÚN env define). Por eso estos *_nobtn son
; REDUNDANTES: -DCENTRAL_MANUAL_START_NO_BUTTON quedó como flag MUERTO (no-op). Se
; conservan solo por compatibilidad de nombres (strafe_bb extiende _bb_nobtn). Podés
; flashear directo los base (_bb / _patrol_bb): el botón ya está OFF igual. GO/STOP por
; teclado serie ('g'/'s'/ENTER) o por la app del árbitro.
[env:central_robot2_arquero_patrol_bb_nobtn]
extends = env:central_robot2_arquero_patrol_bb
build_flags = ${env:central_robot2_arquero_patrol_bb.build_flags} -DCENTRAL_MANUAL_START_NO_BUTTON

[env:central_robot2_arquero_bb_nobtn]
extends = env:central_robot2_arquero_bb
build_flags = ${env:central_robot2_arquero_bb.build_flags} -DCENTRAL_MANUAL_START_NO_BUTTON

; central_robot2_arquero_strafe_bb — ARQUERO SIMPLE (pedido María, práctica
; 2026-06-12): -DGK_SIMPLE_STRAFE reemplaza la patrulla v3.3 por strafe lateral
; PURO manteniendo el frente con el BNO (omega continuo, no pulsos) + rebote por
; línea lateral (línea derecha→va izquierda). SIN retroceso al arco, SIN pelota.
; Hereda FLOOR_SCALE + juez-PC + botón deshabilitado + caja negra del arquero R2.
; Volver a la patrulla v3.3 = flashear central_robot2_arquero_patrol_bb_nobtn.
[env:central_robot2_arquero_strafe_bb]
extends = env:central_robot2_arquero_bb_nobtn
build_flags = ${env:central_robot2_arquero_bb_nobtn.build_flags} -DGK_SIMPLE_STRAFE

; central_robot2_arquero_strafe_cam_bb — el strafe + CÁMARA (pedido María 2026-06-14):
; -DGK_SIMPLE_BALL agrega, sobre el strafe, conducta de pelota: CERCA → despeje hacia
; adelante; LEJOS → seguir de costado a la pelota para quedar enfrente (acotado por las
; líneas, no se abre); sin pelota → patrulla de siempre. El strafe_bb (sin este flag)
; queda byte-idéntico → flashealo para volver al strafe puro.
[env:central_robot2_arquero_strafe_cam_bb]
extends = env:central_robot2_arquero_strafe_bb
; ⚠️ TEMPORAL (pedido María 2026-06-14): PID de rumbo (BNO) DESCONECTADO en ESTE MISMO programa.
; El control de rumbo PFM estaba "muy feo" en banco → se trabaja SIN BNO POR AHORA, sin cambiar de
; env (mismo nombre, misma lógica: strafe + pelota + escape de línea). -DGK_STRAFE_NO_PFM = omega=0
; (no corrige el giro). 🔧 PARA REACTIVAR EL PID: borrar `-DGK_STRAFE_NO_PFM` de la línea de abajo
; y reflashear. (El BNO igual se lee para la geometría de la línea, no para girar.)
build_flags = ${env:central_robot2_arquero_strafe_bb.build_flags} -DGK_SIMPLE_BALL -DGK_STRAFE_NO_PFM

; central_robot2_arquero_strafe_cam_app — IGUAL que _strafe_cam_bb (escape + pelota +
; caja negra) PERO SIN el juez-PC: NO lleva -DCENTRAL_ENABLE_MANUAL_START → no hay 'g'/'s'/
; ENTER por teclado. GO/STOP SOLO por la app del juez (GPIO 5/6 del TOP). Pedido María
; 2026-06-14: el 'g'/'s' por USB es un override (match = referí OR teclado) y un GO de
; teclado podía pisar el STOP de la app. Sin manual-start, la app manda sola.
; ⚠️ Sin teclado NO hay fallback: si la app no arranca el robot, no arranca por nada.
; La caja negra sigue (vuelca el CSV en RUN→STOP de la app). Volver al teclado = _cam_bb.
[env:central_robot2_arquero_strafe_cam_app]
extends = env:central_robot2
; 2026-06-17: -DCENTRAL_USB_MONITOR para ver datos en la app durante test con árbitro real.
build_flags = ${env:central_robot2.build_flags} -DCENTRAL_FORCE_ROLE_GOALKEEPER -DCENTRAL_FLOOR_SCALE -DCENTRAL_BLACKBOX -DGK_SIMPLE_STRAFE -DGK_SIMPLE_BALL -DCENTRAL_USB_MONITOR

; central_robot2_arquero_strafe_cam_noheading — EXPERIMENTO DE DIAGNÓSTICO (banco María
; 2026-06-14): igual que _cam_bb (teclado g/s para arrancar fácil) PERO con el control de
; rumbo PFM APAGADO (-DGK_STRAFE_NO_PFM → omega=0 en el strafe, como diag_central_strafe).
; OBJETIVO: aislar la causa de la "medialuna". Si con esto el strafe va DERECHO → la causa
; era el PFM (sobre-corrige), NO los motores. Si SIGUE arqueando → es motores/cinemática.
; NO es para competencia — es para encontrar el origen del problema.
[env:central_robot2_arquero_strafe_cam_noheading]
extends = env:central_robot2_arquero_strafe_cam_bb
build_flags = ${env:central_robot2_arquero_strafe_cam_bb.build_flags} -DGK_STRAFE_NO_PFM

; central_robot2_arquero_strafe_cam_ratedamp — RATE-DAMP (coach 2026-06-14, P1):
; agrega amortiguación por velocidad de giro al control de rumbo PFM del strafe
; (-DGK_PFM_RATE_DAMP → la "D" de un PD). Resta la velocidad de giro estimada de
; muestras FRESCAS de rumbo (heading_rate.h) para frenar el sobrepaso que la latencia
; del rumbo provoca (la "medialuna"). Sin el flag (= _strafe_cam_bb) queda BYTE-IDÉNTICO.
; Combina con top_robot2_pri_fastbno (menos latencia + más amortiguación = el ataque
; completo a la oscilación). 🔧 Tunear GK_PFM_KD_RATE (hoy 0,30) en banco con la caja
; negra. Doc: docs/firmware/CONTROL-ARQUERO-LATERAL-Y-LATENCIAS.md (P1).
;   pio run -e central_robot2_arquero_strafe_cam_ratedamp -t upload
; ⚠️ FIX 2026-06-15 (merge prolijo): este env PRUEBA la amortiguación P1 (la "D") → necesita el PFM
; PRENDIDO. NO hereda de _cam_bb porque ese HOY lleva -DGK_STRAFE_NO_PFM (temporal, María) y el
; #ifdef GK_STRAFE_NO_PFM hace return 0 ANTES del bloque rate-damp → la "D" quedaba CÓDIGO MUERTO.
; Base = _strafe_bb (PFM on) + pelota (-DGK_SIMPLE_BALL) + rate-damp. (Cuando _cam_bb recupere el
; PFM se puede volver a heredar de él.)
[env:central_robot2_arquero_strafe_cam_ratedamp]
extends = env:central_robot2_arquero_strafe_bb
build_flags = ${env:central_robot2_arquero_strafe_bb.build_flags} -DGK_SIMPLE_BALL -DGK_PFM_RATE_DAMP

; --- central_robot2_strafe_slew_bb: rampa de motores (Capa 2 lazo RT) sobre el strafe ---
; BANCO post-Incheon (B3/C4 RT 2026-06-15): habilita -DCENTRAL_MOTOR_SLEW sobre el strafe
; del arquero con caja negra para VER el arranque rampado en el CSV (vx sube en pendiente,
; no en escalón). Los reflejos (freno de borde, STOP) BYPASEAN la rampa por diseño. Tunear
; la pendiente con -DCENTRAL_SLEW_DVX/DVY/DW (defaults conservadores en main_central.cpp).
; ⚠️ NO ES DE COMPETENCIA. central_robot1/2 quedan byte-idénticos (el flag NO se hereda).
[env:central_robot2_strafe_slew_bb]
extends = env:central_robot2_arquero_strafe_cam_bb
build_flags = ${env:central_robot2_arquero_strafe_cam_bb.build_flags} -DCENTRAL_MOTOR_SLEW

; ============================================================
; CENTRAL ROBOT 2 (delantero) — mismo firmware, otro pinout de motores
;
; TÉCNICAS DE MOTION LATERAL — ACTIVAS EN PRODUCCIÓN (✅ VALIDADAS EN BANCO ROBOT2
; 2026-06-09, Gustavo, diag_central_strafe_robot2_kick: piso {70,70,107} + impulso
; {130,130,140}x40ms + freno anticipado trasera 66 ms — "anda bien").
;  -DCENTRAL_MOTOR_KICKSTART  = impulso inicial en cada transición parado→comando
;     (motor_kickstart.cpp entra por +<shared/>, el filtro no necesita cambios).
;  -DCENTRAL_REAR_BRAKE_LEAD  = compila motors_set_rear_cut(); en producción la FSM
;     todavía NO la llama (no hay evento fin-de-tramo en control continuo) → no-op.
;     Glue futuro = tema-a-analizar. Ver el comentario largo en [env:central_robot1].
; ============================================================
[env:central_robot2]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -DROBOT2
    -DCENTRAL_MOTOR_KICKSTART
    -DCENTRAL_REAR_BRAKE_LEAD
    -DCENTRAL_TOP_RX_BIGBUF
    -std=gnu++17
    -I src/shared
build_unflags = -std=gnu++11
build_src_filter = +<central/> +<shared/>
; 2026-06-16 (quick-wins RT B+C aplicados, autorizados por Gustavo para banco arquero R2):
;   • QUITADO -DCENTRAL_DEBUG_SERIAL: el bloque de ~30 Serial.print cada 500 ms en el
;     loop de motores SE FUE → cero pico de jitter periódico por USB CDC. La salud por
;     USB queda disponible via el monitor DORMIDO (-DCENTRAL_USB_MONITOR en envs *_bb).
;   • AGREGADO -DCENTRAL_TOP_RX_BIGBUF: ring del RX de Serial7 (TOP→CENTRAL) sube de
;     64 B a 512 B → ~13 frames de colchón → 0 descartes silenciosos del WorldSnapshot
;     bajo carga. Costo: 512 B SRAM (de 512 KB disponibles). NO cambia lógica.
; Diff de compilación verificada limpia. BANCO valida que loop_us(max) baja y
; resync_events del link TOP cae a ~0 en 5 min de partido (criterio plan A-H del doc
; CENTRAL-RT-ESTADO-Y-CIERRE-2026-06-16.md).
; lib_deps: Adafruit BNO055 + BusIO + Unified Sensor VENDOREADAS en lib/
; (ver lib/README.md). PlatformIO las detecta solas; NO toca el registry.

; ============================================================
; central_robot2_arquero — la FSM del ARQUERO sobre el HARDWARE de robot2
;
; Caso (2026-06-09): robot1 en reparación → el arquero se prueba en el CUERPO de
; robot2. Hereda TODO el hardware de central_robot2 (pines, MOTOR_INVERT {+1,+1,+1},
; piso {70,70,107}, impulso, freno anticipado) y SOLO fuerza el rol GOALKEEPER.
; ⚠️ NO usar central_robot1 para esto (su MOTOR_INVERT invertiría el M2 de robot2).
; TOP y DOWN no cambian: siguen con top_robot2 / down_robot2.
;   pio run -e central_robot2_arquero -t upload         (arquero en robot2)
;   pio run -e central_robot2_arquero_slow -t upload    (ídem al 70% — primera corrida)
; Para volver al DELANTERO: pio run -e central_robot2 -t upload (solo la CENTRAL).
; ============================================================
; -DCENTRAL_FLOOR_SCALE (2026-06-09): piso por ESCALADO UNIFORME + eficiencia por rueda
; (motor_floor_scale.h, puro+testeado) en lugar del clamp por-rueda — el clamp se comía
; las correcciones de gyro a velocidad de patrulla y el arquero PERDÍA EL FRENTE.
; Strafe puro cae EXACTO en la mezcla validada {70,70,107}; correcciones finas PASAN.
; Solo en los envs del arquero hasta validar en banco (el delantero sigue con el clamp).
;
; -DCENTRAL_ENABLE_MANUAL_START (2026-06-10): JUEZ DESDE LA PC — la app del juez no
; siempre funciona en banco. Con el monitor de la CENTRAL abierto:
;   ENTER o 'g' = GO  ·  's' = STOP (la FSM vuelve a WAIT_START → 'g' re-arranca todo).
; SOLO envs de banco. En competencia NO va (el GO llega de la app del juez por GPIO).
[env:central_robot2_arquero]
extends = env:central_robot2
; 2026-06-17: -DCENTRAL_USB_MONITOR (los _bb que heredan ya lo tenían/agregaron 2026-06-17).
build_flags = ${env:central_robot2.build_flags} -DCENTRAL_FORCE_ROLE_GOALKEEPER -DCENTRAL_FLOOR_SCALE -DCENTRAL_ENABLE_MANUAL_START -DCENTRAL_USB_MONITOR

; central_robot2_arquero_pulse — DEBUG de banco: arquero v3.3 con el strafe de patrulla PULSADO
; (-DGK_PATROL_PULSE): mueve ~120 ms, para ~300 ms (vel MEDIA ~57 mm/s) para OBSERVAR si rebota
; apenas DOWN ve la linea lateral. ⚠️ Bajar la velocidad NO frena (piso PWM la clava); por eso se
; pulsa. En el monitor: el campo fsm_state debe FLIPEAR MOVE->STOP al detectar la linea, con
; down_line_fresh=FRESH. Tunear: -DGK_PATROL_PULSE_OFF_MS=400 (mas lento) o =200 (menos a tirones).
; central_robot2_arquero (competencia) queda byte-identico (sin el flag). NO es de partido; banco.
;   pio run -e central_robot2_arquero_pulse -t upload
[env:central_robot2_arquero_pulse]
extends = env:central_robot2_arquero
build_flags = ${env:central_robot2_arquero.build_flags} -DGK_PATROL_PULSE

; central_robot2_arquero_strafe_pid — BANCO (Gustavo 2026-06-17): arquero v3.3 con los DOS
; cambios nuevos detrás de -DGK_STRAFE_PID + -DCENTRAL_REAR_TRIM:
;  (1) STRAFE CONTINUO con heading-hold por modulación de la rueda TRASERA (PI sobre el
;      heading del TOP, target 0; pequeñas correcciones). El impulso fuerte (pulso de
;      reorientación) queda SOLO para cuando el rumbo se sale de la banda (GK_STRAFE_BAND_DEG).
;  (2) Al tocar línea: escape OPUESTO a MÁXIMA potencia (GK_LINE_ESCAPE_SPEED_MM_S=600),
;      estado BLOQUEADO 2 s (GK_LINE_ESCAPE_MS) — no cambia por pelota/línea/pose; el STOP
;      del árbitro SÍ lo frena. Retoma al salir de la línea pasados los 2 s.
; ⚠️ BANCO: confirmar el SIGNO del trim (GK_REAR_TRIM_SIGN; si corrige al revés, -1) y tunear
;   GK_STRAFE_KP/KI/BAND/TRIM_MAX. central_robot2_arquero (competencia) queda byte-idéntico.
;   pio run -e central_robot2_arquero_strafe_pid -t upload
[env:central_robot2_arquero_strafe_pid]
extends = env:central_robot2_arquero
build_flags = ${env:central_robot2_arquero.build_flags} -DGK_STRAFE_PID -DCENTRAL_REAR_TRIM
; central_robot2_arquero_pingpong — BANCO (Gustavo 2026-06-18): LOGICA SIMPLE izquierda<->derecha.
; Reemplaza la patrulla v3.3 (que hacia churn: se detenia a reorientar y RETROCEDIA) por una FSM
; MINIMA: GOTO_LINE posiciona una vez; despues strafe CONTINUO arrancando a la IZQUIERDA, y al
; TOCAR la linea (clasificada en marco cancha) escapa al OPUESTO a maxima potencia 2 s. NO usa
; pelota, NO retrocede, NO se detiene a media patrulla. 2026-06-18: MANEJO DIRECTO por PWM (raw3,
; bloque GK_PWM_* en strategy.cpp), SIN control de giroscopo (no -DCENTRAL_REAR_TRIM) y SIN control
; de posicion Y (no -DGK_Y_HOLD) -> es el BANCO PARA TUNEAR LAS VELOCIDADES CRUDAS, sin que ningun
; control confunda. El giroscopo solo se LEE para clasificar linea de fondo vs lateral (no controla
; potencia). Para sumar los controles encima, usar central_robot2_arquero_pingpong_trim_yhold.
; central_robot2_arquero (competencia) queda byte-identico.
;   pio run -e central_robot2_arquero_pingpong -t upload
[env:central_robot2_arquero_pingpong]
extends = env:central_robot2_arquero
build_flags = ${env:central_robot2_arquero.build_flags} -DGK_PINGPONG

; central_robot2_arquero_pingpong_trim — BANCO (Gustavo 2026-06-18): el MISMO pingpong que ANDA
; (izq<->der + escape) PERO con el heading-hold por modulacion de la rueda TRASERA prendido
; (-DCENTRAL_REAR_TRIM). Sobre el strafe simple suma un PI chico (GK_STRAFE_KP/KI) sobre el
; heading del TOP (target GK_GYRO_HOLD_TARGET_DEG) que suma/resta hasta +-30 PWM a la trasera
; para que el robot NO derive de rumbo durante la patrulla. NUNCA frena (ignora out_of_band) y en
; el escape el trim es 0. El env base central_robot2_arquero_pingpong (strafe PURO) queda intacto
; como respaldo conocido-bueno. ⚠️ NO validado en HW. En banco:
;   (1) CONFIRMAR el signo: si corrige al reves, agregar -DGK_REAR_TRIM_SIGN=-1 al build_flags.
;   (2) tunear GK_STRAFE_KP/KI/TRIM_MAX en strategy.cpp.
;   (3) el heading del TOP llega ~4 Hz / ~250 ms viejo -> conviene flashear la TOP en paralelo con
;       top_robot2_pri_hpredict (heading-predict) para que el trim no corrija con dato viejo.
; Volver atras = reflashear central_robot2_arquero_pingpong (strafe puro). Competencia byte-identica.
;   pio run -e central_robot2_arquero_pingpong_trim -t upload
[env:central_robot2_arquero_pingpong_trim]
extends = env:central_robot2_arquero_pingpong
; 2026-06-18: el signo (-1) quedó como DEFAULT en strategy.cpp:419 (confirmado banco), no hace falta flag aca.
build_flags = ${env:central_robot2_arquero_pingpong.build_flags} -DCENTRAL_REAR_TRIM

; central_robot2_arquero_pingpong_trim_yhold — BANCO (Gustavo 2026-06-18): trim + heading-hold MAS un
; control LENTO de PROFUNDIDAD (-DGK_Y_HOLD): mezcla un vy chico al strafe (pequeña diagonal al fondo)
; para que el arquero NO derive hacia adelante. Usa la Y de la pose del TOP (world_model_get_my_y_mm)
; condicionada a la confianza (>=50); si la localizacion no es confiable, vy=0 y degrada a la patrulla del trim.
; EMA + deadband + clamp (vy<=20 mm/s) = correccion lenta que NO pelea con el heading-hold.
; ⚠️ DEPENDE de que la localizacion XY del TOP de Y/confianza sanos: ANTES de confiar, mirar en el
; monitor que my_y y confidence sean razonables con el robot en la cancha. Tunear
; GK_Y_HOLD_TARGET_MM/KP/DEADBAND en strategy.cpp. Volver atras = central_robot2_arquero_pingpong_trim.
;   pio run -e central_robot2_arquero_pingpong_trim_yhold -t upload
[env:central_robot2_arquero_pingpong_trim_yhold]
extends = env:central_robot2_arquero_pingpong_trim
build_flags = ${env:central_robot2_arquero_pingpong_trim.build_flags} -DGK_Y_HOLD

[env:central_robot2_arquero_slow]
extends = env:central_robot2
build_flags = ${env:central_robot2.build_flags} -DCENTRAL_FORCE_ROLE_GOALKEEPER -DCENTRAL_FLOOR_SCALE -DCENTRAL_SLOW_MOTION -DCENTRAL_ENABLE_MANUAL_START -DCENTRAL_USB_MONITOR

; central_robot2_arquero_patrol — SOLO PATRULLA (banco): ignora la pelota por completo
; (-DGK_IGNORE_BALL: PATROL nunca pasa a INTERCEPT/CLEAR). Para validar retroceso +
; despegue + patrulla lateral + límites de pose SIN que la pelota (real o falso
; positivo naranja) secuestre el test. La prueba CON pelota usa central_robot2_arquero.
[env:central_robot2_arquero_patrol]
extends = env:central_robot2
build_flags = ${env:central_robot2.build_flags} -DCENTRAL_FORCE_ROLE_GOALKEEPER -DCENTRAL_FLOOR_SCALE -DGK_IGNORE_BALL -DCENTRAL_ENABLE_MANUAL_START -DCENTRAL_USB_MONITOR

; ============================================================
; diag_down — DIAGNÓSTICO de hardware de la placa DOWN (banco)
; NO es firmware de competencia. Carga esto, abrí Serial Monitor a 115200,
; y verificás en vivo que los sensores de luz responden uno por uno.
;   pio run -e diag_down -t upload
; Este env ya compila la placa fixeada (4 muxes = 32 sensores + 2 OTOS) vía los
; -D de abajo. El fallback de config_down.h (sin -D) sería 1 mux = 8 sensores.
; ============================================================
[env:diag_down]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_DOWN
    -DDOWN_NUM_MUXES_CONNECTED=4   ; placa FIXEADA (4 muxes = 32 sensores)
    -DDOWN_NUM_OTOS_CONNECTED=2    ; los 2 OTOS soldados (U5 + U6), activado 2026-05-24
    -std=gnu++17
    -I src/shared
    -I src/down       ; el diag incluye config_down.h / line_ring.h / otos.h
build_unflags = -std=gnu++11
; lib_deps: SparkFun Qwiic OTOS + SparkFun_Toolkit VENDOREADAS en lib/
; (ver lib/README.md y el comentario de [env:down]). PIO LDF las detecta
; solas; NO toca el registry. Vendoreadas 2026-05-29 (TASK-302). 100% offline.
; Compila SOLO el entry de diagnóstico de DOWN (main_diag_down.cpp) + los módulos
; de DOWN y shared que necesita. EXCLUYE main_down.cpp (firmware vivo, su propio
; setup()/loop()).
; ⚠️ NO usar `+<diag/>` (glob de toda src/diag/): arrastra diags de CENTRAL/TOP que
;   (a) necesitan config_central.h/config_top.h fuera de este include path y
;   (b) traen su propio setup()/loop() (multiple definition). Cada diag tiene su
;   propio [env]; este SOLO compila el de DOWN. (Fix 2026-06-05; antes el glob con
;   exclusiones se quedaba stale al agregarse diags nuevos y rompía el build.)
build_src_filter = +<diag/main_diag_down.cpp> +<down/> -<down/main_down.cpp> +<shared/>

; ============================================================
; test_native — tests unitarios en host (sin hardware)
; Corre con: pio test -e test_native
; Filtros: pio test -e test_native -f test_proto
;          pio test -e test_native -f test_kinematics
; ============================================================
[env:test_native]
platform = native
test_framework = unity
; NOTA: `test_framework = unity` SIEMPRE resuelve throwtheswitch/Unity desde
; el registry de PlatformIO — no hay forma de vendorearlo (probado: symlink://
; no lo evita). Unity es chico (~2 s de descarga con red). Para correr los
; tests host sin red, aplicar la excepción Avast (TASK-025). Esto NO afecta a
; los FIRMWARES (top/down/central): esos usan las libs vendoreadas en lib/ y
; compilan 100% offline. Hay copia de respaldo de Unity en lib/Unity.
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I src/shared
build_src_filter = +<shared/>
test_build_src = yes

; ============================================================
; test_native_earlyev — MISMO host-test pero compilando src/shared con
; -DDOWN_EARLY_EVIDENCE para ejercer el PATH GATEADO de F3 en dm_update (la unión
; por vecino físico). test_filter acota a la carpeta test_down_early_evidence: así
; NO recorre todos los tests con el flag (que cambia el comportamiento de dm_update)
; — sólo el test que justamente verifica el camino gateado. El mismo archivo de test
; corre TAMBIÉN bajo test_native (sin el flag) y ahí verifica la byte-identidad
; (line_present=0 para el mismo input) vía un #ifdef. Doble cobertura, un solo test.
;   pio test -e test_native_earlyev
; ============================================================
[env:test_native_earlyev]
extends = env:test_native
build_flags = ${env:test_native.build_flags} -DDOWN_EARLY_EVIDENCE
test_filter = test_down_early_evidence

; ============================================================
; diag_top_i2c_scan — Escaner I2C de los 2 buses (Wire + Wire1) de la placa
; TOP. PRIMER paso de bring-up de los ToF: ver que responde en cada bus sin
; tocar ningun pin LPn. No depende del HAL (-DROBOT no hace falta).
;
;   pio run -e diag_top_i2c_scan -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_top_i2c_scan]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_top_i2c_scan.cpp>

; ============================================================
; diag_top_tof_quad_live — Lee los 4 ToF a la vez (lib Adafruit). Enumera con
; LP pins {9,10,11,12} activo-ALTO (confirmados en banco 2026-05-30), carga el
; firmware de cada uno, y dumpea distancia media de los 4 simultaneamente.
; Sirve para confirmar que los 4 MIDEN y mapear direccion -> posicion fisica
; (tapando cada sensor). PROCEDIMIENTO: flashear -> QUITAR Y REPONER ENERGIA
; (las direcciones I2C persisten entre resets) -> abrir monitor.
;
;   pio run -e diag_top_tof_quad_live -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_top_tof_quad_live]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_top_tof_quad_live.cpp>

; ============================================================
; diag_top_tof_zonemap — Imprime la grilla 8x8 cruda de cada ToF para verificar
; la ORIENTACION INTERNA de sus zonas (arriba/abajo, izq/der). Critico para el
; ToF izquierdo (otro fabricante, montado mirando abajo). Marca [###] la zona
; mas cercana. Comandos serie: 0/1/2/3 (un sensor) o 'a' (los 4). Para el
; barrido tipo lidar-360. PROCEDIMIENTO: flashear -> power-cycle -> monitor.
;
;   pio run -e diag_top_tof_zonemap -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_top_tof_zonemap]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
    -I "src/shared"
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_top_tof_zonemap.cpp>

; ============================================================
; diag_sensors_tof_live — Test del modulo MIGRADO src/top/sensors_tof.cpp
; Reusa la API publica del modulo vivo (sensors_tof_init/tick/get_distance)
; pero compila aislado (sin main_top, sin camaras, sin IMU). Permite validar
; la migracion stub -> Adafruit en banco con Teensy 4.0 + 1 ToF + 1 HC-SR04
; (opcional, si no hay HC-SR04 retorna TOF_NO_READING y no rompe).
;
; Ver journal/2026-05-24-hardware-up-top-tof-frontal-resuelto.md.
;
; ⚠️ NO compilar el env BASE directo (`diag_sensors_tof_live`): falta -DROBOT1/-DROBOT2
;    y hardware_profile.h tira #error. Usar las variantes _robot1 / _robot2:
;   pio run -t clean -e diag_sensors_tof_live_robot1
;   pio run -e diag_sensors_tof_live_robot1 -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_sensors_tof_live]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
    -I src/top         ; para resolver "sensors_tof.h" + "config_top.h"
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_sensors_tof_live.cpp> +<top/sensors_tof.cpp>

; ============================================================
; diag_localization_live — DIAGNOSTICO del modulo localization en banco.
; NO es firmware de competencia. Reusa la API publica del modulo vivo
; (localization_runtime_init/tick/get_pose) pero compila aislado (sin
; main_top, sin camaras, sin comm). Permite validar la trilateracion
; con el robot real puesto a mano en posiciones conocidas de la cancha.
;
;   pio run -t clean -e diag_localization_live
;   pio run -e diag_localization_live -t upload
;   pio device monitor -b 115200
;
; REQUISITO HARDWARE: bodge XSHUT debe estar hecho para que los 4 TOFs
; tengan direcciones I2C distintas. Sin el bodge, solo funciona con
; TOF[0] frontal (los otros 3 devuelven TOF_NO_READING).
; ============================================================
[env:diag_localization_live]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
    -I src/top
    -I src/shared
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_localization_live.cpp>
                   +<top/localization_runtime.cpp>
                   +<top/sensors_tof.cpp>
                   +<top/sensors_imu.cpp>
                   +<shared/localization.cpp>

; ============================================================
; diag_central_motors — Test individual de los 3 motores del Zircon Rev v15
; (placa CENTRAL, Teensy 4.1). NO es firmware de competencia.
;
; Para qué sirve:
;   - Validar EN BANCO que los 3 H-bridges del Zircon funcionan.
;   - Mapear qué número de motor del firmware (1/2/3) corresponde a qué
;     rueda física del robot. Cada motor se prueba uno a la vez con onda
;     PWM (sentido horario, 0 → 128 → 0 → 128 → 0).
;   - Diagnosticar empíricamente el conflicto pines 7/8 (motor 2 vs Serial2
;     hacia DOWN). Si el motor 2 (driver U17) NO se mueve, los pines 7/8 son
;     Serial2 y no del motor. Ver central-board-pack/01-pinout-y-hardware §8.
;
; Uso:
;   pio run -t clean -e diag_central_motors
;   pio run -e diag_central_motors -t upload
;   pio device monitor -b 115200
;
; Operativa: apretás el botón de la placa (pin 9) y va avanzando motor por
; motor. Cada apretón pasa al siguiente. Cuarto apretón = fin.
;
; ⚠️  SUJETÁ EL ROBOT o ponelo con las ruedas al aire — puede salir disparado
;     del banco si lo dejás suelto.
;
; Flag opcional:
;   -DDIAG_MOTORS_REVERSE   ; invierte el sentido de prueba (antihorario)
;
; Doc operativo: docs/firmware/DIAG-CENTRAL-MOTORS.md
; ============================================================
[env:diag_central_motors]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -DBOARD_CENTRAL_DIAG
    -std=gnu++17
build_unflags = -std=gnu++11
; Sólo este sketch — no incluye config_central.h ni nada del firmware vivo
; (es agnóstico al rol y no quiere arrastrar dependencias).
build_src_filter = +<diag/diag_central_motors.cpp>

; ============================================================
; diag_central_atras_adelante — avance/retroceso simple (sketch de Elías)
;
; Para qué sirve:
;   Test de banco minimalista: mueve los motores 1 y 2 hacia ATRÁS 2 s y luego
;   ADELANTE 2 s, en lazo abierto (sin PID, sin cinemática). Chequeo rápido de
;   que esos H-bridges energizan y giran.
;
; Renombrado + env agregado por el coach para que sea compilable/flasheable
; desde el repo (el archivo venía sin extensión). LÓGICA DEL SKETCH SIN CAMBIOS.
;
; Build:
;   pio run -e diag_central_atras_adelante -t upload
;   pio device monitor -b 19200
;
; OJO seguridad: arranca solo al ENCENDER (sin botón) y va para ATRÁS primero.
;   Sujetá el robot / ruedas al aire. PWM 50/255 (~20%). NO mueve el motor 3.
;   (Para validar los 3 motores uno por uno: env:diag_central_motors.)
; ============================================================
[env:diag_central_atras_adelante]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -std=gnu++17
build_unflags = -std=gnu++11
; Sólo este sketch — standalone, no arrastra nada del firmware vivo.
build_src_filter = +<diag/diag_central_atras_adelante.cpp>

; ============================================================
; diag_central_drive_robot1 / robot2 — Avance recto adelante/atrás con PID heading
;
; Para qué sirve:
;   Validar end-to-end la cadena de movimiento del CENTRAL:
;     WorldSnapshot (Serial1 desde TOP) -> world_model -> HeadingPID ->
;     kinematics inversa omni-3 -> motors_zircon (PWM a Zircon).
;
;   Botón pin 9 controla: WAITING -> FORWARD 3s -> PAUSED 1s -> REVERSE 3s -> DONE.
;
; Pre-requisitos: TASK-036 cerrada + placa TOP corriendo y mandando snapshots
; por Serial1. Cadena DOWN->TOP no es estrictamente requerida para este sketch.
;
; Diferencia con env:central_robot{1,2}:
;   - Compila SOLO el sketch + módulos shared mínimos (no FSM, no IMU, no strategy).
;   - No depende de strategy.cpp / behind_ball / cameras_fusion / line_filters.
;
; Build:
;   pio run -t clean -e diag_central_drive_robot1
;   pio run -e diag_central_drive_robot1 -t upload      ; arquero
;   pio run -e diag_central_drive_robot2 -t upload      ; delantero
;   pio device monitor -b 115200
;
; Flags opcionales:
;   -DDIAG_DRIVE_SPEED_MM_S=200    velocidad (default 300)
;   -DDIAG_DRIVE_DURATION_MS=2000  duración por dirección (default 3000)
;   -DDIAG_DRIVE_WITH_LINE         habilita comm_down + abort por imminent_exit.
;                                  Requiere conflicto pines 7/8 RESUELTO.
;
; Doc operativo: docs/firmware/DIAG-CENTRAL-DRIVE.md
; ============================================================
[env:diag_central_drive_robot1]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -DROBOT1
    -DBOARD_CENTRAL_DIAG
    -std=gnu++17
    -I src/shared
    -I src/central
build_unflags = -std=gnu++11
; lib_deps: Adafruit BNO055 + BusIO + Unified Sensor VENDOREADAS en lib/ —
; PIO LDF las detecta solas (igual que env:central_robot1).
build_src_filter = +<diag/diag_central_drive_straight.cpp>
                   +<central/world_model.cpp>
                   +<central/comm_top.cpp>
                   +<central/comm_down.cpp>
                   +<central/motors_zircon.cpp>
                   +<shared/pids.cpp>
                   +<shared/kinematics.cpp>
                   +<shared/proto.cpp>
                   +<shared/crc16.cpp>

[env:diag_central_drive_robot2]
extends = env:diag_central_drive_robot1
build_flags =
    -DROBOT2
    -DBOARD_CENTRAL_DIAG
    -std=gnu++17
    -I src/shared
    -I src/central

; ============================================================
; diag_central_strafe_robot1 / robot2 — Patrulla LATERAL del arquero (banco)
;
; Mueve el robot de costado (vx): ~30cm izquierda -> pausa -> ~30cm derecha ->
; pausa -> loop. Base del arquero. OPEN-LOOP: omega=0 (el CENTRAL NO tiene BNO y
; los OTOS van DOWN->TOP, NO a CENTRAL -> sin feedback de heading). Para un omni
; con ruedas parejas, omega=0 = traslada sin rotar. Test de mitad inferior:
; motores + CENTRAL + cinematica. Distancia OPEN-LOOP por tiempo.
; [v2 = heading-hold con OTOS: requiere mensaje nuevo DOWN->CENTRAL, ver doc.]
;
;   pio run -e diag_central_strafe_robot1 -t upload      ; arquero
;   pio run -e diag_central_strafe_robot2 -t upload      ; delantero
;   pio device monitor -b 115200
;
; Flags: -DDIAG_STRAFE_SPEED_MM_S=200  -DDIAG_STRAFE_DISTANCE_MM=400  -DDIAG_STRAFE_INVERT_LR
;        -DDIAG_STRAFE_REAR_LEAD_MS=66 (ventana del freno anticipado de la trasera)
;
; TÉCNICAS DE MOTION LATERAL ACTIVAS desde 2026-06-09 (validadas banco robot2 en
; diag_central_strafe_robot2_kick): KICKSTART (impulso fijo {130,130,140}x40ms) +
; REAR_BRAKE_LEAD (corta la trasera en los últimos 66 ms del tramo — acá SÍ está
; cableado: el sketch llama motors_set_rear_cut()).
; ⚠️ R1: técnicas de motion lateral ACTIVAS (valores de robot2) — A VERIFICAR EN BANCO R1.
; build_src_filter EXPLÍCITO → necesita +<shared/motor_kickstart.cpp> (sin él, link error).
;
; Doc: docs/firmware/DIAG-CENTRAL-STRAFE.md
; ============================================================
[env:diag_central_strafe_robot1]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -DROBOT1
    -DBOARD_CENTRAL_DIAG
    -DCENTRAL_MOTOR_KICKSTART
    -DCENTRAL_REAR_BRAKE_LEAD
    -std=gnu++17
    -I src/shared
    -I src/central
build_unflags = -std=gnu++11
; lib_deps: Adafruit BNO055 + BusIO + Unified Sensor VENDOREADAS en lib/ (LDF las detecta).
build_src_filter = +<diag/diag_central_strafe.cpp>
                   +<central/motors_zircon.cpp>
                   +<shared/kinematics.cpp>
                   +<shared/motor_kickstart.cpp>

[env:diag_central_strafe_robot2]
extends = env:diag_central_strafe_robot1
; Técnicas de motion lateral ACTIVAS (✅ validadas en ESTE robot, banco 2026-06-09).
; El build_src_filter (con motor_kickstart.cpp) se hereda de robot1.
build_flags =
    -DROBOT2
    -DBOARD_CENTRAL_DIAG
    -DCENTRAL_MOTOR_KICKSTART
    -DCENTRAL_REAR_BRAKE_LEAD
    -std=gnu++17
    -I src/shared
    -I src/central

; diag_central_strafe_robot2_kick — el MISMO strafe de robot2 + IMPULSO INICIAL anti-inercia
; (técnica 2025, módulo motor_kickstart host-testeado). Este env fue el VEHÍCULO del banco
; 2026-06-09 (barrido de pisos 42→107 + impulso fijo + freno trasera — "anda bien").
; ⚠️ DESDE 2026-06-09 ES REDUNDANTE: diag_central_strafe_robot2 (y robot1, y los envs de
; producción central_robot*) ya traen -DCENTRAL_MOTOR_KICKSTART y -DCENTRAL_REAR_BRAKE_LEAD
; DE SERIE. Se conserva como histórico de banco (mismo binario que robot2 hoy).
;   pio run -e diag_central_strafe_robot2_kick -t upload
[env:diag_central_strafe_robot2_kick]
extends = env:diag_central_strafe_robot2
build_flags =
    -DROBOT2
    -DBOARD_CENTRAL_DIAG
    -DCENTRAL_MOTOR_KICKSTART
    -DCENTRAL_REAR_BRAKE_LEAD
    -std=gnu++17
    -I src/shared
    -I src/central
build_src_filter = +<diag/diag_central_strafe.cpp>
                   +<central/motors_zircon.cpp>
                   +<shared/kinematics.cpp>
                   +<shared/motor_kickstart.cpp>

; ============================================================
; diag_central_arbitro_strafe_robot1 / robot2 — Patrulla lateral GATILLADA POR EL ARBITRO
;
; Espera el START del arbitro (match_running del WorldSnapshot del TOP, Serial7):
; al recibirlo, ~30cm IZQUIERDA -> pausa 3 s -> ~30cm DERECHA -> pausa 3 s -> loop.
; STOP del arbitro -> frena y espera. START de nuevo -> retoma desde la izquierda.
; OPEN-LOOP (omega=0, sin BNO), distancia por TIEMPO. Override de banco por Serial:
; 's' = START manual, 'x' = STOP manual (para probar el movimiento sin COMM/TOP).
; Mismos caveats de cinematica que diag_central_strafe (puede dar circulos hasta
; calibrar WHEEL_ANGLES_DEG / reconciliar M2 — ver TASK-101).
