build_src_filter = +<diag/diag_top_comm_down.cpp> +<top/comm_down.cpp> +<shared/proto.cpp> +<shared/crc16.cpp>

; ============================================================
; Variantes de BANCO para las features de confiabilidad gateadas (auditoría
; 2026-06-05 batch 2). Son ADITIVAS: NO cambian central_robot1 / down. Probarlas
; en banco; si pasan, mover el -D al env de competencia.
; ============================================================
[env:central_robot1_wdt]
extends = env:central_robot1
build_flags = ${env:central_robot1.build_flags} -DCENTRAL_ENABLE_WDT
; Watchdog de hardware (WDOG1, 1 s) en la CENTRAL R1. Validar: 30 min de marcha sin
; reset espurio + auto-reset al colgar el loop a propósito (WDOG1_WRSR).

[env:central_robot2_wdt]
extends = env:central_robot2
build_flags = ${env:central_robot2.build_flags} -DCENTRAL_ENABLE_WDT
; 2026-06-17 (P0.1): paridad del watchdog para R2 (antes solo existía el de R1). WDOG1 1 s,
; feed cada vuelta del loop (main_central.cpp). El loop normal corre rápido (>>1 Hz), así
; que el riesgo de reset espurio es bajo; aun así se VALIDA en banco antes de promover el
; flag al env de competencia (central_robot1/central_robot2). Plan de banco:
;   1. 30 min de marcha continua → 0 resets espurios (mirar WDOG1_WRSR al boot).
;   2. Hang test: env central_robot1_wdt_hangtest cuelga el loop a propósito → WDOG1 debe
;      resetear en ~1 s. (Hacer el equivalente para R2 si se quiere; el código es compartido.)
; Si pasa → mover -DCENTRAL_ENABLE_WDT a central_robot1 y central_robot2 (default competencia).

; ── ENVS DE CALIBRACIÓN (2026-06-17): potencias de rueda / avance / PID en EEPROM,
;    configurables desde el monitor USB SIN reflashear (-DCENTRAL_EEPROM_CALIB sobre un env
;    que ya trae -DCENTRAL_USB_MONITOR). El panel "Calibrar CENTRAL" de la app manda
;    SET MINPWM/EFF/FWDL/FWDR/GKP/GKI/GKD + GET + SAVE. Flujo de banco:
;      1. pio run -e central_robotN_arquero_calib -t upload
;      2. abrir python -m monitor_base → vista "Calibrar CENTRAL" → ajustar y GUARDAR.
;      3. power-cycle → confirmar que la calibración PERSISTE (sale de EEPROM al boot).
;    HOY se APLICAN min_pwm + eff (el strafe lateral); fwd_pwm + PID gyro se GUARDAN pero su
;    efecto se cablea en el próximo incremento. El binario de PARTIDO (central_robot1/2) NO
;    lleva el flag → usa los constexpr (byte-idéntico). Para que la calibración sirva EN
;    COMPETENCIA: agregar -DCENTRAL_EEPROM_CALIB a central_robot1/2 tras validar en banco.
[env:central_robot2_arquero_calib]
extends = env:central_robot2_arquero
build_flags = ${env:central_robot2_arquero.build_flags} -DCENTRAL_EEPROM_CALIB

[env:central_robot1_arquero_calib]
extends = env:central_robot1_arquero_demo
build_flags = ${env:central_robot1_arquero_demo.build_flags} -DCENTRAL_EEPROM_CALIB

; central_robot2_arquero_cleardir_bb — BANCO P-C (auditoría robustez 2026-06-17): despeje
; DIRECCIONAL del arquero (-DGK_CLEAR_DIRECTIONAL). En CLEAR empuja la pelota hacia la BANDA
; más lejana del arco propio (clear_aim, módulo puro host-tested) en vez de DERECHO → evita el
; autogol de dejarla en el medio del área. Caja negra para VER el despeje. Fallback exacto si el
; arco propio no es visible (= empuje derecho de hoy). ⚠️ NO PROMOVER A COMPETENCIA hasta validar
; en banco que el goal_own_angle de la CÁMARA TRASERA es confiable (la "J/U" del retroceso quedó
; abierta 2026-06-09). Si el ángulo del arco propio es basura, despeja al lado equivocado.
;   pio run -e central_robot2_arquero_cleardir_bb -t upload
[env:central_robot2_arquero_cleardir_bb]
extends = env:central_robot2_arquero_bb
build_flags = ${env:central_robot2_arquero_bb.build_flags} -DGK_CLEAR_DIRECTIONAL

[env:down_wdt]
extends = env:down
build_flags = ${env:down.build_flags} -DDOWN_ENABLE_WDT
; Watchdog de hardware en DOWN. Validar boot sin reset (otos_init + calib son lentos)
; + auto-reset al desconectar un OTOS en caliente.

[env:down_robot2_wdt]
extends = env:down_robot2
build_flags = ${env:down_robot2.build_flags} -DDOWN_ENABLE_WDT
; 2026-06-17 (auditoría robustez, #1): paridad del watchdog para R2 (down_robot2, sin OTOS).
; Antes solo existía down_wdt (R1). Mismo plan de banco que down_wdt. R2 NO tiene OTOS → el
; boot es más rápido (sin otos_init) → menor riesgo de reset espurio. ⚠️ NO se promueve el
; flag al binario de partido (down/down_robot2) hasta validar en banco: 30 min de marcha sin
; reset espurio + hang-test que confirme WDOG1_WRSR. Recién ahí mover -DDOWN_ENABLE_WDT al base.

[env:down_lean]
extends = env:down
build_flags = ${env:down.build_flags} -DDOWN_LEAN_LINE_PIPELINE
; Apaga el pipeline de filtros de línea muerto (solo lo leen los diags) → libera CPU
; en DOWN. Wire IDÉNTICO (LineStatusV2 sale de dm_update). NO usar en diags.

; ============================================================
; Envs agregados 2026-06-06 (cards de banco — docs/pruebas-banco/).
; Todos ADITIVOS: no cambian los envs de competencia (ROBOT1 byte-idéntico).
; ⚠️ Diags/hook Arduino: NO compilados en el gate host — verificar con `pio run -e <env>`.
; ============================================================

[env:down_robot2]
extends = env:down
build_flags = ${env:down.build_flags} -DDOWN_NUM_OTOS_CONNECTED=0
; ROBOT2 (delantero): NO tiene OTOS (no llegaron). El -D posterior PISA el =2 de
; env:down (el último -D gana en la línea de comando). otos.cpp ya guarda NUM_OTOS=0.
; ⚠️ Los warnings "DOWN_NUM_OTOS_CONNECTED redefined" al compilar este env son
; ESPERADOS e inofensivos (doble -D en la línea de comando; gana el 0). NO intentar
; silenciarlos con -U: PlatformIO reordena los flags y la macro puede quedar SIN
; definir → default 1 = binario INCORRECTO (probado y revertido, banco 2026-06-11).
; → odometría/pose N/A y los consumidores caen al fallback exacto (drive_straight,
; GK paralelo, cross_track). Card: docs/pruebas-banco/DOWN.md DOWN-8.

; ============================================================
; ⭐ ROBOT2 BASE (DOWN) — COMPLETO (RT) + RESPALDO (mismo patrón que el TOP)
; ============================================================
; Pedido Gustavo 2026-06-16: el programa BUENO de robot2 = el COMPLETO (mejoras RT del lazo de
; línea ON), con el anterior como RESPALDO (espejo de top_robot2_pri / top_robot2_pri_anterior).
; ⚠️ ROBOT2 NO TIENE OTOS (down_robot2: NUM_OTOS=0) → el cuello "luz demorada por el OTOS" NO
;    aplica a robot2 (otos_tick es no-op). Lo que mejora acá: BARRIDO DE LUZ ~717→~126 µs (F1) +
;    fail-safe de geometría (F4) + detección TEMPRANA de borde (F3) + RX endurecido (F5).
; ⚠️ Estas mejoras NO están validadas en banco todavía (es lo que vas a PROBAR). Si algo se porta
;    mal, el ESCAPE es flashear el respaldo `down_robot2`. El monitor USB viaja DORMIDO (igual que
;    [env:down]): enchufás USB + abrís la app y streamea; sin USB nunca despierta (match-safe).
;   • down_robot2          ← ⛑ RESPALDO: robot2 base SIN las mejoras RT (el anterior).
;   • down_robot2_rt       ← ⭐ COMPLETO: robot2 base con las mejoras RT del lazo de línea (el BUENO).
;   • down_robot2_rt_bench ← BANCO: el completo + loop-monitor + debug serial (loop_us/scan_us a 4 Hz).
;     pio run -e down_robot2_rt -t upload    (el completo → placa base)
;     pio run -e down_robot2 -t upload       (volver al respaldo si algo falla)
[env:down_robot2_rt]
extends = env:down_robot2
build_flags = ${env:down_robot2.build_flags}
    -DDOWN_ADC_FAST -DDOWN_ADC_DUAL -DDOWN_EARLY_EVIDENCE -DDOWN_RELIABLE_GATE -DDOWN_RX_HARDEN

[env:down_robot2_rt_bench]
extends = env:down_robot2_rt
build_flags = ${env:down_robot2_rt.build_flags} -DDOWN_LOOP_MONITOR -DDOWN_DEBUG_SERIAL

; down_rt — 2026-06-17: el RT completo para ROBOT1 (paridad con down_robot2_rt, que es de R2).
; CLAVE: R1 SÍ tiene OTOS → el spike I²C del OTOS (3-4 ms) demoraba la lectura de luz (el cuello
; "la línea tarda en detectarse" del banco del domingo). Por eso este env SUMA -DDOWN_OTOS_FAST_I2C
; (400 kHz + burst → spike <0,6 ms) además de las mejoras de R2: ADC_FAST+DUAL (barrido 717→126 µs),
; EARLY_EVIDENCE (F3, el aviso de línea sale ANTES sin esperar 6 sensores), RELIABLE_GATE, RX_HARDEN.
; ⚠️ NO validado en banco → es lo que se PRUEBA. Escape = flashear `down` (respaldo R1). El binario
; de partido de R1 sigue siendo [env:down] (byte-idéntico) hasta promover esto tras banco (TASK-111).
;   pio run -e down_rt -t upload        (el completo RT → placa base de R1)
;   pio run -e down -t upload           (volver al respaldo R1 si algo falla)
[env:down_rt]
extends = env:down
build_flags = ${env:down.build_flags}
    -DDOWN_ADC_FAST -DDOWN_ADC_DUAL -DDOWN_OTOS_FAST_I2C -DDOWN_EARLY_EVIDENCE -DDOWN_RELIABLE_GATE -DDOWN_RX_HARDEN

[env:down_rt_bench]
extends = env:down_rt
build_flags = ${env:down_rt.build_flags} -DDOWN_LOOP_MONITOR -DDOWN_DEBUG_SERIAL

