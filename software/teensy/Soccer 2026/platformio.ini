; ============================================================
; diag_top_bno — MOVIDO a _deprecated/ (2026-06-04). Asumía arquitecturas I2C viejas
; (BNO derecho en Wire1 REMAP 24/25, y luego "ambos BNO en Wire, el derecho 0x29 fallado")
; que YA NO EXISTEN. ARQUITECTURA ACTUAL (unificada 2026-06-15, ambos robots): 2 BNO
; @ 0x28 en buses SEPARADOS — primario en Wire2 (24/25, sin ToF), secundario en Wire
; (18/19, con ToF). NO hay ningún BNO en 0x29; AMBOS chips están SANOS. Ya no tiene [env].
; Para verificar los BNO en banco HOY usá: [env:diag_bno_dual_live] (fusión de los 2,
; degrada a 1) o [env:diag_bno_left] (solo el primario, incl. sentido de giro).
; ============================================================

; ============================================================
; diag_bno_left — Test DIRECTO del BNO055 primario (0x28) SOLO (no toca el secundario, Wire 0x28).
; Lee crudo (lib Adafruit): yaw + giroscopio + calibracion en vivo, para diagnosticar el
; heading clavado. Duerme los ToF (LP low) para limpiar el bus. SEGURO con 1 solo BNO.
;   pio run -e diag_bno_left -t upload ; pio device monitor -b 115200
; ============================================================
[env:diag_bno_left]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_bno_left.cpp>

; ============================================================
; diag_bno_tof / _slow — BISECT: BNO 0x28 + 4 ToF ACTIVOS en el MISMO bus Wire (sin
; camaras/HCSR04/fusion). Aisla la coexistencia BNO+ToF en I2C. NOTA (2026-06-15): el
; PRIMARIO ya vive aparte en Wire2 (sin ToF); este diag ejercita al SECUNDARIO (Wire) + ToF.
; _slow = igual pero a 100 kHz (para ver si bajar la velocidad lo arregla).
;   pio run -e diag_bno_tof -t upload        (400 kHz) ; power-cycle ; monitor
;   pio run -e diag_bno_tof_slow -t upload   (100 kHz)
; ============================================================
[env:diag_bno_tof]
