; PlatformIO Project Configuration File
;
; Robot IITA Soccer Open RoboCup 2026 — multi-environment
;
; - teensy41_legacy : código viejo en src/main.cpp (Teensy 4.1, robot nacional 2025)
; - top             : firmware nuevo placa TOP (Teensy 4.0, master)
; - down            : firmware nuevo placa DOWN (Teensy 4.0, slave sensores)
;
; Para compilar uno específico:
;   pio run -e top
;   pio run -e down
;   pio run -e teensy41_legacy
;
; Para subir:
;   pio run -e top -t upload
;
; Documentación: docs/coach-system/, research/in-progress/2026-05-10-diseno-firmware-3-placas.md

[platformio]
; HAL refactor 2026-05-29: el env :top "pelado" ya no compila — exige
; -DROBOT1 o -DROBOT2 explícito. Default switcheado a top_robot1.
default_envs = top_robot1

; ============================================================
; LEGACY — código del robot nacional 2025 (NO TOCAR)
; ============================================================
[env:teensy41_legacy]
platform = teensy
board = teensy41
framework = arduino
build_flags = -DLEGACY_ROBOT
build_src_filter = +<main.cpp>
lib_deps = adafruit/Adafruit BNO055@^1.6.4

; ============================================================
; TOP — placa nueva, Teensy 4.0, master del robot
; ============================================================
[env:top]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP
    -std=gnu++17
    -I src/shared
build_unflags = -std=gnu++11
build_src_filter = +<top/> +<shared/>
; lib_deps: Adafruit BNO055 + BusIO + Unified Sensor están VENDOREADAS en lib/
; (código fuente podado, commiteado al repo — ver lib/README.md). PlatformIO
; las detecta solas vía LDF; NO se bajan del registry. Esto desbloquea a
; quien tenga Avast/SSL roto (TASK-025). ToF: cuando llegue el hardware.

; ============================================================
; DOWN — placa nueva, Teensy 4.0, slave sensores
; ============================================================
; Flags opcionales (defaults conservadores, ver config_down.h):
;   -DDOWN_NUM_MUXES_CONNECTED=4   → placa fixeada con todos los muxes
;   -DDOWN_NUM_OTOS_CONNECTED=2    → ambos OTOS conectados
;
; Por ahora compilamos con default (1 mux + 1 OTOS) para placa 04-12 actual.
[env:down]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_DOWN
    ; Placa de competencia = la fixeada: 4 muxes (32 sensores) + 2 OTOS.
    ; Validada en banco 2026-05-24 (0 sensores muertos). F2 de la auditoria 2026-05-31:
    ; sin esto el default era 1 mux = 8 de 32 sensores (3/4 del anillo ciego).
    -DDOWN_NUM_MUXES_CONNECTED=4
    -DDOWN_NUM_OTOS_CONNECTED=2
    -std=gnu++17
    -I src/shared
build_unflags = -std=gnu++11
build_src_filter = +<down/> +<shared/>
; lib_deps: SparkFun Qwiic OTOS + su dependencia SparkFun_Toolkit están
; VENDOREADAS en lib/ (fuente podado, commiteado — ver lib/README.md).
; PlatformIO las detecta solas vía LDF; NO se bajan del registry. Vendoreadas
; 2026-05-29 (TASK-302): al activar OTOS el 2026-05-24 (TASK-012) era la única
; lib de firmware sin vendorear, y eso rompía el build offline bajo Avast
; (TASK-025 — CRYPT_E_NO_REVOCATION_CHECK al tocar el registry). Ahora [env:down]
; compila 100% offline igual que top/central.

; ============================================================
; down_debug — [env:down] + print de bring-up por USB (NO es competencia)
; Igual que el firmware real de DOWN pero con -DDOWN_DEBUG_SERIAL: imprime por el
; Serial USB, a ~4 Hz: ¿HAY LINEA? (SI/NO, line_present del DownModel) + pose de
; los 2 OTOS (x/y/hdg, L/R) + contadores tx_ok/drop hacia CENTRAL. Sirve para
; validar SIN la placa CENTRAL que DOWN detecta linea y lee los OTOS, moviendo el
; robot sobre el blanco. 4 muxes (32 sensores) + 2 OTOS = placa fixeada.
;   pio run -e down_debug -t upload
;   pio device monitor -b 115200
; ============================================================
[env:down_debug]
extends = env:down
build_flags =
    ${env:down.build_flags}
    -DDOWN_DEBUG_SERIAL
    ; (4 muxes + 2 OTOS ya vienen heredados de [env:down] desde 2026-05-31)

; ============================================================
; CENTRAL ROBOT 1 (arquero) — master sobre Zircon Rev v15
; Teensy 4.1. Recibe WORLD_SNAPSHOT de ARRIBA (Serial7, pin 28) y LINE_URGENT
; de ABAJO (Serial1, pin 0). Corre FSM + PIDs + cinemática inversa.
; ============================================================
[env:central_robot1]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -DROBOT1
    -std=gnu++17
    -I src/shared
build_unflags = -std=gnu++11
build_src_filter = +<central/> +<shared/>
; lib_deps: Adafruit BNO055 + BusIO + Unified Sensor VENDOREADAS en lib/
; (ver lib/README.md). PlatformIO las detecta solas; NO toca el registry.

; ============================================================
; CENTRAL ROBOT 2 (delantero) — mismo firmware, otro pinout de motores
; ============================================================
[env:central_robot2]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -DROBOT2
    -std=gnu++17
    -I src/shared
build_unflags = -std=gnu++11
build_src_filter = +<central/> +<shared/>
; lib_deps: Adafruit BNO055 + BusIO + Unified Sensor VENDOREADAS en lib/
; (ver lib/README.md). PlatformIO las detecta solas; NO toca el registry.

; ============================================================
; diag_down — DIAGNÓSTICO de hardware de la placa DOWN (banco)
; NO es firmware de competencia. Carga esto, abrí Serial Monitor a 115200,
; y verificás en vivo que los sensores de luz responden uno por uno.
;   pio run -e diag_down -t upload
; Para placa con los 4 muxes ruteados (32 sensores), agregar al build_flags:
;   -DDOWN_NUM_MUXES_CONNECTED=4   (default: 1 mux = 8 sensores, placa 04-12)
; ============================================================
[env:diag_down]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_DOWN
    -DDOWN_NUM_MUXES_CONNECTED=4   ; placa FIXEADA (4 muxes = 32 sensores)
    -DDOWN_NUM_OTOS_CONNECTED=2    ; los 2 OTOS soldados (U5 + U6), activado 2026-05-24
    -std=gnu++17
    -I src/shared
    -I src/down       ; el diag incluye config_down.h / line_ring.h / otos.h
build_unflags = -std=gnu++11
; lib_deps: SparkFun Qwiic OTOS + SparkFun_Toolkit VENDOREADAS en lib/
; (ver lib/README.md y el comentario de [env:down]). PIO LDF las detecta
; solas; NO toca el registry. Vendoreadas 2026-05-29 (TASK-302). 100% offline.
; incluye el diag + el código de DOWN, pero EXCLUYE main_down.cpp
; (si no, habría dos setup()/loop()). También EXCLUYE diag_top_tof.cpp
; (es de la placa TOP, tiene su propio env [env:diag_top_tof]; si lo
;  incluimos, hay dos setup()/loop() y el link falla).
build_src_filter = +<diag/> -<diag/diag_top_tof.cpp> -<diag/diag_top_tof_as_l5cx.cpp> -<diag/diag_top_tof_as_l8cx.cpp> -<diag/diag_top_tof_adafruit.cpp> -<diag/diag_sensors_tof_live.cpp> -<diag/diag_localization_live.cpp> -<diag/diag_central_motors.cpp> -<diag/diag_central_drive_straight.cpp> +<down/> -<down/main_down.cpp> +<shared/>

; ============================================================
; test_native — tests unitarios en host (sin hardware)
; Corre con: pio test -e test_native
; Filtros: pio test -e test_native -f test_proto
;          pio test -e test_native -f test_kinematics
; ============================================================
[env:test_native]
platform = native
test_framework = unity
; NOTA: `test_framework = unity` SIEMPRE resuelve throwtheswitch/Unity desde
; el registry de PlatformIO — no hay forma de vendorearlo (probado: symlink://
; no lo evita). Unity es chico (~2 s de descarga con red). Para correr los
; tests host sin red, aplicar la excepción Avast (TASK-025). Esto NO afecta a
; los FIRMWARES (top/down/central): esos usan las libs vendoreadas en lib/ y
; compilan 100% offline. Hay copia de respaldo de Unity en lib/Unity.
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I src/shared
build_src_filter = +<shared/>
test_build_src = yes

; ============================================================
; diag_top_tof — DIAGNOSTICO de hardware del VL53L7CX frontal (placa TOP)
; NO es firmware de competencia. Carga esto, abri Serial Monitor a 115200,
; y verificas que el TOF mide.
;   pio run -e diag_top_tof -t upload
;
; Modos (cambiar SOLO uno):
;   -DDIAG_TOF_MODE_SINGLE   ; 1 numero promedio
;   -DDIAG_TOF_MODE_4X4      ; (default) grilla 4x4 ASCII
;   -DDIAG_TOF_MODE_8X8      ; grilla 8x8 ASCII
;
; Fallback si XSHUT pin 2 no esta ruteado:
;   -DDIAG_TOF_SKIP_XSHUT    ; asume sensor siempre alimentado
;
; Spec: docs/superpowers/specs/2026-05-24-diag-top-tof-vl53l7cx-design.md
; ============================================================
[env:diag_top_tof]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -DDIAG_TOF_MODE_4X4
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_top_tof.cpp>
; lib_deps: STM32duino_VL53L7CX vendoreada en lib/ (igual que BNO055/BusIO).
; PIO LDF la detecta sola; NO se baja del registry. 100% offline.

; ============================================================
; diag_top_tof_no_xshut — variante del env arriba con LPn/XSHUT desactivado.
; Compila pasando lpn_pin=-1 al constructor de VL53L7CX (la lib NO toca el
; pin XSHUT). Usar cuando el pin LPn del modulo Pololu NO esta ruteado al
; pin 2 del Teensy, o cuando se sospecha que el toggle XSHUT estaba
; rompiendo el init de la lib.
;   pio run -e diag_top_tof_no_xshut -t upload
; ============================================================
[env:diag_top_tof_no_xshut]
extends = env:diag_top_tof
build_flags =
    ${env:diag_top_tof.build_flags}
    -DDIAG_TOF_SKIP_XSHUT

; ============================================================
; diag_top_tof_as_l5cx — variante que prueba el sensor desconocido como VL53L5CX.
; El equipo compro L5/L7/L8 mezclados sin trazabilidad. Pololu confirma que los
; 3 carriers son fisicamente identicos. Este env carga la lib STM32duino_VL53L5CX
; y prueba si el chip en la placa TOP es un L5CX. Si init pasa -> es L5CX.
; Si falla con err=255 -> probar [env:diag_top_tof_as_l8cx] (siguiente commit).
;
;   pio run -t clean -e diag_top_tof_as_l5cx
;   pio run -e diag_top_tof_as_l5cx -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_top_tof_as_l5cx]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -DDIAG_TOF_MODE_4X4
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_top_tof_as_l5cx.cpp>

; ============================================================
; diag_top_tof_as_l8cx — tercer y ultimo candidato del trio L5/L7/L8.
; Hermano de diag_top_tof_as_l5cx pero con la lib STM32duino_VL53L8CX.
; L7CX fallo con err=255, L5CX se colgo en la carga del firmware blob.
; Resta L8CX. Si init OK -> ES L8CX. Si tambien falla -> ninguno de los 3,
; toca revisar el chip fisicamente (lupa o reemplazar el modulo).
;
;   pio run -t clean -e diag_top_tof_as_l8cx
;   pio run -e diag_top_tof_as_l8cx -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_top_tof_as_l8cx]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -DDIAG_TOF_MODE_4X4
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_top_tof_as_l8cx.cpp>

; ============================================================
; diag_top_tof_adafruit — variante usando Adafruit_VL53L7CX (no STM32duino).
; Test de control: las 3 libs ST (L5/L7/L8) fallaron en la placa del robot
; (err=255 o hang). Esta es la otra lib popular para el L7CX. Si funciona,
; el problema era de las libs ST. Si tampoco funciona, problema mas profundo
; (hardware, alimentacion, o sensor que no es L7CX genuino).
;
;   pio run -t clean -e diag_top_tof_adafruit
;   pio run -e diag_top_tof_adafruit -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_top_tof_adafruit]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_top_tof_adafruit.cpp>

; ============================================================
; diag_top_i2c_scan — Escaner I2C de los 2 buses (Wire + Wire1) de la placa
; TOP. PRIMER paso de bring-up de los ToF: ver que responde en cada bus sin
; tocar ningun pin LPn. No depende del HAL (-DROBOT no hace falta).
;
;   pio run -e diag_top_i2c_scan -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_top_i2c_scan]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_top_i2c_scan.cpp>

; ============================================================
; diag_top_tof_lp_discover — Descubre EMPIRICAMENTE a que pin del Teensy cayo
; el bodge LP de cada ToF (recableado 2026-05-30: 4 ToF en Wire, LP en los ex-INT).
; Despierta candidatos de a uno y mira cuando aparece 0x29. Autodetecta polaridad.
;
;   pio run -e diag_top_tof_lp_discover -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_top_tof_lp_discover]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_top_tof_lp_discover.cpp>

; ============================================================
; diag_top_tof_enumerate — Enumera los 4 ToF en bus unico, tolera 1 LP roto.
; Aparta el ToF "pegado" (LP no controlable) a una direccion de park, peina los
; controlables a 0x2A/0x2B/0x2C, y verifica que los 4 queden leibles a la vez.
; Hipotesis de pines LP {9,11,12,22} editable en el .cpp.
;
;   pio run -e diag_top_tof_enumerate -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_top_tof_enumerate]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_top_tof_enumerate.cpp>

; ============================================================
; diag_top_tof_census — Censo DEFINITIVO: cuenta ToF + mide control LP probando
; AMBAS polaridades automaticamente y recuperandose de direcciones persistentes.
; Supera a enumerate (que tenia ciegos de persistencia y polaridad). Reporta
; cuantos ToF se controlan por LP, con que pin, y en que polaridad.
;
;   pio run -e diag_top_tof_census -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_top_tof_census]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_top_tof_census.cpp>

; ============================================================
; diag_top_tof_quad_live — Lee los 4 ToF a la vez (lib Adafruit). Enumera con
; LP pins {9,10,11,12} activo-ALTO (confirmados en banco 2026-05-30), carga el
; firmware de cada uno, y dumpea distancia media de los 4 simultaneamente.
; Sirve para confirmar que los 4 MIDEN y mapear direccion -> posicion fisica
; (tapando cada sensor). PROCEDIMIENTO: flashear -> QUITAR Y REPONER ENERGIA
; (las direcciones I2C persisten entre resets) -> abrir monitor.
;
;   pio run -e diag_top_tof_quad_live -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_top_tof_quad_live]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_top_tof_quad_live.cpp>

; ============================================================
; diag_top_tof_zonemap — Imprime la grilla 8x8 cruda de cada ToF para verificar
; la ORIENTACION INTERNA de sus zonas (arriba/abajo, izq/der). Critico para el
; ToF izquierdo (otro fabricante, montado mirando abajo). Marca [###] la zona
; mas cercana. Comandos serie: 0/1/2/3 (un sensor) o 'a' (los 4). Para el
; barrido tipo lidar-360. PROCEDIMIENTO: flashear -> power-cycle -> monitor.
;
;   pio run -e diag_top_tof_zonemap -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_top_tof_zonemap]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
    -I "src/shared"
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_top_tof_zonemap.cpp>

; ============================================================
; diag_sensors_tof_live — Test del modulo MIGRADO src/top/sensors_tof.cpp
; Reusa la API publica del modulo vivo (sensors_tof_init/tick/get_distance)
; pero compila aislado (sin main_top, sin camaras, sin IMU). Permite validar
; la migracion stub -> Adafruit en banco con Teensy 4.0 + 1 ToF + 1 HC-SR04
; (opcional, si no hay HC-SR04 retorna TOF_NO_READING y no rompe).
;
; Ver journal/2026-05-24-hardware-up-top-tof-frontal-resuelto.md.
;
;   pio run -t clean -e diag_sensors_tof_live
;   pio run -e diag_sensors_tof_live -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_sensors_tof_live]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
    -I src/top         ; para resolver "sensors_tof.h" + "config_top.h"
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_sensors_tof_live.cpp> +<top/sensors_tof.cpp>

; ============================================================
; diag_localization_live — DIAGNOSTICO del modulo localization en banco.
; NO es firmware de competencia. Reusa la API publica del modulo vivo
; (localization_runtime_init/tick/get_pose) pero compila aislado (sin
; main_top, sin camaras, sin comm). Permite validar la trilateracion
; con el robot real puesto a mano en posiciones conocidas de la cancha.
;
;   pio run -t clean -e diag_localization_live
;   pio run -e diag_localization_live -t upload
;   pio device monitor -b 115200
;
; REQUISITO HARDWARE: bodge XSHUT debe estar hecho para que los 4 TOFs
; tengan direcciones I2C distintas. Sin el bodge, solo funciona con
; TOF[0] frontal (los otros 3 devuelven TOF_NO_READING).
; ============================================================
[env:diag_localization_live]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
    -I src/top
    -I src/shared
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_localization_live.cpp>
                   +<top/localization_runtime.cpp>
                   +<top/sensors_tof.cpp>
                   +<top/sensors_imu.cpp>
                   +<shared/localization.cpp>

; ============================================================
; diag_central_motors — Test individual de los 3 motores del Zircon Rev v15
; (placa CENTRAL, Teensy 4.1). NO es firmware de competencia.
;
; Para qué sirve:
;   - Validar EN BANCO que los 3 H-bridges del Zircon funcionan.
;   - Mapear qué número de motor del firmware (1/2/3) corresponde a qué
;     rueda física del robot. Cada motor se prueba uno a la vez con onda
;     PWM (sentido horario, 0 → 128 → 0 → 128 → 0).
;   - Diagnosticar empíricamente el conflicto pines 7/8 (motor 2 vs Serial2
;     hacia DOWN). Si el motor 2 (driver U17) NO se mueve, los pines 7/8 son
;     Serial2 y no del motor. Ver central-board-pack/01-pinout-y-hardware §8.
;
; Uso:
;   pio run -t clean -e diag_central_motors
;   pio run -e diag_central_motors -t upload
;   pio device monitor -b 115200
;
; Operativa: apretás el botón de la placa (pin 9) y va avanzando motor por
; motor. Cada apretón pasa al siguiente. Cuarto apretón = fin.
;
; ⚠️  SUJETÁ EL ROBOT o ponelo con las ruedas al aire — puede salir disparado
;     del banco si lo dejás suelto.
;
; Flag opcional:
;   -DDIAG_MOTORS_REVERSE   ; invierte el sentido de prueba (antihorario)
;
; Doc operativo: docs/firmware/DIAG-CENTRAL-MOTORS.md
; ============================================================
[env:diag_central_motors]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -DBOARD_CENTRAL_DIAG
    -std=gnu++17
build_unflags = -std=gnu++11
; Sólo este sketch — no incluye config_central.h ni nada del firmware vivo
; (es agnóstico al rol y no quiere arrastrar dependencias).
build_src_filter = +<diag/diag_central_motors.cpp>

; ============================================================
; diag_central_atras_adelante — avance/retroceso simple (sketch de Elías)
;
; Para qué sirve:
;   Test de banco minimalista: mueve los motores 1 y 2 hacia ATRÁS 2 s y luego
;   ADELANTE 2 s, en lazo abierto (sin PID, sin cinemática). Chequeo rápido de
;   que esos H-bridges energizan y giran.
;
; Renombrado + env agregado por el coach para que sea compilable/flasheable
; desde el repo (el archivo venía sin extensión). LÓGICA DEL SKETCH SIN CAMBIOS.
;
; Build:
;   pio run -e diag_central_atras_adelante -t upload
;   pio device monitor -b 19200
;
; OJO seguridad: arranca solo al ENCENDER (sin botón) y va para ATRÁS primero.
;   Sujetá el robot / ruedas al aire. PWM 50/255 (~20%). NO mueve el motor 3.
;   (Para validar los 3 motores uno por uno: env:diag_central_motors.)
; ============================================================
[env:diag_central_atras_adelante]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -std=gnu++17
build_unflags = -std=gnu++11
; Sólo este sketch — standalone, no arrastra nada del firmware vivo.
build_src_filter = +<diag/diag_central_atras_adelante.cpp>

; ============================================================
; diag_central_drive_robot1 / robot2 — Avance recto adelante/atrás con PID heading
;
; Para qué sirve:
;   Validar end-to-end la cadena de movimiento del CENTRAL:
;     WorldSnapshot (Serial1 desde TOP) -> world_model -> HeadingPID ->
;     kinematics inversa omni-3 -> motors_zircon (PWM a Zircon).
;
;   Botón pin 9 controla: WAITING -> FORWARD 3s -> PAUSED 1s -> REVERSE 3s -> DONE.
;
; Pre-requisitos: TASK-036 cerrada + placa TOP corriendo y mandando snapshots
; por Serial1. Cadena DOWN->TOP no es estrictamente requerida para este sketch.
;
; Diferencia con env:central_robot{1,2}:
;   - Compila SOLO el sketch + módulos shared mínimos (no FSM, no IMU, no strategy).
;   - No depende de strategy.cpp / behind_ball / cameras_fusion / line_filters.
;
; Build:
;   pio run -t clean -e diag_central_drive_robot1
;   pio run -e diag_central_drive_robot1 -t upload      ; arquero
;   pio run -e diag_central_drive_robot2 -t upload      ; delantero
;   pio device monitor -b 115200
;
; Flags opcionales:
;   -DDIAG_DRIVE_SPEED_MM_S=200    velocidad (default 300)
;   -DDIAG_DRIVE_DURATION_MS=2000  duración por dirección (default 3000)
;   -DDIAG_DRIVE_WITH_LINE         habilita comm_down + abort por imminent_exit.
;                                  Requiere conflicto pines 7/8 RESUELTO.
;
; Doc operativo: docs/firmware/DIAG-CENTRAL-DRIVE.md
; ============================================================
[env:diag_central_drive_robot1]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -DROBOT1
    -DBOARD_CENTRAL_DIAG
    -std=gnu++17
    -I src/shared
    -I src/central
build_unflags = -std=gnu++11
; lib_deps: Adafruit BNO055 + BusIO + Unified Sensor VENDOREADAS en lib/ —
; PIO LDF las detecta solas (igual que env:central_robot1).
build_src_filter = +<diag/diag_central_drive_straight.cpp>
                   +<central/world_model.cpp>
                   +<central/comm_top.cpp>
                   +<central/comm_down.cpp>
                   +<central/motors_zircon.cpp>
                   +<shared/pids.cpp>
                   +<shared/kinematics.cpp>
                   +<shared/proto.cpp>
                   +<shared/crc16.cpp>

[env:diag_central_drive_robot2]
extends = env:diag_central_drive_robot1
build_flags =
    -DROBOT2
    -DBOARD_CENTRAL_DIAG
    -std=gnu++17
    -I src/shared
    -I src/central

; ============================================================
; diag_central_strafe_robot1 / robot2 — Patrulla LATERAL del arquero (banco)
;
; Mueve el robot de costado (vx): ~30cm izquierda -> pausa -> ~30cm derecha ->
; pausa -> loop. Base del arquero. OPEN-LOOP: omega=0 (el CENTRAL NO tiene BNO y
; los OTOS van DOWN->TOP, NO a CENTRAL -> sin feedback de heading). Para un omni
; con ruedas parejas, omega=0 = traslada sin rotar. Test de mitad inferior:
; motores + CENTRAL + cinematica. Distancia OPEN-LOOP por tiempo.
; [v2 = heading-hold con OTOS: requiere mensaje nuevo DOWN->CENTRAL, ver doc.]
;
;   pio run -e diag_central_strafe_robot1 -t upload      ; arquero
;   pio run -e diag_central_strafe_robot2 -t upload      ; delantero
;   pio device monitor -b 115200
;
; Flags: -DDIAG_STRAFE_SPEED_MM_S=200  -DDIAG_STRAFE_DISTANCE_MM=400  -DDIAG_STRAFE_INVERT_LR
;
; Doc: docs/firmware/DIAG-CENTRAL-STRAFE.md
; ============================================================
[env:diag_central_strafe_robot1]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -DROBOT1
    -DBOARD_CENTRAL_DIAG
    -std=gnu++17
    -I src/shared
    -I src/central
build_unflags = -std=gnu++11
; lib_deps: Adafruit BNO055 + BusIO + Unified Sensor VENDOREADAS en lib/ (LDF las detecta).
build_src_filter = +<diag/diag_central_strafe.cpp>
                   +<central/motors_zircon.cpp>
                   +<shared/kinematics.cpp>

[env:diag_central_strafe_robot2]
extends = env:diag_central_strafe_robot1
build_flags =
    -DROBOT2
    -DBOARD_CENTRAL_DIAG
    -std=gnu++17
    -I src/shared
    -I src/central

; ============================================================
; HAL refactor 2026-05-29 (Sprint A): envs por robot
; ============================================================
; El env [env:top] original ahora FALLA a compilar porque ni ROBOT1 ni
; ROBOT2 está definido en build_flags. Usar [env:top_robot1] o
; [env:top_robot2] explícitamente. Documentado por #error claro en
; hardware_profile.h.
;
; Spec: docs/superpowers/specs/2026-05-29-hal-robot-config-design.md

[env:top_robot1]
extends = env:top
; -DTOP_ENABLE_MULTI_TOF: 4 ToF (0x2A..0x2D, enumeracion por LP) ACTIVOS POR DEFAULT
; desde 2026-06-01 (decision Gustavo; validado en banco + pin 10 libre por rol-via-#define).
build_flags = ${env:top.build_flags} -DROBOT1 -DTOP_ENABLE_MULTI_TOF

[env:top_robot2]
extends = env:top
build_flags = ${env:top.build_flags} -DROBOT2 -DTOP_ENABLE_MULTI_TOF

; --- Variantes *_multitof (OBSOLETAS desde 2026-06-01) ---
; Los 4 ToF (enumeracion 0x2A..0x2D por LP) AHORA SON DEFAULT en top_robot1/top_robot2
; (validado en banco + pin 10 libre porque el rol va por #define, no por dipswitch).
; Estos envs quedan como ALIAS redundantes de top_robot1/2 (el flag duplicado es inocuo).
[env:top_robot1_multitof]
extends = env:top_robot1
build_flags = ${env:top_robot1.build_flags} -DTOP_ENABLE_MULTI_TOF

[env:top_robot2_multitof]
extends = env:top_robot2
build_flags = ${env:top_robot2.build_flags} -DTOP_ENABLE_MULTI_TOF

[env:diag_localization_live_robot1]
extends = env:diag_localization_live
build_flags = ${env:diag_localization_live.build_flags} -DROBOT1

[env:diag_localization_live_robot2]
extends = env:diag_localization_live
build_flags = ${env:diag_localization_live.build_flags} -DROBOT2

; diag_sensors_tof_live también pasa por sensors_tof.cpp -> config_top.h
; -> hardware_profile.h, así que también necesita -DROBOT1/2 explícito.
[env:diag_sensors_tof_live_robot1]
extends = env:diag_sensors_tof_live
build_flags = ${env:diag_sensors_tof_live.build_flags} -DROBOT1

[env:diag_sensors_tof_live_robot2]
extends = env:diag_sensors_tof_live
build_flags = ${env:diag_sensors_tof_live.build_flags} -DROBOT2

; ============================================================
; diag_central_comm_down — Receiver de banco del link DOWN -> CENTRAL
; (placa CENTRAL, Teensy 4.1). NO es firmware de competencia.
;
; Escucha Serial2 (RX2 = pin 7), corre el FrameDecoder del protocolo, y por
; cada frame imprime el LineStatusV2 que DOWN ya manda + salud del enlace
; (frames, CRC, resync, huecos de SEQ). Primer paso del bring-up DOWN->CENTRAL:
; validar que los bytes fluyen antes de sumar mensajes nuevos (32 sensores).
;
;   pio run -e diag_central_comm_down -t upload
;   pio device monitor -b 115200
;
; ⚠️ Cablear: DOWN TX1 (pin 1) -> CENTRAL RX2 (pin 7), GND comun. Baud 230400.
;    Serial2/pin7 es el enlace YA VALIDADO en banco (mismo UART que diag_central_recv1
;    y que comm_down de produccion). El conflicto 7/8 con el motor 2 (driver U17) solo
;    importa moviendo motores; este receiver no los maneja -> pin7 seguro. Veredicto 7/8
;    PENDIENTE de aislar (TASK-036) -> si se corren motores+comm juntos, migrar a Serial7.
;
; Doc: docs/firmware/DIAG-CENTRAL-COMM-DOWN.md
; ============================================================
[env:diag_central_comm_down]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -DBOARD_CENTRAL_DIAG
    -std=gnu++17
    -I src/shared
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_central_comm_down.cpp> +<shared/proto.cpp> +<shared/crc16.cpp>

; ============================================================
; PAR DE TEST DE ENLACE MINIMO DOWN <-> CENTRAL ("mandar un 1")
; Aisla el cable del protocolo: DOWN manda '1', CENTRAL lo recibe. Sin muxes,
; sin motores -> el pin 13 queda LIBRE como LED en ambos, y esquiva el conflicto
; de pines 7/8 (TASK-036) porque el receiver NO inicializa motores.
; Cableado: DOWN pin 1 (TX1) -> CENTRAL pin 7 (RX2) + GND comun. Baud 230400.
;   DOWN:    pio run -e diag_down_send1   -t upload   (Teensy 4.0)
;   CENTRAL: pio run -e diag_central_recv1 -t upload  (Teensy 4.1)
;   monitor: pio device monitor -b 115200
; ============================================================
[env:diag_down_send1]
platform = teensy
board = teensy40
framework = arduino
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_down_send1.cpp>

; ============================================================
; diag_down_calibracion — Herramienta de calibracion de los 32 sensores de
; linea (placa DOWN, Teensy 4.0). NO es firmware de competencia.
; Calibra verde/blanco por comandos del monitor y GUARDA en EEPROM. Pensada
; para usar en cancha. Usa las funciones reales del firmware (line_ring +
; eeprom_calib), asi lo calibrado es lo que despues usa el firmware.
;   pio run -e diag_down_calibracion -t upload
;   pio device monitor -b 115200
; Comandos: c=verde b=blanco t=probar s=guardar v=ver m=sospechosos l=cargar x=borrar h=ayuda
; ============================================================
[env:diag_down_calibracion]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_DOWN
    -DDOWN_NUM_MUXES_CONNECTED=4    ; placa fixeada (32 sensores)
    -DDOWN_NUM_OTOS_CONNECTED=2
    -std=gnu++17
    -I src/shared
    -I src/down
build_unflags = -std=gnu++11
; Incluye el sketch + el codigo de DOWN que usa (line_ring, eeprom_calib),
; pero EXCLUYE main_down.cpp (si no, dos setup()/loop()).
build_src_filter = +<diag/diag_down_calibracion.cpp> +<down/> -<down/main_down.cpp> +<shared/>

[env:diag_central_recv1]
platform = teensy
board = teensy41
framework = arduino
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_central_recv1.cpp>

; ============================================================
; diag_central_line_sweep — Barrido lateral por tiempo + freno por linea
; (placa CENTRAL, Teensy 4.1). NO es firmware de competencia.
;
; SEGUNDO paso del bring-up DOWN->CENTRAL: tras validar la recepcion con
; diag_central_comm_down, este sketch suma los MOTORES. Recibe LineStatusV2 de
; DOWN por Serial7 (RX7 = pin 28) con el protocolo real, hace un barrido lateral
; (4 s derecha / 4 s izquierda, arranca/para con boton pin 9) usando la
; cinematica inversa real, y FRENA ante salida inminente / robot levantado /
; enlace caido.
;
;   pio run -e diag_central_line_sweep_robot1 -t upload   ; arquero
;   pio run -e diag_central_line_sweep_robot2 -t upload   ; delantero
;   pio device monitor -b 115200      ; <-- 115200, NO 230400
;
; Cablear: DOWN TX1 (pin 1) -> CENTRAL RX7 (pin 28), GND comun. Baud 230400.
; Se recibe por Serial7 (no Serial2) para esquivar el conflicto pines 7/8 con
; el motor 2 (TASK-036): asi los motores usan 7/8 libremente.
;
; Flags opcionales:
;   -DSWEEP_SPEED_MM_S=200      velocidad lateral (default 250)
;   -DSWEEP_HALF_PERIOD_MS=4000 tiempo por lado en ms (default 4000)
;   -DSWEEP_REQUIRE_LINE        exige line_present para moverse (default OFF)
; ============================================================
[env:diag_central_line_sweep_robot1]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -DROBOT1
    -DBOARD_CENTRAL_DIAG
    -std=gnu++17
    -I src/shared
    -I src/central
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_central_line_sweep.cpp>
                   +<central/imu_zircon.cpp>
                   +<shared/proto.cpp>
                   +<shared/crc16.cpp>

[env:diag_central_line_sweep_robot2]
extends = env:diag_central_line_sweep_robot1
build_flags =
    -DROBOT2
    -DBOARD_CENTRAL_DIAG
    -std=gnu++17
    -I src/shared
    -I src/central

; --- Variante SIN freno de seguridad (solo para validar el movimiento en banco) ---
; Igual que line_sweep pero con -DSWEEP_NO_SAFETY: ignora SALIDA INMINENTE y
; LEVANTADO (el watchdog del enlace SIGUE activo). Sirve para ver el barrido
; completo de 4s a cada lado cuando la placa DOWN aun no esta calibrada y reporta
; salida inminente falsa. ⚠️ El robot NO se protege de salir de cancha: usar SOLO
; con ruedas al aire o espacio controlado. Reactivar la seguridad (env normal)
; cuando DOWN este calibrada.
;   pio run -e diag_central_line_sweep_nosafety_robot1 -t upload
[env:diag_central_line_sweep_nosafety_robot1]
extends = env:diag_central_line_sweep_robot1
build_flags =
    -DROBOT1
    -DBOARD_CENTRAL_DIAG
    -DSWEEP_NO_SAFETY
    -std=gnu++17
    -I src/shared
    -I src/central

[env:diag_central_line_sweep_nosafety_robot2]
extends = env:diag_central_line_sweep_robot1
build_flags =
    -DROBOT2
    -DBOARD_CENTRAL_DIAG
    -DSWEEP_NO_SAFETY
    -std=gnu++17
    -I src/shared
    -I src/central

; ============================================================
; diag_top_cameras — verificación enlace OpenMV → TOP (Teensy 4.0, banco)
; Lee las 2 cámaras (frontal=Serial3/RX15/U8, trasera=Serial5/RX21) con el
; parser de PRODUCCIÓN (cameras.cpp) e imprime por USB: bytes recibidos, paquetes
; decodificados, resyncs, crudo, y veredicto (SIN BYTES / FORMATO RARO / FORMATO OK).
; Verifica que el formato que mandan las cámaras es el que el TOP espera.
;   pio run -e diag_top_cameras -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_top_cameras]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -std=gnu++17
    -I src/top
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_top_cameras.cpp> +<top/cameras.cpp>

; ============================================================
; diag_top_ultrasonic — DIAGNOSTICO del HC-SR04 (ultrasonido frontal, placa TOP)
; NO es firmware de competencia. Pulsa TRIG (pin 4), mide ECHO (pin 3) con pulseIn,
; e imprime distancia en cm + salud por USB. v2 prueba ambas orientaciones de pin.
;
; ⚠️ ECHO del HC-SR04 a 5V DANA el pin 3 del Teensy (no tolera 5V). Usar divisor en
;    ECHO (1k+2k -> 3.3V). NO bajar Vcc a 3.3V (apaga el HC-SR04 clasico). Ver .cpp.
;
;   pio run -e diag_top_ultrasonic -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_top_ultrasonic]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_top_ultrasonic.cpp>

; ============================================================
; diag_top_bno — Verificacion de los 2 BNO055 (Wire + Wire1/remap 24-25).
; Prueba init IMUPLUS de AMBOS sensores, muestra heading + gyro-Z en vivo, y
; resuelve el SENTIDO DE GIRO (signo) contra la convencion del firmware.
; Comandos serial: z=recapturar cero, d=test drift 10s.
;
;   pio run -e diag_top_bno -t upload
;   pio device monitor -b 115200
; lib_deps: Adafruit BNO055 + BusIO + Unified Sensor VENDOREADAS en lib/.
; ============================================================
[env:diag_top_bno]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_top_bno.cpp>
; lib_deps: Adafruit BNO055 + BusIO + Unified Sensor VENDOREADAS en lib/ —
; PIO LDF las detecta solas, NO se bajan del registry. 100% offline (igual
; que diag_localization_live y el firmware top). NO agregar lib_deps aca:
; fuerza descarga del registry que Avast bloquea (TASK-025).

; ============================================================
; diag_bno_dual_live — Valida los 2 BNO055 + fusion de heading (promedio
; circular, desacuerdo, deteccion de impacto). Degrada a 1 BNO. Primer test a
; correr cuando se suelde el 2do BNO (RIGHT, Wire1 24/25).
; Comandos serial: z=recapturar cero, d=drift 20s.
;
;   pio run -e diag_bno_dual_live -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_bno_dual_live]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_bno_dual_live.cpp>

; ============================================================
; diag_bno_addr_check — Verifica el puente ADR del 2do BNO (arquitectura NUEVA:
; los 2 BNO en el MISMO bus Wire, uno en 0x28 y el puenteado en 0x29). Duerme
; los 4 ToF (LP 9/10/11/12 en LOW) para que no contaminen 0x29, y confirma con
; chip-id 0xA0 que lo de 0x29 es un BNO real y no un ToF.
;   PASO A: solo el BNO nuevo conectado -> esperar 0x29 = BNO (puente OK).
;   PASO B: los 2 BNO -> esperar 0x28 + 0x29, ambos BNO.
;
;   pio run -e diag_bno_addr_check -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_bno_addr_check]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_bno_addr_check.cpp>

; ============================================================
; diag_pose_live — Pose (x,y,heading) en vivo: enumera los 4 ToF + lee el BNO
; y llama al ALGORITMO REAL localization_compute() de shared/localization.cpp.
; Test de aceptacion de la Capa 1 (XY con 4 ToF) en posiciones conocidas.
; POWER-CYCLE tras flashear (direcciones I2C de ToF persisten). 'z'=fijar cero.
;
;   pio run -e diag_pose_live -t upload
;   pio device monitor -b 115200
; ============================================================
[env:diag_pose_live]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -DBOARD_TOP_DIAG
    -std=gnu++17
    -I src/shared
build_unflags = -std=gnu++11
build_src_filter = +<diag/diag_pose_live.cpp> +<shared/localization.cpp>
