    -DBOARD_DOWN
    -DDOWN_NUM_MUXES_CONNECTED=4
    -DDOWN_NUM_OTOS_CONNECTED=2
    -std=gnu++17
    -I src/shared
    -I src/down
build_unflags = -std=gnu++11
; Mide la tasa real de muestreo del anillo (objetivo 1 kHz) + carga por tick.
; Compila SOLO diag_down_cpu.cpp + down/ (excluye main_down.cpp) + shared/ — mismo
; patrón que diag_down. Para comparar robo de OTOS, build con OTOS=2 (este) vs cambiar
; el -D a =0. Card: docs/pruebas-banco/DOWN.md DOWN-4 / DOWN-9.
build_src_filter = +<diag/diag_down_cpu.cpp> +<down/> -<down/main_down.cpp> +<shared/>

[env:central_robot1_wdt_hangtest]
extends = env:central_robot1_wdt
build_flags = ${env:central_robot1_wdt.build_flags} -DCENTRAL_WDT_HANG_TEST
; SOLO banco: cuelga el loop a los ~5 s para validar que el WDOG1 resetea el Teensy
; a ~1 s (auto-recuperación). NUNCA a competencia. Card: docs/pruebas-banco/CENTRAL.md CENTRAL-7.

; [env:down_debug_telemetry] ELIMINADO 2026-06-13: quedo redundante. La telemetria USB
; de la base ahora VIVE en el binario de COMPETENCIA [env:down] (flag -DDOWN_USB_MONITOR,
; "monitor dormido"): basta conectar la app tools/monitor-base a `down` y la telemetria se
; activa SOLA; o en un monitor serie crudo, un ENTER arranca el stream 3 s. Ya no hay un env
; de banco aparte para la DOWN. (Historico recuperable en git: commit de esta eliminacion +
; journal 2026-06-13.) El macro -DDOWN_DEBUG_TELEMETRY tambien se quito del codigo.
; NOTA: los *_debug_telemetry del TOP siguen vigentes (otra placa, macro TOP_DEBUG_TELEMETRY).

[env:top_robot1_debug_telemetry]
extends = env:top_robot1
build_flags = ${env:top_robot1.build_flags} -DTOP_DEBUG_TELEMETRY
; FASE 2 — Modo DEBUG/telemetria USB de la TOP (camaras + IMU + ToF + WorldSnapshot
; fusionado) en JSON Lines, para la app de PC. ADITIVO: NO cambia el binario de
; competencia (todo el codigo nuevo esta #ifdef TOP_DEBUG_TELEMETRY). Verificar con:
; pio run -e top_robot1_debug_telemetry. NO host-compilable (Arduino). Contrato:
; docs/firmware/TELEMETRIA-TOP.md.
; ⚠️ OBSOLETO para el hardware actual: extiende top_robot1 = cableado VIEJO de R1
; (pre-recableado 2026-06-11). Usar top_robot2_pri_debug_telemetry (abajo).

; top_robot2_pri_debug_telemetry — telemetría USB sobre el env REAL de las TOPs de
; HOY (auditoría 2026-06-11: el único env de telemetría extendía top_robot1, que es
; cableado obsoleto → ninguna TOP real podía usar la app monitor-base).
;   pio run -e top_robot2_pri_debug_telemetry -t upload
[env:top_robot2_pri_debug_telemetry]
extends = env:top_robot2_pri
build_flags = ${env:top_robot2_pri.build_flags} -DTOP_DEBUG_TELEMETRY

; ─── centralmix (BANCO/PRUEBA, coach 2026-06-19) ───────────────────────────────
; Port AUTOCONTENIDO del DELANTERO 2025 (FSM + manejo DIRECTO de motores) alimentado
; por datos de TOP/DOWN via variables planas (src/centralmix/, SIN world_model). Build
; AISLADO: build_src_filter = solo centralmix + shared -> NO compila src/central/ ni toca
; ningun env existente (100% aditivo). Es una prueba para debuggear con la FSM conocida.
; ⚠️ NO validado en banco (signos de motor por rueda, re-tuneo pixeles->mm, arco rival).
; heading: BNO LOCAL en la CENTRAL por default (⚠️ R1 NO tiene BNO local -> heading_valid
; queda false). Para R1 con gyro usar el env central_robot1_mix_bno (heading del BNO del
; TOP por snapshot, abajo); SIN gyro con -DMIX_HEADING_OTOS.
; ARRANQUE (todas las builds del centralmix): el FSM empieza en KICKOFF_SEEK — ve la pelota
; -> va; si no, impulso fuerte y corto de MEDIALUNA al centro -> búsqueda. Se ejecuta 1 vez al
; inicio del partido. Tuneo en mix_config.h (MIX_KICKOFF_M1/M2/M3 + ARC_MS). Banco: TASK-116.
; Escape: cualquier env de competencia de siempre.
;   pio run -e central_robot1_mix -t upload
[env:central_robot1_mix]
extends = env:central_robot1
build_src_filter = +<centralmix/> +<shared/>
; ── Flag OPCIONAL de centralmix (APAGADO por defecto; descomentar para la prueba) ──
; Candidato de órbita rebalanceada para centrar_* (geometría 2026): reemplaza el
; centrar_*() casi-puro-strafe del port 2025 por uno rotación-dominante que orbita
; de verdad. Detalle + trade-off + tuning: src/centralmix/mix_config.h (MIX_CENTRAR_*).
; ⚠️ NO validado en banco — habilitar SOLO para la prueba de Elías y dar el OK antes
; de volverlo default. Para probar, descomentar la línea de abajo:
;build_flags = ${env:central_robot1.build_flags} -DMIX_CENTRAR_ORBIT_2026

; ─── arqueromix (BANCO/PRUEBA, coach 2026-06-21) ───────────────────────────────
; Hermano ARQUERO de centralmix: port AUTOCONTENIDO del ARQUERO 2025 (FSM 10 estados +
; manejo DIRECTO de motores) alimentado por datos de TOP/DOWN via variables planas
; (src/arqueromix/, SIN world_model). DIFERENCIA vs centralmix: el HEADING viene del
; SNAPSHOT del TOP por serie (NO de un BNO local — pedido de Virginia; las CENTRAL 2026
; no traen BNO propio). La LÍNEA/piso viene del DOWN (LineStatusV2). Build AISLADO:
; build_src_filter = solo arqueromix + shared -> NO compila src/central/ ni toca ningun
; env existente (100% aditivo). Extiende central_robot2 (Virginia juega arquero con R2;
; los pines R1/R2 son iguales en 2026). ⚠️ NO validado en banco (sentido de motores,
; signo lateral de la pelota, umbrales pixeles->mm) → TASK-114.
; heading: SNAPSHOT del TOP por default; OTOS con -DARQMIX_HEADING_OTOS.
; Escape: cualquier env de competencia del arquero (central_robot2_arquero).
;   pio run -e central_robot2_arqueromix -t upload
; ✅ El signo CORRECTO de la corrección de rumbo (banco Virginia 2026-06-21) YA es el default del
; código (AMIX_HEADING_CORRECT_SIGN=-1). Flashear directamente este env. Si alguna vez hiciera
; falta el signo VIEJO (diagnóstico), agregar -DARQMIX_HEADING_SIGN_OLD al build_flags.
[env:central_robot2_arqueromix]
extends = env:central_robot2
build_src_filter = +<arqueromix/> +<shared/>

; arqueromix con el RETROCESO DE INICIO invertido (banco Virginia 2026-06-21): si al GO el robot
; va hacia ADELANTE en vez de atrás durante el homing, flashear ESTE en lugar del de arriba.
; = base + -DARQMIX_FLIP_INICIO_RETRO.
;   pio run -e central_robot2_arqueromix_retroflip -t upload
[env:central_robot2_arqueromix_retroflip]
extends = env:central_robot2_arqueromix
build_flags = ${env:central_robot2.build_flags} -DARQMIX_FLIP_INICIO_RETRO

; arqueromix con el GIRO DE ALINEACIÓN al arco rival invertido (coach 2026-06-21). El arquero, antes
; de despejar, gira para apuntar el frente al ARCO RIVAL (goal_opp) y patea hacia ahí. Si en banco
; GIRA PARA EL LADO CONTRARIO al arco (el sentido físico de girar() depende del cableado), flashear
; ESTE en vez del base. = base + -DARQMIX_FLIP_GIRO_ALINEAR.
;   pio run -e central_robot2_arqueromix_giroflip -t upload
[env:central_robot2_arqueromix_giroflip]
extends = env:central_robot2_arqueromix
build_flags = ${env:central_robot2.build_flags} -DARQMIX_FLIP_GIRO_ALINEAR

; arqueromix en MODO QUIETO (versión de prueba, pedido Virginia 2026-06-21). El arquero hace el HOMING
; igual (retrocede → ve la línea → se adelanta para salir) y después se queda QUIETO esperando la pelota
; (NO patrulla de lado a lado). Si la ve LEJOS y DESCENTRADA, se mueve lateral para enfrentarla; si está
; ALINEADA y lejos, queda quieto; si está CERCA, despeja (igual que el default). Rebote por arco/línea +
; profundidad SIGUEN activos (si deriva, vuelve a su lugar). = base + -DARQMIX_QUIETO. El default
; (central_robot2_arqueromix) NO cambia: patrulla normal. ⚠️ NO validado en banco → lo cierra el equipo.
;   pio run -e central_robot2_arqueromix_quieto -t upload
[env:central_robot2_arqueromix_quieto]
extends = env:central_robot2_arqueromix
build_flags = ${env:central_robot2.build_flags} -DARQMIX_QUIETO

; arqueromix QUIETO + ANTICIPACIÓN (S2, versión NUEVA sobre el candidato, pedido Virginia 2026-06-22). Igual
; que _quieto pero ADEMÁS usa la VELOCIDAD de la pelota (ball_vx/vy del TOP, expuesta en g_aio) para empezar a
; moverse hacia el lado al que VIENE la pelota ANTES de que el ángulo cruce la banda muerta (no pasar por al
; lado). Sólo el SIGNO de la velocidad (la magnitud no está calibrada). = _quieto + -DARQMIX_ANTICIPA.
; El candidato de competencia (central_robot2_arqueromix_quieto) NO cambia. ⚠️ NO validado en banco.
; SIGNOS a verificar en banco: si anticipa para el lado CONTRARIO -> -DARQMIX_FLIP_BALL_VX; si anticipa cuando
; la pelota se ALEJA -> -DARQMIX_FLIP_BALL_VY. Umbrales AMIX_ANTICIPA_VX_MIN/VY_MIN a titular.
;   pio run -e central_robot2_arqueromix_quieto_anticipa -t upload
[env:central_robot2_arqueromix_quieto_anticipa]
extends = env:central_robot2_arqueromix
build_flags = ${env:central_robot2.build_flags} -DARQMIX_QUIETO -DARQMIX_ANTICIPA

; ─── centralmix con BNO del TOP (snapshot) — R1 CON gyro (coach 2026-06-21) ───────────
; IGUAL que central_robot1_mix pero el heading sale del BNO del TOP por el WorldSnapshot
; (Serial7), NO de un BNO local en la CENTRAL. R1 NO tiene BNO local (los 2 BNO viven en
; el TOP) -> este es el modo correcto para que el delantero "mix" use el gyro.
; PRE-REQUISITO: la TOP de R1 flasheada con top_robot1_pri_rt (trae el fix del BNO del
; 2026-06-21: sensors_imu.cpp:279 fuerza el primario habilitado pese a bno_left_en=0 en
; EEPROM). Heading del BNO del TOP VALIDADO en banco 2026-06-21 (reposo -15.6 -> girado
; 101.4). Resuelve el pendiente #5 de centralmix (journal 2026-06-19).
; ⚠️ NO validado en banco como DELANTERO completo -> TASK-115 (lo cierra el equipo).
; Escape: -DMIX_HEADING_OTOS (mismo delantero SIN gyro) / cualquier env de competencia.
;   pio run -e central_robot1_mix_bno -t upload
[env:central_robot1_mix_bno]
extends = env:central_robot1_mix
build_flags = ${env:central_robot1.build_flags} -DMIX_HEADING_SNAPSHOT

; ─── centraledge — RODEO estilo EDGE, R1 CON gyro (coach + Elías, 2026-06-23) ────────────
; CARPETA APARTE de centralmix (pedido de Elías: revisar Edge separado del mix 2025). Es una
; COPIA autocontenida de centralmix + el rodeo Edge (mismo patrón que centralmix vs arqueromix).
; El delantero NO usa la FSM 2025 (apuntar→avanzar→orbitar lento): usa la FSM REACTIVA estilo
; Edge (-DMIX_ATTACK_EDGE → src/centraledge/mix_fsm_edge.cpp). Se pone DETRÁS de la pelota con
; UNA fórmula amplificada a full velocidad + mira al arco + ANTICIPA con la velocidad de pelota
; del TOP, y empuja por inercia (sin pateador). Curva + perillas: src/centraledge/mix_config.h
; (bloque MIX_EDGE_*). build_src_filter = SOLO centraledge + shared → NO toca centralmix ni ningún
; env. centralmix queda PRISTINO (su FSM 2025 + el estado TEST de Elías intactos).
; ⚠️ NO validado en banco. PRIMER banco (orden): (1) sentido de mix_mover_vector (go_ang=0→frente,
; =90→derecha). (2) signo de MIX_EDGE_FACE_KP (gira ACERCÁNDOSE al arco). (3) MIX_EDGE_PUSH_DIST_CM
; en cm reales. (4) A-B del feedforward de velocidad. (5) rodeo completo. Banco: TASK-119.
; Escape: cualquier env de competencia, o central_robot1_mix_bno (mismo robot, FSM 2025).
;   pio run -e central_robot1_mix_edge -t upload
[env:central_robot1_mix_edge]
extends = env:central_robot1
build_src_filter = +<centraledge/> +<shared/>
build_flags = ${env:central_robot1.build_flags} -DMIX_HEADING_SNAPSHOT -DMIX_ATTACK_EDGE

; ─── centraledgefijo — rodeo Edge POR POSICIÓN PURA, SIN velocidad (pedido Elías 2026-06-23) ──
; IGUAL que central_robot1_mix_edge PERO el rodeo NO usa la velocidad de la pelota (ni predicción
; ni bump): solo la curva fija de amplificación de ángulo, como el rodeo SIMPLE de Edge. Carpeta
; APARTE src/centraledgefijo/ (copia de centraledge con mix_edge sin velocidad). Sirve para comparar
; en banco contra central_robot1_mix_edge (con velocidad). build_src_filter = solo centraledgefijo +
; shared → no toca ni centraledge ni centralmix. ⚠️ NO validado en banco → TASK-119.
;   pio run -e central_robot1_mix_edge_fijo -t upload
[env:central_robot1_mix_edge_fijo]
extends = env:central_robot1
build_src_filter = +<centraledgefijo/> +<shared/>
build_flags = ${env:central_robot1.build_flags} -DMIX_HEADING_SNAPSHOT -DMIX_ATTACK_EDGE
