;   pio run -e diag_central_arbitro_strafe_robot1 -t upload   ; arquero
;   pio run -e diag_central_arbitro_strafe_robot2 -t upload   ; delantero
;   pio device monitor -b 115200
;
; Flags: -DDIAG_ARB_SPEED_MM_S=200  -DDIAG_ARB_DISTANCE_MM=400  -DDIAG_ARB_PAUSE_MS=3000  -DDIAG_ARB_INVERT_LR
;        -DDIAG_ARB_REAR_LEAD_MS=66 (ventana del freno anticipado de la trasera)
;
; TÉCNICAS DE MOTION LATERAL ACTIVAS desde 2026-06-09 (validadas banco robot2, ver
; diag_central_strafe_robot2_kick): KICKSTART (impulso fijo {130,130,140}x40ms en cada
; arranque de rueda) + REAR_BRAKE_LEAD (acá SÍ cableado: el sketch corta la trasera en
; los últimos 66 ms de cada tramo, mismo patrón que diag_central_strafe).
; ⚠️ R1: técnicas de motion lateral ACTIVAS (valores de robot2) — A VERIFICAR EN BANCO R1.
; build_src_filter EXPLÍCITO → necesita +<shared/motor_kickstart.cpp> (sin él, link error).
; Doc: docs/firmware/DIAG-CENTRAL-ARBITRO-STRAFE.md
; ============================================================
[env:diag_central_arbitro_strafe_robot1]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -DROBOT1
    -DBOARD_CENTRAL_DIAG
    -DCENTRAL_MOTOR_KICKSTART
    -DCENTRAL_REAR_BRAKE_LEAD
    -std=gnu++17
    -I src/shared
    -I src/central
build_unflags = -std=gnu++11
; lib_deps: Adafruit BNO055 + BusIO + Unified Sensor VENDOREADAS en lib/ (LDF las detecta).
build_src_filter = +<diag/diag_central_arbitro_strafe.cpp>
                   +<central/world_model.cpp>
                   +<central/comm_top.cpp>
                   +<central/comm_down.cpp>
                   +<central/motors_zircon.cpp>
                   +<shared/kinematics.cpp>
                   +<shared/proto.cpp>
                   +<shared/crc16.cpp>
                   +<shared/motor_kickstart.cpp>

[env:diag_central_arbitro_strafe_robot2]
extends = env:diag_central_arbitro_strafe_robot1
; Técnicas de motion lateral ACTIVAS (✅ validadas en ESTE robot, banco 2026-06-09).
; El build_src_filter (con motor_kickstart.cpp) se hereda de robot1.
build_flags =
    -DROBOT2
    -DBOARD_CENTRAL_DIAG
    -DCENTRAL_MOTOR_KICKSTART
    -DCENTRAL_REAR_BRAKE_LEAD
    -std=gnu++17
    -I src/shared
    -I src/central

; ============================================================
; HAL refactor 2026-05-29 (Sprint A): envs por robot
; ============================================================
; El env [env:top] original ahora FALLA a compilar porque ni ROBOT1 ni
; ROBOT2 está definido en build_flags. Usar [env:top_robot1] o
; [env:top_robot2] explícitamente. Documentado por #error claro en
; hardware_profile.h.
;
; Spec: docs/superpowers/specs/2026-05-29-hal-robot-config-design.md

[env:top_robot1]
extends = env:top
; -DTOP_ENABLE_MULTI_TOF: 4 ToF (0x2A..0x2D, enumeracion por LP) ACTIVOS POR DEFAULT
; desde 2026-06-01 (decision Gustavo; validado en banco + pin 10 libre por rol-via-#define).
; 2026-06-08 (banco): en ROBOT1 el BNO comparte el bus Wire con los ToF y el yaw se CONGELABA
; en produccion (no en el diag). FIX activo:
;  -DTOP_BNO_TOF_DECONFLICT = aisla el read del BNO de los reads de ToF en el loop
;                             (main_top.cpp) -> el read no se corrompe. Es el FIX real.
; ⚠️ TOP_ENABLE_BNO_FREEZE_DETECT QUITADO 2026-06-08: con el robot QUIETO el BNO055 (fusion)
;    es tan estable que reporta el MISMO centideg -> el detector daba FALSO-DEAD y LATCHEABA
;    (heading_valid=0, hdg=0.0, no se recuperaba al girar). >>> FIX DE RAIZ 2026-06-15 (INC-1):
;    imu_freeze_update_g agrega una GUARDA DE GYRO -> solo declara congelado si el gyro probo que
;    el robot ESTABA GIRANDO mientras el heading quedo clavado (robot quieto => gyro al piso =>
;    NUNCA falso-DEAD). Ya cableado en sensors_imu.cpp bajo el mismo flag. Sigue OFF en el default;
;    re-activar = validar en banco (env de banco [env:top_robot1_bnofreeze] / [env:top_robot2_pri_bnofreeze]).
;    Detalle: src/shared/imu_freeze.h + journal 2026-06-15-integracion-rt-gateada / TASK-211.
; ROBOT2 NO lleva el deconflict: su BNO PRIMARIO esta en Wire2 (24/25, bus aparte) -> el
; heading de control no sufre contencion. ⚠️ Su SECUNDARIO si comparte Wire con los ToF
; sin deconflict (riesgo de freeze del secundario; tema-a-analizar, revision 2026-06-10).
; >>> BANCO: girar el robot y confirmar que el hdg del snapshot AHORA trackea (sin caer a 0).
; 2026-06-08: EXPERIMENTO noInterrupts (TOP_BNO_READ_NOINTERRUPTS) PROBADO Y DESCARTADO -> NO destrabo
;   el yaw. Junto con 100kHz + 20Hz + deconflict (4 band-aids), el SOFTWARE NO resuelve la contencion
;   del BNO055 en el bus Wire compartido con los ToF bajo la carga de main_top (anda en el diag, no en
;   produccion). >>> FIX DE FONDO: BNO a un bus I2C APARTE (como ROBOT2). Mover 2 cables del BNO +
;   camino de firmware con &Wire2/&Wire1 (pendiente: confirmar pines libres del TOP).
; -DVL53L7CX_DISABLE_* (banco 2026-06-10): el getRangingData() de cada ToF traia el bloque
; COMPLETO de resultados por Wire a 100 kHz (~60 ms por sensor, medido: loop del TOP a 6-16 Hz).
; Apagamos los bloques que el firmware NO usa (solo usamos distance_mm + target_status en
; mean_valid_zones) -> transferencia ~5x mas chica -> lectura ~10-15 ms. Los diags NO llevan
; estos flags (siguen viendo el struct completo). A VERIFICAR en banco robot1 al volver.
build_flags = ${env:top.build_flags} -DROBOT1 -DTOP_ENABLE_MULTI_TOF -DTOP_ENABLE_HCSR04 -DTOP_BNO_TOF_DECONFLICT -DVL53L7CX_DISABLE_AMBIENT_PER_SPAD -DVL53L7CX_DISABLE_NB_SPADS_ENABLED -DVL53L7CX_DISABLE_SIGNAL_PER_SPAD -DVL53L7CX_DISABLE_RANGE_SIGMA_MM -DVL53L7CX_DISABLE_REFLECTANCE_PERCENT -DVL53L7CX_DISABLE_MOTION_INDICATOR

[env:top_robot2]
extends = env:top
build_flags = ${env:top.build_flags} -DROBOT2 -DTOP_ENABLE_MULTI_TOF -DTOP_ENABLE_HCSR04 -DVL53L7CX_DISABLE_AMBIENT_PER_SPAD -DVL53L7CX_DISABLE_NB_SPADS_ENABLED -DVL53L7CX_DISABLE_SIGNAL_PER_SPAD -DVL53L7CX_DISABLE_RANGE_SIGMA_MM -DVL53L7CX_DISABLE_REFLECTANCE_PERCENT -DVL53L7CX_DISABLE_MOTION_INDICATOR

; --- top_robot1_bnofreeze: BANCO del freeze-detector (ROBOT1) ---
; CORRECCION 2026-06-15: el flag NO esta en el default de top_robot1 (fue QUITADO 2026-06-08;
; ver build_flags de top_robot1 arriba — no lo incluye). Este env lo AGREGA para banco. Desde
; 2026-06-15 el detector usa la GUARDA DE GYRO (imu_freeze_update_g): NO da falso-DEAD con el
; robot quieto (solo congela si el gyro prueba rotacion mientras el heading queda clavado).
; Procedimiento de banco: flashear; robot QUIETO 5 min -> heading_valid NO cae a 0; girar el
; robot con el BNO congelado (o simulado) -> cae a DEAD. PRE-REQ: medir el piso de ruido de
; |gyro_z| quieto y ajustar IMU_FREEZE_GYRO_MOTION_CDPS si hace falta (TASK-211 / TASK-210).
;   pio run -e top_robot1_bnofreeze -t upload
[env:top_robot1_bnofreeze]
extends = env:top_robot1
build_flags = ${env:top_robot1.build_flags} -DTOP_ENABLE_BNO_FREEZE_DETECT

; --- top_robot2_pri_bnofreeze: BANCO del freeze-detector (ROBOT2 / el binario que ambos corren) ---
; INC-1 RT 2026-06-15: valida la GUARDA DE GYRO en aislamiento (sin pose_fusion) sobre el env que
; ambos robots corren hoy (top_robot2_pri). Mismo procedimiento de banco que top_robot1_bnofreeze.
; Aditivo: el .bin de top_robot2_pri con y sin este flag debe diferir SOLO por el detector.
;   pio run -e top_robot2_pri_bnofreeze -t upload
[env:top_robot2_pri_bnofreeze]
extends = env:top_robot2_pri
build_flags = ${env:top_robot2_pri.build_flags} -DTOP_ENABLE_BNO_FREEZE_DETECT

; --- Variantes *_multitof (OBSOLETAS desde 2026-06-01) ---
; Los 4 ToF (enumeracion 0x2A..0x2D por LP) AHORA SON DEFAULT en top_robot1/top_robot2
; (validado en banco + pin 10 libre porque el rol va por #define, no por dipswitch).
